 q:"用途地域の中にある土地は、道路・公園・川などを除き、いまは建物が建っていない空き地や畑でも、宅建業法の「宅地」にあたる。",
 exp:`<p>宅建業法の「宅地」には、次の2つがあります。</p><p>① <b>建物の敷地</b>として使う土地（場所はどこでも）<br>② <mark>用途地域の中の土地</mark>（ただし道路・公園・河川・広場・水路は除く）</p><p>用途地域は「街にする場所」なので、今は畑でも、将来建物が建つ土地として「宅地」と扱います。</p>`,
 pt:"用途地域内の土地は、道路・公園・河川・広場・水路以外はすべて「宅地」",
 hon:"用途地域内の土地で、道路、公園、河川、広場及び水路の用に供せられているもの以外のものは、宅地に該当する。"},
{c:"gyo",lv:2,a:true,
 q:"免許の更新を申請したのに、今の免許の期限が切れる日までに結果が出ない場合、今の免許は結果が出るまで有効のままである。",
 exp:`<p>ちゃんと期限内に更新を申請したのに、役所の手続きが遅れたせいで仕事ができなくなるのは、かわいそうですよね。</p><p>だから<mark>結果（処分）が出るまでは、今の免許がそのまま使える</mark>ことになっています。</p><p>そして更新された新しい免許の5年間は、<b>前の免許が切れた日の次の日から</b>数えます。</p>`,
 pt:"更新の処分が遅れても旧免許は有効。新免許は旧免許満了日の翌日から5年",
 hon:"免許の更新の申請があった場合において、有効期間の満了の日までにその申請について処分がなされないときは、従前の免許は、有効期間の満了後もその処分がなされるまでの間は、なお効力を有する。"},
{c:"gyo",lv:2,a:false,
 q:"宅建業者が会社の名前（商号）を変えたときは、変えてから90日以内に届け出ればよい。",
 exp:`<p>宅建業者の名前や事務所の場所などは、役所の<b>宅建業者名簿</b>に書かれています。</p><p>それが変わったら、<mark>30日以内</mark>に免許をくれた人（知事または大臣）に届け出ます。90日ではありません。</p><p>届出が必要なのは、商号、事務所の名前・場所、役員や政令使用人の氏名、<b>専任の宅建士の氏名</b>などです。</p>`,
 pt:"名簿の登載事項が変わったら、30日以内に変更の届出",
 hon:"宅地建物取引業者は、その商号を変更した場合、30日以内に、その旨を免許権者に届け出なければならない。"},
{c:"gyo",lv:2,a:true,fig:"haigyo",
 q:"個人の宅建業者が亡くなったときは、その相続人が、亡くなったことを知った日から30日以内に届け出なければならない。",
 exp:`<p>宅建業をやめるときも、届出が必要です。でも本人が亡くなったら、本人は届け出られませんよね。</p><p>そこで<mark>相続人</mark>が届け出ます。期限は<b>亡くなったことを知った日から30日以内</b>です。</p><p>だれが届け出るかは、やめる理由ごとにちがいます。下の表でまとめて覚えましょう。</p>`,
 pt:"死亡の届出：相続人が、知った日から30日以内",
 hon:"宅地建物取引業者である個人Aが死亡した場合、その相続人は、Aの死亡を知った日から30日以内に、その旨を免許権者に届け出なければならない。"},
{c:"gyo",lv:3,a:false,fig:"haigyo",
 q:"宅建業者の会社が合併されて消えたときは、合併した側（残った会社）の代表者が届け出る。",
 exp:`<p>合併で会社が消えたときに届け出るのは、<mark>消えた会社の代表役員だった人</mark>です。残った会社ではありません。</p><p>「やめる会社のことは、やめる会社の人が届ける」と考えましょう。</p><p>ちなみに、破産のときは<b>破産管財人</b>、解散のときは<b>清算人</b>、自分から廃業するときは<b>その会社の代表役員</b>が届け出ます。</p>`,
 pt:"合併で消滅 → 消滅した会社の代表役員だった者が30日以内に届出",
 hon:"法人である宅地建物取引業者が合併により消滅した場合、合併後存続する法人の代表役員は、30日以内にその旨を届け出なければならない。（→ 誤り）"},
{c:"gyo",lv:2,a:false,
 q:"宅建業者は、営業保証金を供託所に預けさえすれば、そのことを届け出なくても、すぐに仕事を始めてよい。",
 exp:`<p>営業保証金の流れは、次のとおりです。</p><p>① 免許を受ける → ② 営業保証金を<b>供託</b>する → ③ 供託したことを免許権者に<b>届け出る</b> → ④ 仕事を始める</p><p><mark>届け出た後でないと、事業を始めてはいけません</mark>。</p><p>免許から3か月たっても届出がないと「早く届け出て」と催告され、それでも1か月届けないと免許を取り消されることがあります。</p>`,
 pt:"営業保証金は「供託＋届出」の後でないと事業開始できない",
 hon:"宅地建物取引業者は、営業保証金を供託したときは、その旨を免許権者に届け出た後でなければ、その事業を開始してはならない。"},
{c:"gyo",lv:3,a:true,
 q:"営業保証金は、現金だけでなく国債などの有価証券で預けることもできる。国債なら額面の100%、地方債なら90%として計算する。",
 exp:`<p>営業保証金は、現金のほか<b>有価証券</b>でも預けられます。ただし、値下がりのおそれがあるものは少なめに評価します。</p><p>・<b>国債</b> → 額面の<mark>100%</mark><br>・<b>地方債・政府保証債</b> → <mark>90%</mark><br>・<b>その他</b>の有価証券 → <mark>80%</mark></p><p>たとえば地方債で500万円分を預けるには、額面で約556万円分が必要になります。</p>`,
 pt:"評価額：国債100%／地方債・政府保証債90%／その他80%",
 hon:"営業保証金に充てることができる有価証券の価額は、国債証券についてはその額面金額、地方債証券についてはその額面金額の100分の90とする。"},
{c:"gyo",lv:3,a:true,fig:"hoshoK",
 q:"営業保証金の還付（お客さんへの支払い）で額が足りなくなったら、宅建業者は通知を受けた日から2週間以内に、足りない分を供託しなければならない。",
 exp:`<p>営業保証金からお客さんに支払いがあると、その分だけ預けたお金が減ります。</p><p>減ったままでは次のお客さんを守れないので、<mark>不足の通知を受けた日から2週間以内</mark>に補います。</p><p>宅建業法では「<b>2週間</b>」という期限がとても多く出てきます。下の表で整理しましょう。</p>`,
 pt:"営業保証金の不足額：通知を受けた日から2週間以内に供託",
 hon:"宅地建物取引業者は、営業保証金の還付があったため営業保証金が政令で定める額に不足することとなったときは、通知書の送付を受けた日から2週間以内にその不足額を供託しなければならない。"},
{c:"gyo",lv:3,a:false,
 q:"宅建業者どうしの取引で損をした宅建業者も、相手の営業保証金から還付（支払い）を受けることができる。",
 exp:`<p>営業保証金は、<b>知識の少ないお客さん</b>を守るためのお金です。</p><p>宅建業者はプロなので、<mark>営業保証金や保証協会の弁済業務保証金から還付を受けることはできません</mark>。</p><p>プロどうしのトラブルは、自分たちで解決してね、ということです。</p>`,
 pt:"宅建業者は還付を受けられない（守られるのはお客さん）",
 hon:"宅地建物取引業者と宅地建物取引業に関し取引をした者は、その者が宅地建物取引業者である場合も、営業保証金から弁済を受ける権利を有する。（→ 誤り）"},
{c:"gyo",lv:3,a:true,fig:"hoshoK",
 q:"保証協会に入っている宅建業者が新しく支店を作ったときは、2週間以内に、その支店の分の分担金（30万円）を保証協会に納めなければならない。",
 exp:`<p>保証協会に入っている業者は、営業保証金の代わりに<b>弁済業務保証金分担金</b>を納めます（本店60万円、支店30万円）。</p><p>支店を増やしたら、その分も納めます。期限は<mark>支店を設置した日から2週間以内</mark>です。</p><p>納めないと、保証協会の社員（メンバー）でなくなってしまいます。</p>`,
 pt:"保証協会の社員が事務所を新設 → 2週間以内に分担金を納付",
 hon:"保証協会の社員は、新たに事務所を設置したときは、その日から2週間以内に、弁済業務保証金分担金を当該保証協会に納付しなければならない。"},
{c:"gyo",lv:3,a:false,fig:"hoshoK",
 q:"保証協会をやめた（社員でなくなった）宅建業者は、3か月以内に営業保証金を供託すればよい。",
 exp:`<p>保証協会をやめると、お客さんを守るお金がなくなってしまいます。</p><p>そこで、自分で営業保証金を供託し直す必要があり、期限は<mark>社員でなくなった日から1週間以内</mark>ととても短いです。</p><p>「2週間」が多い中で、ここだけ「<b>1週間</b>」なのがひっかけポイントです。</p>`,
 pt:"保証協会の社員でなくなった → 1週間以内に営業保証金を供託",
 hon:"宅地建物取引業者は、保証協会の社員の地位を失ったときは、当該地位を失った日から1週間以内に、営業保証金を供託しなければならない。"},
{c:"gyo",lv:2,a:true,fig:"baikai",
 q:"専任媒介契約（ほかの業者には頼まない約束）の有効期間は3か月までで、それより長く決めても3か月になる。",
 exp:`<p>家を売りたい人が、不動産屋さんに「買う人を探して」と頼む契約を<b>媒介契約</b>といいます。3つの種類があります。</p><p>・<b>一般媒介</b>：何社にでも頼める<br>・<b>専任媒介</b>：1社だけに頼む（自分で見つけた買主とは契約OK）<br>・<b>専属専任媒介</b>：1社だけ。自分で見つけた相手ともダメ</p><p>専任や専属専任は、1社にしばられるので、<mark>期間は最長3か月</mark>。長く決めても3か月に短くなります。</p>`,
 pt:"専任・専属専任の有効期間は3か月まで（超えたら3か月に）",
 hon:"専任媒介契約の有効期間は、3月を超えることができず、これより長い期間を定めたときは、その期間は3月とする。"},
{c:"gyo",lv:2,a:false,fig:"baikai",
 q:"専属専任媒介契約では、宅建業者は依頼した人に、2週間に1回以上、仕事の様子を報告すればよい。",
 exp:`<p>しばりが強い契約ほど、業者の責任も重くなります。</p><p>・<b>専任媒介</b> → <b>2週間に1回以上</b>報告<br>・<b>専属専任媒介</b> → <mark>1週間に1回以上</mark>報告</p><p>専属専任のほうが依頼者のしばりが強いので、報告もこまめにします。</p>`,
 pt:"報告：専任は2週間に1回以上、専属専任は1週間に1回以上",
 hon:"専属専任媒介契約を締結した宅地建物取引業者は、依頼者に対し、当該専属専任媒介契約に係る業務の処理状況を2週間に1回以上報告しなければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,fig:"baikai",
 q:"専任媒介契約を結んだら、宅建業者は休みの日を除いて7日以内に、物件の情報を指定流通機構（レインズ）に登録しなければならない。",
 exp:`<p><b>レインズ</b>は、全国の不動産屋さんが物件情報を共有するネットワークです。ここに登録すると、買う人が見つかりやすくなります。</p><p>・<b>専任媒介</b> → 契約から<mark>7日以内</mark><br>・<b>専属専任媒介</b> → 契約から<mark>5日以内</mark><br>（どちらも業者の休業日は数えない）</p><p>一般媒介には登録の義務はありません。</p>`,
 pt:"レインズ登録：専任7日以内／専属専任5日以内（休業日を除く）",
 hon:"専任媒介契約を締結した宅地建物取引業者は、契約の締結の日から7日以内（休業日数を算入しない）に、当該宅地の所在等を指定流通機構に登録しなければならない。"},
{c:"gyo",lv:2,a:true,fig:"baikai",
 q:"土地の売買の媒介を頼まれたら、一般媒介契約であっても、宅建業者は媒介契約の内容を書いた書面を、依頼した人に渡さなければならない。",
 exp:`<p>売買や交換の媒介契約を結んだら、業者は<b>媒介契約書面</b>（34条の2書面）を作って依頼者に渡します。</p><p>これは<mark>一般・専任・専属専任のどれでも必要</mark>です。</p><p>ただし、<b>貸し借り（貸借）の媒介</b>のときは、この書面はいりません。ここがひっかけになります。</p>`,
 pt:"売買・交換の媒介契約は、種類に関係なく書面が必要（貸借は不要）",
 hon:"宅地建物取引業者は、宅地の売買の媒介契約を締結したときは、一般媒介契約であっても、遅滞なく、法第34条の2の規定に基づく書面を作成して依頼者に交付しなければならない。"},
{c:"gyo",lv:2,a:false,
 q:"宅建業者が「売主」なのか「仲介」なのかといった取引の立場（取引態様）は、広告に書いておけば、注文を受けたときにあらためて伝える必要はない。",
 exp:`<p>業者が売主なら手数料はかからない、仲介なら手数料がかかる…というように、立場によってお客さんの負担が変わります。</p><p>だから<b>取引態様の明示</b>は、<mark>広告するときと、注文を受けたときの両方</mark>で必要です。</p><p>広告に書いてあっても、注文を受けたら遅れずにもう一度伝えます。</p>`,
 pt:"取引態様の明示は「広告時」と「注文を受けた時」の両方",
 hon:"宅地建物取引業者は、広告をするときに取引態様の別を明示していれば、注文を受けたときに改めて取引態様の別を明らかにする必要はない。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"実際とちがう、ずっと良く見せる広告（誇大広告）は、それを信じてだまされた人がいなくても、出しただけで宅建業法違反になる。",
 exp:`<p>「駅から徒歩3分（本当は15分）」のような広告を<b>誇大広告</b>といいます。</p><p>誇大広告は、<mark>出しただけで違反</mark>です。実際にだまされた人がいたかどうかや、契約が成立したかどうかは関係ありません。</p><p>売る気のない物件で客を集める「おとり広告」も、誇大広告として禁止されています。</p>`,
 pt:"誇大広告は、誤認した人や実害がなくても違反",
 hon:"宅地建物取引業者が誇大広告をした場合、当該広告を見た者が実際に誤認したかどうかにかかわらず、宅地建物取引業法に違反する。"},
{c:"gyo",lv:2,a:true,fig:"tl",
 q:"売買の37条書面（契約の内容を書いた書面）には、代金の額、引渡しの時期、所有権移転の登記をする時期を必ず書かなければならない。",
 exp:`<p>37条書面には、<b>必ず書くこと</b>と、<b>決めたときだけ書くこと</b>があります。</p><p>必ず書くことの代表が、<mark>当事者の氏名・住所、物件、代金の額と払い方、引渡しの時期、移転登記の申請の時期</mark>です。</p><p>どれも、契約のあとで「言った・言わない」になると困る、いちばん大事な約束です。</p>`,
 pt:"37条の必ず書く事項：代金・支払方法・引渡し時期・移転登記の時期など",
 hon:"宅地建物取引業者が売買の媒介をした場合、37条書面には、代金の額並びにその支払の時期及び方法、宅地の引渡しの時期、移転登記の申請の時期を記載しなければならない。"},
{c:"gyo",lv:3,a:true,fig:"tl",
 q:"契約の解除についての決まりを特に作らなかった場合は、それを37条書面に書かなくてもよい。",
 exp:`<p>37条書面の「<b>決めたときだけ書くこと</b>」（任意的記載事項）の例です。</p><p>・<b>契約の解除</b>に関する定め<br>・<b>損害賠償額の予定・違約金</b>の定め<br>・<b>手付金など、代金以外のお金</b>の定め<br>・<b>天災など</b>で壊れたときの定め　など</p><p><mark>決めていないなら、書く必要はありません</mark>。決めたら、必ず書きます。</p>`,
 pt:"解除・損害賠償の予定・天災などは「定めがあれば」37条書面に記載",
 hon:"契約の解除に関する定めがないときは、37条書面にその旨を記載する必要はない。"},
{c:"gyo",lv:3,a:true,
 q:"買主が宅建業者の場合、売主側の宅建業者は、重要事項説明書を渡せばよく、宅建士による説明は省略できる。",
 exp:`<p>重要事項の説明は、知識の少ない人を守るためのものでしたね。</p><p>買主がプロ（宅建業者）なら、書面を読めば分かるので、<mark>説明はしなくてよい</mark>ことになっています。</p><p>ただし、<b>書面（35条書面）を渡すことは必要</b>です。宅建士の記名も必要です。「説明はいらない、書面はいる」とセットで覚えましょう。</p>`,
 pt:"相手が宅建業者 → 35条書面の交付は必要、説明は不要",
 hon:"宅地建物取引業者が宅地建物取引業者である買主に対して宅地の売買を行う場合、35条書面を交付すれば、宅地建物取引士に重要事項を説明させる必要はない。"},
{c:"gyo",lv:2,a:true,
 q:"重要事項の説明は、一定の条件を満たせば、テレビ会議（オンライン）で行うこともできる。",
 exp:`<p>今は、パソコンなどの画面ごしに重要事項の説明をすることも認められています（<b>IT重説</b>）。</p><p>条件は、<mark>お互いの顔や書類がちゃんと見えて、音声も聞こえること</mark>、事前に書面を送っておくこと、宅建士証を画面で見せることなどです。</p><p>また、相手の承諾があれば、35条書面や37条書面を紙ではなく<b>電子データ</b>で渡すこともできます。</p>`,
 pt:"IT重説はOK。相手の承諾があれば35条・37条書面は電子交付もOK",
 hon:"宅地建物取引士は、テレビ会議等のITを活用して重要事項の説明を行うことができるが、その場合も宅地建物取引士証を提示しなければならない。"},
{c:"gyo",lv:2,a:true,
 q:"重要事項の説明では、市町村が作った水害ハザードマップに物件がのっている場合、その中のどこにあるかを説明しなければならない。",
 exp:`<p>近年、大雨の被害が増えています。そこで、<mark>水害ハザードマップでの物件の位置</mark>を説明することが義務になりました。</p><p>売買だけでなく、<b>貸し借り</b>のときも説明します。</p><p>ハザードマップで浸水しない場所にあっても、「水害の心配がない」と言ってしまうのはダメ。思いこみをさせないよう注意します。</p>`,
 pt:"水害ハザードマップ上の位置は、売買・貸借とも重要事項",
 hon:"宅地建物取引業者は、市町村が作成する水防法に基づく水害ハザードマップに取引の対象となる宅地建物の位置が表示されているときは、当該ハザードマップにおける位置を重要事項として説明しなければならない。"},
{c:"gyo",lv:3,a:false,
 q:"重要事項の説明では、物件の代金の額を必ず説明しなければならない。",
 exp:`<p>ちょっと意外ですが、<mark>代金そのものの額は、重要事項の説明事項ではありません</mark>。代金は、37条書面に書く事項です。</p><p>重要事項で説明するのは、<b>代金「以外」に払うお金</b>（手付金、固定資産税の清算金など）の額と目的です。</p><p>「代金は37条、代金以外のお金は35条と37条」と区別しましょう。</p>`,
 pt:"代金の額は35条の説明事項ではない（37条の記載事項）",
 hon:"宅地建物取引業者は、宅地の売買の媒介を行う場合、当該宅地の代金の額を重要事項として説明しなければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"中古の建物を売るときの重要事項の説明では、建物状況調査（インスペクション）をしたかどうか、した場合はその結果の概要を説明する。",
 exp:`<p>中古の建物は、見た目では分からない傷みがあるかもしれません。</p><p>そこで専門家が建物の状態を調べる<b>建物状況調査</b>（インスペクション）という制度があります。</p><p>重要事項の説明では、<mark>調査をしたかどうか、したならその結果の概要</mark>を説明します（調べるのは一定期間内に行われたもの）。</p>`,
 pt:"既存建物：建物状況調査の実施の有無と結果の概要を説明",
 hon:"既存の建物の売買の媒介を行う場合、建物状況調査を実施しているかどうか、及びこれを実施している場合におけるその結果の概要を重要事項として説明しなければならない。"},
{c:"gyo",lv:2,a:true,
 q:"宅建業者が売主、ふつうの人が買主の売買で、「買主は手付を放棄しても契約をやめられない」という特約をしても、その特約は無効である。",
 exp:`<p>宅建業者が売主のとき、受け取った手付は、必ず<b>解約手付</b>として扱われます。</p><p>解約手付とは、相手が契約の実行（履行）にとりかかる前なら、<br>・<b>買主</b>は手付を<b>あきらめて</b><br>・<b>売主</b>は手付の<b>倍の額</b>を払って<br>契約をやめられる、というものです。</p><p><mark>これより買主に不利な特約は無効</mark>。プロが素人をしばる約束は認めません。</p>`,
 pt:"業者売主の手付は解約手付。買主に不利な特約は無効",
 hon:"宅地建物取引業者が自ら売主となる売買契約において、買主が手付を放棄して契約を解除することができない旨の特約は、無効である。"},
{c:"gyo",lv:2,a:false,fig:"tetsuke",
 q:"宅建業者が売主、ふつうの人が買主の売買で、損害賠償の予定額を代金の30%と決めた場合、その約束は全部が無効になる。",
 exp:`<p>契約違反のときに払うお金をあらかじめ決めておくことを<b>損害賠償額の予定</b>といいます。</p><p>業者が売主・素人が買主のときは、違約金と合わせて<mark>代金の20%まで</mark>しか決められません。</p><p>でも、20%をこえて決めても全部が無効になるわけではなく、<b>20%をこえた部分だけが無効</b>です。つまり20%で決めたことになります。</p>`,
 pt:"損害賠償の予定＋違約金は20%まで。こえた「部分だけ」無効",
 hon:"損害賠償の額を予定し、又は違約金を定めるときは、これらを合算した額が代金の額の10分の2を超えることとなる定めをしてはならず、これに反する特約は、代金の額の10分の2を超える部分について、無効とする。"},
{c:"gyo",lv:3,a:true,fig:"hozen",
 q:"完成前のマンションを業者が売るとき、代金の5%をこえる手付金を受け取るなら、保全措置（銀行の保証など）を先にしておかなければならない。",
 exp:`<p>もし業者がつぶれたら、払った手付金が戻ってこないかもしれません。そこで<b>手付金等の保全措置</b>（銀行などに保証してもらうこと）が必要になります。</p><p>・<b>未完成物件</b>：代金の<mark>5%</mark>をこえる、または<mark>1,000万円</mark>をこえる<br>・<b>完成物件</b>：代金の<mark>10%</mark>をこえる、または<mark>1,000万円</mark>をこえる</p><p>このどちらかにあたるなら、<b>受け取る前に</b>保全措置をします。</p>`,
 pt:"保全措置：未完成は5%超または1,000万円超、完成は10%超または1,000万円超",
 hon:"宅地建物取引業者は、工事完了前の建物の売買で、代金の5%を超える手付金を受領しようとするときは、あらかじめ保全措置を講じなければならない。"},
{c:"gyo",lv:3,a:false,fig:"hozen",
 q:"完成している中古住宅（代金3,000万円）を業者が売るとき、手付金として250万円を受け取るなら、保全措置が必要である。",
 exp:`<p>完成物件の基準は、<b>代金の10%をこえる</b>か、<b>1,000万円をこえる</b>かです。</p><p>3,000万円 × 10% ＝ 300万円。250万円は300万円以下で、1,000万円以下でもあるので、<mark>保全措置はいりません</mark>。</p><p>もし未完成の物件なら、5%＝150万円をこえるので保全措置が必要でした。完成か未完成かで基準が変わる所がポイントです。</p>`,
 pt:"完成物件は10%（3,000万円なら300万円）以下なら保全不要",
 hon:"宅地建物取引業者Aが自ら売主として、完成済みの建物（代金3,000万円）を宅建業者でないBに売却する際、手付金250万円を受領する場合、Aは保全措置を講じなければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,fig:"hozen",
 q:"買主が物件の所有権の登記をした後なら、業者は保全措置をしないで手付金などを受け取ってよい。",
 exp:`<p>保全措置は、お金だけ払って物件が手に入らない、という事態を防ぐためのものです。</p><p>買主が<mark>所有権の登記をすませていれば、物件はもう買主のもの</mark>なので、保全措置はいりません。</p><p>「受け取る額が小さいとき」と「買主が登記したとき」の2つは、保全措置が不要と覚えましょう。</p>`,
 pt:"買主が所有権の登記をしたら、保全措置は不要",
 hon:"買主が所有権の登記をしたときは、宅地建物取引業者は、保全措置を講じることなく手付金等を受領することができる。"},
{c:"gyo",lv:3,a:true,
 q:"宅建業者は、まだ他人のものである土地を、自分が売主となってふつうの人に売る契約を、原則として結んではいけない。",
 exp:`<p>他人の土地を売る約束をしても、その土地を本当に手に入れられるか分かりません。手に入らなかったら、買主は困ってしまいます。</p><p>そこで、業者が売主・素人が買主のときは、<mark>自分のものになっていない物件の売買契約は原則禁止</mark>です（8種制限の1つ）。</p><p>ただし、業者がその土地を手に入れる<b>契約（予約を含む）をすでに結んでいる</b>ときは、例外としてOKです。</p>`,
 pt:"自己の所有に属しない物件は原則売れない（取得契約があれば例外的にOK）",
 hon:"宅地建物取引業者は、自己の所有に属しない宅地について、自ら売主となる売買契約（予約を含む）を宅建業者でない者と締結してはならない。ただし、当該宅地を取得する契約を締結しているときはこの限りでない。"},
{c:"gyo",lv:2,a:true,
 q:"業者が売主、ふつうの人が買主の売買で、「契約に合わない点の責任は、物件の引渡しから2年以内に通知されたものに限る」という特約は有効である。",
 exp:`<p>買った物件に、契約で約束した内容に合わない点（<b>契約不適合</b>）があったら、売主は責任を負います。</p><p>業者が売主のときは、民法より買主に不利な特約は原則無効です。でも、<mark>通知の期間を「引渡しから2年以上」とする特約だけは、例外としてOK</mark>です。</p><p>「1年」や「責任を一切負わない」は無効。そのときは民法の原則どおりになります。</p>`,
 pt:"契約不適合の通知期間を「引渡しから2年以上」とする特約は有効",
 hon:"宅地建物取引業者が自ら売主となる宅地の売買契約において、契約不適合責任に関し、買主の通知期間を引渡しの日から2年とする特約は有効である。"},
{c:"gyo",lv:3,a:false,
 q:"業者が売主、ふつうの人が買主の売買で、「売主は契約不適合の責任を一切負わない」という特約をした場合、売主は引渡しから2年間だけ責任を負うことになる。",
 exp:`<p>「責任を一切負わない」は、買主に不利すぎるので<b>無効</b>です。</p><p>では無効になったらどうなるか。「2年」になるのではなく、<mark>民法の原則どおり</mark>になります。</p><p>民法では、買主は不適合を<b>知った時から1年以内</b>に通知すれば責任を追及できます。「2年になる」は、ひっかけです。</p>`,
 pt:"無効な特約は「2年」にならず、民法の原則（知った時から1年以内に通知）に戻る",
 hon:"宅地建物取引業者が自ら売主となる売買契約で、契約不適合責任を負わない旨の特約をした場合、当該特約は無効となり、買主は引渡しから2年間に限り責任を追及できる。（→ 誤り）"},
{c:"gyo",lv:2,a:true,fig:"cooling",
 q:"喫茶店で申し込んだ買主でも、物件の引渡しを受けて、代金も全部払ったあとは、クーリング・オフはできない。",
 exp:`<p>クーリング・オフができなくなるのは、次の2つのときです。</p><p>① 書面で告げられた日から<b>8日間</b>がすぎた<br>② <mark>引渡しを受け、かつ、代金の全部を払った</mark></p><p>②は「両方」そろったときです。引渡しだけ、または代金の一部だけなら、まだクーリング・オフできます。</p>`,
 pt:"「引渡し」と「代金全額支払」の両方がそろうとクーリング・オフ不可",
 hon:"買主が、宅地の引渡しを受け、かつ、その代金の全部を支払ったときは、クーリング・オフによる契約の解除をすることができない。"},
{c:"gyo",lv:2,a:false,fig:"cooling",
 q:"クーリング・オフで契約が解除されたとき、業者は、それまでに使った費用を差し引いて手付金を返せばよい。",
 exp:`<p>クーリング・オフは、買主を強く守る制度です。</p><p>解除されたら、業者は<mark>受け取った手付金などを、すぐに全額返さなければなりません</mark>。費用を差し引くことも、損害賠償や違約金を請求することもできません。</p><p>「クーリング・オフしたら損をする」のでは、だれも使えなくなってしまうからです。</p>`,
 pt:"クーリング・オフ → 業者は速やかに全額返還。損害賠償・違約金の請求も不可",
 hon:"クーリング・オフによる解除があった場合、宅地建物取引業者は、申込みの撤回等に伴う損害賠償又は違約金の支払を請求することができない。"},
{c:"gyo",lv:3,a:true,fig:"cooling",
 q:"クーリング・オフができることを書面で告げられていない場合、喫茶店で申し込んだ買主は、引渡しを受けて代金を全部払うまでは、いつでもクーリング・オフできる。",
 exp:`<p>「8日間」は、<b>書面で告げられた日</b>から数え始めます。</p><p>告げられていなければ、8日間のカウントはスタートしません。だから<mark>引渡しと代金全額の支払いがそろうまで、いつまでもクーリング・オフできます</mark>。</p><p>口で伝えただけでは「告げた」ことにならない点も注意です。</p>`,
 pt:"書面で告げていない → 8日間はスタートしない",
 hon:"宅地建物取引業者がクーリング・オフについて書面で告げなかった場合、買主は、宅地の引渡しを受け、かつ、代金の全部を支払うまでは、申込みの撤回等をすることができる。"},
{c:"gyo",lv:3,a:true,fig:"cooling",
 q:"業者のほうから「ご自宅に説明にうかがいます」と言って買主の自宅で申し込みを受けた場合、買主はクーリング・オフできる。",
 exp:`<p>自宅や勤め先でクーリング・オフできるかは、<b>だれが言い出したか</b>で決まります。</p><p>・<b>買主</b>が「自宅に来て」と言った → できない<br>・<b>業者</b>が「うかがいます」と言った → <mark>できる</mark></p><p>業者が押しかけて来た場合は、落ち着いて考えられないかもしれないので、買主を守ります。</p>`,
 pt:"自宅・勤務先は「買主から申し出た」ときだけクーリング・オフ不可",
 hon:"宅地建物取引業者の申出により、買主の自宅において買受けの申込みがされた場合、買主はクーリング・オフにより申込みの撤回をすることができる。"},
{c:"gyo",lv:2,a:true,
 q:"住むための部屋の貸し借りをなかだちした業者は、原則として、貸主と借主のそれぞれから家賃の0.5か月分（＋消費税）までしか報酬を受け取れない。",
 exp:`<p>貸し借りの媒介の報酬は、<b>両方から合わせて家賃1か月分</b>（＋消費税）が上限です。</p><p>さらに<mark>住むための建物</mark>の場合は、原則として<b>一方から0.5か月分まで</b>。ただし、媒介を頼まれるときに依頼者の承諾があれば、一方から1か月分もらうこともできます（合計は1か月分まで）。</p><p>お店や事務所用なら、配分は自由（合計1か月分まで）です。</p>`,
 pt:"貸借の報酬は合計1か月分。居住用は原則一方0.5か月分（承諾で変更可）",
 hon:"居住用建物の賃貸借の媒介に関して依頼者の一方から受けることのできる報酬の額は、当該媒介の依頼を受けるに当たって当該依頼者の承諾を得ている場合を除き、借賃の1月分の0.55倍（消費税込み）に相当する金額以内とする。"},
{c:"gyo",lv:3,a:false,
 q:"宅建業者は、依頼者から頼まれていない広告の費用でも、実際にかかった費用なら、報酬とは別に受け取ってよい。",
 exp:`<p>報酬の上限とは別に受け取れるのは、<mark>依頼者から特別に頼まれた広告の料金</mark>や、依頼者の特別の依頼による遠くへの現地調査の費用などです。</p><p>業者が自分の判断で出した広告の費用は、報酬の中でまかなうもの。<b>別にもらってはいけません</b>。</p>`,
 pt:"別に受け取れるのは「依頼者から依頼された」広告料金など",
 hon:"宅地建物取引業者は、依頼者の依頼によらずに行った通常の広告の料金に相当する額を、報酬とは別に受領することができる。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"代金800万円以下の安い空き家などの売買の媒介では、あらかじめ説明して合意を得ておけば、通常の計算より多く、30万円（＋消費税）まで報酬を受け取れる。",
 exp:`<p>安い物件だと、計算上の報酬がとても小さくなり、業者が引き受けたがりません。その結果、空き家が売れ残ってしまいます。</p><p>そこで<mark>代金800万円以下の物件（低廉な空家等）</mark>は、現地調査の費用なども含めて<b>30万円（＋消費税）まで</b>受け取れる特例があります（2024年7月から）。</p><p>ただし、媒介契約のときに<b>あらかじめ依頼者に説明し、合意</b>しておく必要があります。</p>`,
 pt:"800万円以下の宅地建物：説明・合意があれば報酬上限30万円＋税",
 hon:"低廉な空家等（代金800万円以下）の売買の媒介について、宅地建物取引業者は、あらかじめ依頼者に説明し合意を得た場合、依頼者から30万円の1.1倍に相当する金額を上限として報酬を受領できる。"},
{c:"gyo",lv:2,a:true,
 q:"消費税の課税事業者である宅建業者は、報酬の上限に消費税10%分を上乗せした額まで受け取ることができる。",
 exp:`<p>報酬の計算式（5%・4%・3%など）は、消費税を入れる前の金額です。</p><p>宅建業者が<b>消費税の課税事業者</b>なら、<mark>その10%を上乗せ</mark>して受け取れます。</p><p>たとえば1,000万円の売買なら、36万円 × 1.1 ＝ <b>39万6,000円</b>が上限です。</p>`,
 pt:"課税事業者の報酬上限 ＝ 計算額 × 1.1",
 hon:"消費税課税事業者である宅地建物取引業者が代金1,000万円の宅地の売買の媒介をした場合、依頼者の一方から受領できる報酬の上限は39万6,000円である。"},
{c:"gyo",lv:3,a:true,
 q:"売買の「代理」を頼まれた業者は、依頼者から、媒介のときの2倍までの報酬を受け取ることができる。",
 exp:`<p>代理は、本人の代わりに契約まで結ぶので、媒介より仕事が重くなります。</p><p>そのため、<mark>代理の依頼者からは、媒介の計算額の2倍まで</mark>受け取れます。</p><p>ただし、相手方からも報酬をもらう場合は、<b>両方から合わせて2倍まで</b>です。</p>`,
 pt:"代理の報酬：依頼者から媒介の2倍まで（取引全体でも2倍まで）",
 hon:"宅地建物取引業者が売買の代理をした場合、依頼者から受領できる報酬の上限は、媒介の場合の計算額の2倍である。"},
{c:"gyo",lv:3,a:false,
 q:"宅建業者は、取引のたびに帳簿をつけ、帳簿は本店にまとめて1冊置いておけばよい。",
 exp:`<p>帳簿は<mark>事務所ごと</mark>に置きます。本店にまとめてはダメです。</p><p>保存期間は、各事業年度の終わりに閉じてから<b>5年間</b>。ただし、業者が売主となる<b>新築住宅</b>は<b>10年間</b>です（新築住宅の責任期間が10年だから）。</p><p>従業者名簿も事務所ごとに置き、最後に書いた日から<b>10年間</b>保存します。</p>`,
 pt:"帳簿は事務所ごと。保存は閉鎖後5年（業者売主の新築住宅は10年）",
 hon:"宅地建物取引業者は、その事務所ごとに業務に関する帳簿を備え、取引のあったつど所定の事項を記載し、各事業年度の末日に閉鎖し、閉鎖後5年間（自ら売主となる新築住宅に係るものは10年間）保存しなければならない。"},
{c:"gyo",lv:3,a:false,
 q:"宅建士が取引の相手から従業者証明書を見せるよう求められたときは、代わりに宅建士証を見せればよい。",
 exp:`<p>宅建業者は、働く人全員に<b>従業者証明書</b>を持たせます。宅建士も、社長も同じです。</p><p>相手から求められたら、<mark>従業者証明書そのものを見せなければなりません</mark>。宅建士証を代わりにすることはできません。</p><p>宅建士証は「宅建士であること」、従業者証明書は「その会社の人であること」を示すもので、役割がちがうからです。</p>`,
 pt:"従業者証明書の代わりに宅建士証を見せることはできない",
 hon:"宅地建物取引業者の従業者である宅地建物取引士は、取引の関係者から従業者証明書の提示を求められたときは、宅地建物取引士証の提示をもってこれに代えることができる。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"宅建士の登録は、試験を受けた都道府県の知事が行う。登録には、2年以上の実務経験か、国土交通大臣の登録を受けた講習（登録実務講習）の修了が必要である。",
 exp:`<p>宅建士の<b>登録</b>は、<mark>試験を受けた都道府県の知事</mark>が行います。住んでいる県や、勤めている県ではありません。</p><p>さらに、実務の経験が<b>2年以上</b>あるか、それに代わる<b>登録実務講習</b>を終えている必要があります。働いたことがない人は、この講習を受ければ登録できます。</p>`,
 pt:"登録は「試験地」の知事。実務2年以上または登録実務講習",
 hon:"宅地建物取引士資格試験に合格した者で、宅地建物の取引に関し2年以上の実務の経験を有するもの又は国土交通大臣がその実務の経験を有するものと同等以上の能力を有すると認めたものは、当該試験を行った都道府県知事の登録を受けることができる。"},
{c:"gyo",lv:3,a:false,
 q:"宅建士が、別の都道府県にある事務所で働くことになったときは、必ず登録の移転をしなければならない。",
 exp:`<p><b>登録の移転</b>は、登録を別の都道府県に移す手続きです。</p><p>勤め先が他の都道府県に変わったときに<mark>「申請することができる」もので、義務ではありません</mark>。</p><p>ちなみに、引っ越しで住所が変わっただけでは、登録の移転はできません（勤め先が変わったときだけ）。</p>`,
 pt:"登録の移転は任意。できるのは「勤務先」が他県に変わったとき",
 hon:"宅地建物取引士は、他の都道府県に所在する宅地建物取引業者の事務所の業務に従事し、又は従事しようとするときは、登録の移転を申請しなければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"宅建士が事務禁止処分を受けたときは、宅建士証を、それを交付した都道府県知事に提出しなければならない。",
 exp:`<p>宅建士への処分には、軽い順に<b>指示</b>→<b>事務禁止</b>（1年以内）→<b>登録消除</b>があります。</p><p>事務禁止の間は宅建士の仕事ができないので、<mark>宅建士証を交付した知事に「提出」</mark>します。期間が終わって返してほしいと言えば、すぐ返してもらえます。</p><p>登録が消されたときは「<b>返納</b>」（もう返ってこない）です。</p>`,
 pt:"事務禁止 → 宅建士証を「提出」／登録消除・失効 → 「返納」",
 hon:"宅地建物取引士は、事務の禁止の処分を受けたときは、速やかに、宅地建物取引士証をその交付を受けた都道府県知事に提出しなければならない。"},
{c:"gyo",lv:2,a:true,
 q:"拘禁刑（以前の懲役・禁錮）以上の刑を受けた人は、刑の執行が終わってから5年たつまで、宅建業の免許を受けられない。",
 exp:`<p>悪いことをした人に、すぐお客さんの大事な取引をまかせるわけにはいきません。これを<b>欠格事由</b>（免許を受けられない理由）といいます。</p><p>代表的なのが、<mark>拘禁刑以上の刑</mark>を受けて、執行が終わってから<b>5年</b>たっていない人です（2025年6月から懲役と禁錮は「拘禁刑」にまとまりました）。</p><p>罰金でも、<b>宅建業法違反</b>や<b>暴力的な犯罪</b>なら同じく5年ダメです。</p>`,
 pt:"拘禁刑以上 → 執行終了から5年は免許不可（宅建業法違反等の罰金も同じ）",
 hon:"拘禁刑以上の刑に処せられ、その刑の執行を終わり、又は執行を受けることがなくなった日から5年を経過しない者は、免許を受けることができない。"},
{c:"gyo",lv:3,a:true,
 q:"執行猶予がついた刑を受けた人は、その執行猶予の期間が何事もなく終われば、5年待たずに、すぐに免許を受けられる。",
 exp:`<p><b>執行猶予</b>とは、「しばらくまじめにしていれば、刑を受けなくてよい」というしくみです。</p><p>猶予の期間中は免許を受けられません。でも、<mark>期間が無事に終われば、刑を言い渡された効力そのものがなくなる</mark>ので、その日からすぐに免許を受けられます。</p><p>「執行が終わって5年」と混同しないようにしましょう。</p>`,
 pt:"執行猶予期間が満了 → すぐに免許OK（5年待たない）",
 hon:"拘禁刑に処せられ、その刑の全部の執行猶予の期間を満了した者は、その日から5年を経過しなければ、免許を受けることができない。（→ 誤り）"},
{c:"gyo",lv:3,a:false,
 q:"スピード違反（道路交通法違反）で罰金刑を受けた人は、5年間、宅建業の免許を受けられない。",
 exp:`<p>罰金刑で免許を受けられなくなるのは、<mark>宅建業法違反、暴力的な犯罪（傷害・暴行・脅迫など）、背任</mark>などに限られます。</p><p>道路交通法違反の罰金は、これにあたりません。だから<b>免許は受けられます</b>。</p><p>ただし、拘禁刑以上なら、罪の種類にかかわらず5年ダメです。</p>`,
 pt:"罰金で欠格になるのは宅建業法違反・暴力系の罪・背任など",
 hon:"道路交通法違反により罰金の刑に処せられた者は、その刑の執行を終わった日から5年を経過しなければ、免許を受けることができない。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"マンションのモデルルームなど、契約や申込みを受ける案内所には、専任の宅建士を1人以上置かなければならない。",
 exp:`<p>事務所以外にも、<b>案内所</b>（モデルルームや現地の販売所など）で契約や申込みを受けることがあります。</p><p>そういう案内所には、<mark>専任の宅建士を1人以上</mark>置きます。事務所の「5人に1人」とはちがい、人数に関係なく1人以上です。</p><p>また、業務を始める<b>10日前まで</b>に、免許権者と案内所のある場所の知事に届け出ます。</p>`,
 pt:"契約・申込みを受ける案内所：専任宅建士1人以上、10日前までに届出",
 hon:"宅地建物取引業者は、契約の締結又は申込みの受付を行う案内所には、少なくとも1名以上の成年者である専任の宅地建物取引士を置かなければならない。"},
{c:"gyo",lv:3,a:false,
 q:"免許権者は、宅建業者に対して、2年間の業務停止を命じることができる。",
 exp:`<p>宅建業者への処分は、軽い順に3つあります。</p><p>① <b>指示</b>（ここを直しなさい）<br>② <b>業務停止</b>（<mark>1年以内</mark>の期間、仕事の全部または一部をしてはいけない）<br>③ <b>免許取消</b></p><p>業務停止は<b>1年以内</b>なので、2年は×です。宅建士の事務禁止も1年以内です。</p>`,
 pt:"業務停止・事務禁止は「1年以内」",
 hon:"免許権者は、宅地建物取引業者に対し、2年以内の期間を定めて、その業務の全部又は一部の停止を命ずることができる。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"宅建業者が売主となって、ふつうの人に新築住宅を売るときは、住宅の欠陥を直すお金を確保するため、保証金の供託か保険への加入が必要である。",
 exp:`<p>新築住宅の売主は、柱や屋根など大事な部分の欠陥について、<b>10年間</b>責任を負います。でも業者がつぶれたら、直してもらえません。</p><p>そこで<b>住宅瑕疵担保履行法</b>により、業者が売主・素人が買主のときは、<mark>保証金の供託</mark>か<mark>保険への加入</mark>が義務になっています。</p><p>買主が宅建業者のときは、この義務はありません。</p>`,
 pt:"新築住宅（業者売主・素人買主）→ 保証金供託か保険加入が必要",
 hon:"宅地建物取引業者は、自ら売主となる新築住宅の売買契約を宅地建物取引業者でない買主と締結する場合、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行う義務を負う。"}
);

/* 権利関係：追加分 */
Q.push(
{c:"ken",lv:1,a:true,
 q:"土地の売買契約は、契約書を作らずに、口約束だけでも成立する。",
 exp:`<p>民法では、契約は<b>「売ります」「買います」という気持ちが合えば成立</b>します。書面は原則として必要ありません。</p><p>だから<mark>口約束でも、土地の売買契約は成立</mark>します。契約書は、あとでもめないための「証拠」です。</p><p>ただし、<b>保証契約</b>（人の借金を代わりに払う約束）は、書面がないと効力がありません。例外として覚えておきましょう。</p>`,
 pt:"契約は合意だけで成立（書面は不要）。保証契約は例外で書面が必要",
 hon:"契約の成立には、法令に特別の定めがある場合を除き、書面の作成その他の方式を具備することを要しない。"},
{c:"ken",lv:1,a:true,
 q:"借りている家の雨もりなど、使うのに必要な修理は、原則として大家さん（貸主）がしなければならない。",
 exp:`<p>家を貸す人は、借りた人が<b>ちゃんと使える状態</b>にしておく義務があります。</p><p>だから<mark>使うのに必要な修理（修繕）は、原則として貸主の義務</mark>です。</p><p>ただし、借りた人が自分の不注意で壊したところは、貸主が直す義務はありません。また、貸主がすぐ直してくれないときや急ぐときは、借りた人が自分で直すこともできます。</p>`,
 pt:"賃貸物の修繕は原則として貸主の義務",
 hon:"賃貸人は、賃貸物の使用及び収益に必要な修繕をする義務を負う。ただし、賃借人の責めに帰すべき事由によってその修繕が必要となったときは、この限りでない。"},
{c:"ken",lv:1,a:true,
 q:"大家さんにだまって、借りた部屋を別の人に又貸し（転貸）した場合、原則として大家さんは契約を解除できる。",
 exp:`<p>大家さんは、「この人なら」と信用して部屋を貸しています。勝手に知らない人が住み始めたら困りますよね。</p><p>だから<mark>無断の又貸しは、原則として契約解除の理由</mark>になります。</p><p>ただし、家族に住ませただけなど、<b>大家さんとの信頼関係をこわすほどではない特別な事情</b>があるときは、解除できないこともあります。</p>`,
 pt:"無断転貸 → 原則解除できる（信頼関係を壊さない特段の事情があれば不可）",
 hon:"賃借人が賃貸人の承諾を得ずに第三者に賃借物を転貸し使用させたときは、賃貸人は、原則として、契約の解除をすることができる。"},
{c:"ken",lv:1,a:true,
 q:"兄弟3人で持っている（共有している）家の雨もりを直す修理は、ほかの2人の同意がなくても1人でできる。",
 exp:`<p>1つのものを何人かで持つことを<b>共有</b>といいます。</p><p>共有物について何かするときのルールは、3つに分かれます。</p><p>・<b>保存</b>（壊れたところを直すなど）→ <mark>1人でできる</mark><br>・<b>管理</b>（短い期間貸すなど）→ 持分の過半数で決める<br>・<b>変更</b>（売る・建て替えるなど）→ 全員の同意</p><p>雨もりの修理はみんなのためになる「保存」なので、1人でできます。</p>`,
 pt:"共有：保存＝単独／管理＝持分の過半数／変更（重大なもの）＝全員",
 hon:"各共有者は、共有物の保存行為を単独ですることができる。"},
{c:"ken",lv:2,a:true,
 q:"本当は売るつもりがないのに、冗談で「この土地を売るよ」と言った。相手が冗談だと知らず、知らないことに落ち度もない場合、この売買契約は有効である。",
 exp:`<p>本心ではないことを、自分で分かっていて言うことを<b>心裡留保（しんりりゅうほ）</b>といいます。</p><p>言った本人が悪いので、<mark>原則として有効</mark>です。相手は本気だと思っているのですから。</p><p>ただし、相手が<b>冗談だと知っていた、または注意すれば分かった</b>場合は、無効になります。</p>`,
 pt:"心裡留保は原則有効。相手が知り、または知ることができたら無効",
 hon:"意思表示は、表意者がその真意ではないことを知ってしたときであっても、そのためにその効力を妨げられない。ただし、相手方がその意思表示が表意者の真意ではないことを知り、又は知ることができたときは、その意思表示は、無効とする。",
 w:[["心裡留保","しんりりゅうほ","本心ではないと分かっていて、わざとちがうことを言うこと"]]},
{c:"ken",lv:2,a:true,
 q:"AとBがしめし合わせて、本当は売らないのに土地を売ったことにした（ウソの契約）。この契約は無効だが、その事情を知らずにBから買ったCに対しては、Aは無効を主張できない。",
 exp:`<p>2人でしめし合わせたウソの契約を<b>通謀虚偽表示（つうぼうきょぎひょうじ）</b>といいます。本人たちはウソだと分かっているので、<b>無効</b>です。</p><p>でも、事情を知らない人がだまされて買ったら困りますよね。だから<mark>善意の第三者には、無効を主張できません</mark>。</p><p>詐欺のときとちがい、第三者に<b>「落ち度がない（無過失）」までは必要ありません</b>。ウソをついた本人たちの責任が重いからです。</p>`,
 pt:"虚偽表示は無効。ただし善意の第三者に対抗できない（無過失は不要）",
 hon:"相手方と通じてした虚偽の意思表示は、無効とする。この無効は、善意の第三者に対抗することができない。",
 w:[["通謀","つうぼう","2人以上でしめし合わせること"]]},
{c:"ken",lv:3,a:false,
 q:"土地の値段を大きく勘違いして契約した人は、勘違いしたことに重大な落ち度があっても、いつでも契約を取り消せる。",
 exp:`<p>契約の大事な部分について勘違いをすることを<b>錯誤（さくご）</b>といいます。重要な錯誤なら、<b>取り消す</b>ことができます。</p><p>でも、<mark>勘違いした人に重大な過失（ひどい不注意）があるときは、原則として取り消せません</mark>。少し調べれば分かったのに…という人まで守る必要はないからです。</p><p>ただし、相手も同じ勘違いをしていたときや、相手が勘違いに気づいていたときは、取り消せます。</p>`,
 pt:"錯誤は取消し可。ただし表意者に重大な過失があれば原則不可",
 hon:"錯誤が表意者の重大な過失によるものであった場合には、相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったときなどを除き、意思表示の取消しをすることができない。",
 w:[["錯誤","さくご","かんちがい"]]},
{c:"ken",lv:2,a:true,
 q:"成年被保佐人（判断する力が少し弱い人）が、保佐人の同意なしに自分の土地を売った場合、その契約は取り消すことができる。",
 exp:`<p>判断する力が弱い人を守るために、<b>制限行為能力者</b>という制度があります。</p><p>・<b>未成年者</b>（18歳未満）<br>・<b>成年被後見人</b>（判断する力がほとんどない）<br>・<b>被保佐人</b>（判断する力がかなり弱い）<br>・<b>被補助人</b>（判断する力が少し弱い）</p><p>被保佐人が<mark>土地や建物の売買など大事なこと</mark>をするには、保佐人の同意が必要です。同意がなければ取り消せます。</p>`,
 pt:"被保佐人の不動産売買は保佐人の同意が必要（なければ取消し可）",
 hon:"被保佐人が保佐人の同意を得ないで不動産の売買をした場合、当該売買契約は取り消すことができる。"},
{c:"ken",lv:3,a:true,
 q:"成年被後見人がした土地の売買契約は、成年後見人の同意を得ていても、取り消すことができる。",
 exp:`<p>成年被後見人は、判断する力が<b>ほとんどない</b>状態の人です。</p><p>同意をもらっても、その通りに行動できるとは限りません。だから<mark>同意があっても取り消せます</mark>（同意の意味がない）。</p><p>例外は、<b>日用品の買い物</b>など日常生活の行為だけ。成年被後見人の大事な契約は、成年後見人が<b>代わりに</b>します。</p>`,
 pt:"成年被後見人の行為は、後見人の同意があっても取消し可（日用品は除く）",
 hon:"成年被後見人が成年後見人の同意を得て土地を売却した場合であっても、成年後見人は、当該売買契約を取り消すことができる。"},
{c:"ken",lv:3,a:true,
 q:"代理人は、未成年者でもかまわない。未成年者の代理人がした契約を、未成年者であることを理由に本人が取り消すことはできない。",
 exp:`<p>代理人がした契約の効果は、<b>本人</b>に届きます。代理人自身は損も得もしません。</p><p>だから代理人を守る必要はなく、<mark>未成年者でも代理人になれます</mark>。そして、「代理人が未成年だったから」という理由では取り消せません。</p><p>未成年者を代理人に選んだのは本人なので、その責任は本人にある、という考え方です。</p>`,
 pt:"代理人は行為能力者でなくてよい（制限行為能力を理由に取消し不可）",
 hon:"制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。"},
{c:"ken",lv:3,a:true,fig:"dairi",
 q:"代理権のない人と契約した相手は、本人に「この契約を認めますか」と期間を決めて確認（催告）できる。期間内に返事がなければ、本人は認めなかった（追認拒絶）ことになる。",
 exp:`<p>無権代理の相手方は、本人が追認するかどうか分からず、不安な立場です。そこで相手方を守るしくみがあります。</p><p>・<b>催告</b>：本人に「認める？」と聞ける。<mark>返事がなければ「認めない」とみなす</mark><br>・<b>取消し</b>：代理権がないと知らなかった相手方は、本人が追認する前なら契約を取り消せる<br>・<b>無権代理人への責任追及</b>：一定の場合、勝手に契約した人に責任を取らせる</p><p>「返事なし ＝ 追認拒絶」がよくねらわれます。</p>`,
 pt:"無権代理の催告に返事なし → 追認を拒絶したものとみなす",
 hon:"無権代理の相手方は、本人に対し、相当の期間を定めて、その期間内に追認をするかどうかを確答すべき旨の催告をすることができる。この場合において、本人がその期間内に確答をしないときは、追認を拒絶したものとみなす。"},
{c:"ken",lv:3,a:true,fig:"dairi",
 q:"本人が「Bを私の代理人にした」と相手に伝えていたが、実はBに代理権を与えていなかった。相手がそれを信じ、信じたことに落ち度もなければ、Bがした契約の効果は本人に届く。",
 exp:`<p>代理権がないのに、まるで代理権があるように見える場合を<b>表見代理（ひょうけんだいり）</b>といいます。</p><p>本人が「Bは代理人です」と言ったせいで、相手が信じてしまったのなら、本人にも責任があります。だから<mark>相手が善意・無過失なら、契約は本人に効果がある</mark>とします。</p><p>ほかにも、与えた代理権の範囲をこえた場合や、代理権がなくなった後の場合にも、表見代理が成立することがあります。</p>`,
 pt:"表見代理：本人に落ち度＋相手方が善意無過失 → 本人に効果",
 hon:"第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内においてその他人が第三者との間でした行為について、その責任を負う。ただし、第三者が、その他人が代理権を与えられていないことを知り、又は過失によって知らなかったときは、この限りでない。",
 w:[["表見代理","ひょうけんだいり","代理権がないのに、あるように見えるため、本人に責任を負わせる制度"]]},
{c:"ken",lv:2,a:true,
 q:"お金を借りている人が「確かに借りています」と認めた（承認した）場合、時効のカウントはゼロからやり直しになる。",
 exp:`<p>時効のカウントがリセットされることを<b>時効の更新</b>といいます。</p><p>代表的なのが、<mark>借りている人が借金を認める「承認」</mark>です。一部だけ返したり、「もう少し待って」と言ったりするのも承認になります。</p><p>ほかに、裁判で権利が確定したときも更新されます。また、裁判を起こしている間などは時効が完成しない「<b>完成猶予</b>」というしくみもあります。</p>`,
 pt:"債務の承認 → 時効の更新（ゼロから数え直し）",
 hon:"時効は、権利の承認があったときは、その時から新たにその進行を始める。"},
{c:"ken",lv:3,a:false,
 q:"時効の期間が過ぎていれば、当事者が何も言わなくても、裁判所は時効を理由に判断しなければならない。",
 exp:`<p>時効で得をする人が、「時効だから払いません（自分のものです）」と<b>主張すること</b>を<b>援用（えんよう）</b>といいます。</p><p><mark>援用しなければ、裁判所は時効を理由に判断できません</mark>。「時効は使いたくない、ちゃんと払いたい」という人の気持ちも大切にするためです。</p>`,
 pt:"時効は「援用」しなければ裁判所は判断できない",
 hon:"時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。",
 w:[["援用","えんよう","時効の利益を受けると主張すること"]]},
{c:"ken",lv:3,a:true,fig:"nijuu",
 q:"AがBにだまされて土地を売り、契約を取り消した。その後でBがCにその土地を売った場合、AとCのどちらが勝つかは、先に登記をしたほうで決まる。",
 exp:`<p>詐欺の取消しと第三者の問題は、<b>取消しの「前」か「後」か</b>で考え方が変わります。</p><p>・取消し<b>前</b>の第三者 → 善意・無過失なら第三者の勝ち<br>・取消し<b>後</b>の第三者 → <mark>登記を先にしたほうが勝ち</mark></p><p>取り消した後なら、Aはすぐ登記を取り戻せたはず。だから二重譲渡と同じように、登記で決めるのです。</p>`,
 pt:"取消し後の第三者とは、登記の先後で決まる",
 hon:"Aが詐欺を理由にBとの売買契約を取り消した後、BがCに土地を売却した場合、AとCの優劣は登記の先後によって決まる。"},
{c:"ken",lv:3,a:true,fig:"nijuu",
 q:"二重譲渡で、あとから買ったCが、前の買主Bを困らせるためだけに買った「背信的悪意者」の場合、Bは登記がなくてもCに勝てる。",
 exp:`<p>二重譲渡は、ふつうは登記を先にしたほうが勝ちます。あとの買主が、前の売買を知っていても（悪意でも）、登記があれば勝てます。</p><p>でも、<b>前の買主を困らせる目的</b>や、高く売りつける目的で買った人まで守る必要はありません。こういう人を<b>背信的悪意者</b>といいます。</p><p><mark>背信的悪意者には、登記がなくても対抗できます</mark>。</p>`,
 pt:"単なる悪意者には登記が必要。背信的悪意者には登記なしで対抗できる",
 hon:"背信的悪意者は、登記の欠缺を主張するにつき正当な利益を有する第三者に当たらないため、先に買い受けた者は、登記なくして背信的悪意者に所有権を対抗することができる。"},
{c:"ken",lv:3,a:true,fig:"teitou",
 q:"抵当権のついた家が火事で焼けた場合、抵当権を持つ銀行は、家の持ち主に払われる前に差し押さえれば、火災保険金から回収できる。",
 exp:`<p>家が焼けてなくなっても、その代わりに<b>火災保険金</b>というお金が生まれます。</p><p>抵当権は、この<b>代わりのお金</b>にも効き目があります。これを<b>物上代位（ぶつじょうだいい）</b>といいます。</p><p>ただし、<mark>お金が持ち主に払われる前に、差し押さえる</mark>必要があります。払われてしまうと、持ち主のほかのお金とまざって区別できなくなるからです。賃料や売買代金にも物上代位できます。</p>`,
 pt:"物上代位：保険金・賃料などに及ぶ。払渡し前の差押えが必要",
 hon:"抵当権者は、抵当不動産の滅失によって債務者が受けるべき火災保険金請求権に対し、その払渡し前に差押えをすれば、物上代位を行うことができる。",
 w:[["物上代位","ぶつじょうだいい","担保の物の代わりに生まれたお金にも、担保の効き目を及ぼすこと"]]},
{c:"ken",lv:3,a:true,fig:"teitou",
 q:"抵当権をつけたとき、土地とその上の建物の持ち主が同じ人だった。競売で土地と建物の持ち主が別々になったら、建物のために地上権（法定地上権）が生まれる。",
 exp:`<p>競売で土地と建物の持ち主が別々になると、建物の持ち主は「他人の土地の上に建物を持っている」状態になります。このままでは建物をこわせと言われかねません。</p><p>そこで、一定の条件を満たすと、<mark>法律が自動的に建物のための地上権を作ってくれます</mark>。これが<b>法定地上権</b>です。</p><p>条件は、①抵当権をつけたとき土地の上に建物があった、②そのとき土地と建物の持ち主が同じ、③競売で持ち主が別々になった、の3つです。</p>`,
 pt:"法定地上権：設定時に建物あり＋同一所有者＋競売で別々に",
 hon:"土地及びその上に存する建物が同一の所有者に属する場合において、その土地又は建物につき抵当権が設定され、その実行により所有者を異にするに至ったときは、その建物について、地上権が設定されたものとみなす。"},
{c:"ken",lv:3,a:true,
 q:"抵当権のついた建物を借りて住んでいる人は、競売でその建物が売られても、すぐに出て行く必要はなく、6か月間は明け渡しを待ってもらえる。",
 exp:`<p>抵当権をつけた後に建物を借りた人は、競売で買った人に対抗できません。でも、すぐ出て行けと言われたら、引っ越し先が見つかりません。</p><p>そこで、<mark>競売で買った人が買った時から6か月間は、明け渡しが猶予</mark>されます。</p><p>ただし、その間も家賃に当たるお金は、新しい持ち主に払う必要があります。</p>`,
 pt:"抵当建物の賃借人：競売の買受けから6か月の明渡し猶予",
 hon:"抵当権者に対抗することができない賃貸借により抵当権の目的である建物の使用又は収益をする者で競売手続の開始前から使用又は収益をする者は、その建物の競売における買受人の買受けの時から6か月を経過するまでは、その建物を買受人に引き渡すことを要しない。"},
{c:"ken",lv:2,a:false,
 q:"人の借金の保証人になる約束（保証契約）は、口約束だけでも有効に成立する。",
 exp:`<p>保証人は、他人の借金を代わりに払うかもしれない、とても重い立場です。</p><p>軽い気持ちで引き受けないよう、<mark>保証契約は書面（または電磁的記録）でしなければ効力がありません</mark>。</p><p>ふつうの契約は口約束でも成立しますが、保証契約は大事な例外です。</p>`,
 pt:"保証契約は書面（電磁的記録）でしなければ無効",
 hon:"保証契約は、書面でしなければ、その効力を生じない。"},
{c:"ken",lv:2,a:true,
 q:"ふつうの保証人は「先に本人に請求して」と言えるが、連帯保証人はそう言えない。",
 exp:`<p>保証人には、ふつうの保証人と<b>連帯保証人</b>があります。</p><p>ふつうの保証人は、<br>・「まず本人に請求して」（<b>催告の抗弁権</b>）<br>・「本人には財産があるから、先にそちらから取って」（<b>検索の抗弁権</b>）<br>と言えます。</p><p><mark>連帯保証人には、この2つがありません</mark>。いきなり請求されても払わなければならない、重い立場です。</p>`,
 pt:"連帯保証人には催告の抗弁権・検索の抗弁権がない",
 hon:"連帯保証人は、催告の抗弁権及び検索の抗弁権を有しない。"},
{c:"ken",lv:2,a:true,
 q:"相手が約束を守らない（債務不履行）とき、契約を解除するには、原則として「〇日までに守ってください」と期間を決めて催促（催告）する必要がある。",
 exp:`<p>相手が約束どおりにしてくれないとき、契約をやめる（<b>解除</b>）ことができます。</p><p>でも、いきなりやめるのではなく、<mark>原則として、相当の期間を決めて催告し、それでも守られないときに解除</mark>できます。</p><p>ただし、もう絶対に実行できない（履行不能）ときや、相手がはっきり「やりません」と言ったときなどは、催告なしで解除できます。</p>`,
 pt:"解除は原則として催告が必要（履行不能などは催告不要）",
 hon:"当事者の一方がその債務を履行しない場合において、相手方が相当の期間を定めてその履行の催告をし、その期間内に履行がないときは、相手方は、契約の解除をすることができる。"},
{c:"ken",lv:2,a:true,
 q:"買った家に、契約の内容に合わない雨もりがあった。買主は、それを知った時から1年以内に売主に知らせれば、修理や代金を下げることなどを求められる。",
 exp:`<p>買ったものが契約の内容に合わないことを<b>契約不適合</b>といいます。</p><p>買主ができることは、<mark>①直してと言う（追完請求）②代金を下げてと言う（代金減額請求）③損害賠償 ④解除</mark>の4つです。</p><p>種類や品質の不適合なら、<b>知った時から1年以内に売主に通知</b>すれば、これらの権利を守れます。</p>`,
 pt:"契約不適合：追完・代金減額・損害賠償・解除。知った時から1年以内に通知",
 hon:"売主が種類又は品質に関して契約の内容に適合しない目的物を買主に引き渡した場合において、買主がその不適合を知った時から1年以内にその旨を売主に通知しないときは、買主は、その不適合を理由として、履行の追完の請求、代金の減額の請求、損害賠償の請求及び契約の解除をすることができない。"},
{c:"ken",lv:2,a:false,
 q:"売主がすでに家の引渡しの準備にとりかかった後でも、買主は手付を放棄すれば、いつでも契約を解除できる。",
 exp:`<p>手付を使った解除（手付解除）には、期限があります。</p><p><mark>相手方が契約の実行（履行）にとりかかった後は、手付解除はできません</mark>。</p><p>相手は準備にお金や手間をかけているので、急にやめられると大損をするからです。自分が準備にとりかかっていても、<b>相手がまだなら</b>手付解除できます。</p>`,
 pt:"手付解除は「相手方が履行に着手するまで」",
 hon:"買主が売主に手付を交付したときは、買主はその手付を放棄し、売主はその倍額を現実に提供して、契約の解除をすることができる。ただし、その相手方が契約の履行に着手した後は、この限りでない。"},
{c:"ken",lv:3,a:true,
 q:"借りている家を使うために借主が必要な修理代（必要費）を払った場合、借主は、すぐに大家さんにその費用を請求できる。",
 exp:`<p>借主が家のために払ったお金には、2種類あります。</p><p>・<b>必要費</b>（雨もりの修理など、使うのに必要なもの）→ <mark>すぐに請求できる</mark><br>・<b>有益費</b>（家の価値を上げる改良など）→ 契約が終わったときに請求できる</p><p>修理は本来、大家さんの義務なので、立て替えたお金はすぐ返してもらえます。</p>`,
 pt:"必要費は直ちに、有益費は契約終了時に請求できる",
 hon:"賃借人は、賃借物について賃貸人の負担に属する必要費を支出したときは、賃貸人に対し、直ちにその償還を請求することができる。"},
{c:"ken",lv:3,a:false,
 q:"借主は「敷金を返してくれるまで部屋を明け渡さない」と言うことができる。",
 exp:`<p>敷金は、家賃の未払いや修理代などを差し引いて、残りを返すお金です。</p><p>部屋を明け渡して、中を確認しないと、いくら差し引くかが決まりません。だから<mark>明け渡しが先、敷金の返還はその後</mark>です。</p><p>「敷金を返すまで出ない」とは言えません。</p>`,
 pt:"明渡しが先、敷金返還が後（同時履行ではない）",
 hon:"賃貸人は、賃貸借が終了し、かつ、賃貸物の返還を受けたときは、賃借人に対し、敷金の額から賃借人の債務額を控除した残額を返還しなければならない。"},
{c:"ken",lv:3,a:true,
 q:"賃貸中の建物を買った新しい持ち主が、借りている人に家賃を請求するには、自分への所有権移転登記をすませておく必要がある。",
 exp:`<p>建物が売られると、大家さんの立場（賃貸人の地位）も新しい持ち主に移ります。</p><p>でも借りている人からすると、本当にこの人が新しい大家さんなのか分かりません。二重に家賃を払わされたら大変です。</p><p>そこで、<mark>新しい持ち主が家賃を請求するには、所有権移転登記が必要</mark>とされています。</p>`,
 pt:"賃貸人の地位の移転を賃借人に主張するには、所有権移転登記が必要",
 hon:"賃貸人たる地位の移転は、賃貸物である不動産について所有権の移転の登記をしなければ、賃借人に対抗することができない。"},
{c:"ken",lv:3,a:true,
 q:"タダで家を借りる約束（使用貸借）は、借りた人が亡くなると終わる。",
 exp:`<p>お金を払わずに物を借りることを<b>使用貸借（しようたいしゃく）</b>といいます。親せきや友だちなど、特別な関係の人にタダで貸すことが多いですね。</p><p>「<b>あなただから貸した</b>」という関係なので、<mark>借りた人が亡くなると、契約は終わり</mark>ます。相続人が引きつぐことはありません。</p><p>家賃を払う賃貸借なら、借りた人が亡くなっても相続人が引きつぎます。</p>`,
 pt:"使用貸借は借主の死亡で終了（賃貸借は相続される）",
 hon:"使用貸借は、借主の死亡によって終了する。"},
{c:"ken",lv:2,a:false,fig:"shakuchi",
 q:"借地権を更新した場合、更新後の期間は、何回目の更新でも最低30年である。",
 exp:`<p>借地権の期間は、最初は<b>30年以上</b>です。更新した後の期間は短くなります。</p><p>・<b>1回目</b>の更新 → <mark>20年以上</mark><br>・<b>2回目以降</b>の更新 → <mark>10年以上</mark></p><p>「30 → 20 → 10」と、だんだん短くなると覚えましょう。</p>`,
 pt:"借地権：最初30年→1回目の更新20年→2回目以降10年",
 hon:"当事者が借地契約を更新する場合においては、その期間は、更新の日から10年（借地権の設定後の最初の更新にあっては、20年）とする。ただし、当事者がこれより長い期間を定めたときは、その期間とする。"},
{c:"ken",lv:3,a:false,fig:"shakuchi",
 q:"借地の上に建てた自分の家を、同居している長男の名前で登記していても、土地の新しい持ち主に借地権を主張できる。",
 exp:`<p>借地権を新しい土地の持ち主に主張するには、<b>土地の上の建物を登記</b>しておく必要がありました。</p><p>ただし、その登記は<mark>借地権者「本人」の名前</mark>でなければいけません。家族の名前では、だれが土地を借りているのか分からないからです。</p><p>同居の家族名義でもダメ、というのが裁判所の考え方です。</p>`,
 pt:"借地権の対抗要件となる建物登記は、借地権者本人の名義が必要",
 hon:"借地権者が借地上に所有する建物について、自己と同居する長男名義で保存登記をしている場合、借地権者は当該借地権を第三者に対抗することができる。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"期間を50年以上として、更新しないことを決める「一般定期借地権」は、書面（または電磁的記録）で契約しなければならない。",
 exp:`<p>借地権は、ふつうは更新されてずっと続きます。でも、<b>期間が来たら必ず返してもらう</b>借地権もあります。これが<b>定期借地権</b>です。</p><p>・<b>一般定期借地権</b>：<mark>50年以上</mark>、書面（電磁的記録も可）で契約<br>・<b>事業用定期借地権</b>：10年以上50年未満、<mark>公正証書</mark>で契約（お店などの事業用だけ）<br>・<b>建物譲渡特約付借地権</b>：30年以上</p>`,
 pt:"一般定期借地は50年以上・書面／事業用定期借地は公正証書",
 hon:"存続期間を50年以上として借地権を設定する場合においては、契約の更新及び建物の築造による存続期間の延長がなく、建物の買取りの請求をしないこととする旨を定めることができる。この特約は、公正証書による等書面（又は電磁的記録）によってしなければならない。"},
{c:"ken",lv:3,a:true,
 q:"借地権の期間が終わって更新されなかったとき、借地権者は、地主に「この建物を時価で買い取って」と請求できる。",
 exp:`<p>借地の上に建てた建物は、借地権者のものです。期間が終わって土地を返すとき、建物をこわすのはもったいないですよね。</p><p>そこで<mark>建物を時価で買い取るよう請求できる</mark>権利があります。これを<b>建物買取請求権</b>といいます。</p><p>ただし、借地権者が地代を払わないなど、契約違反で解除された場合は、この請求はできません。</p>`,
 pt:"期間満了で更新なし → 建物買取請求権（債務不履行解除なら不可）",
 hon:"借地権の存続期間が満了した場合において、契約の更新がないときは、借地権者は、借地権設定者に対し、建物を時価で買い取るべきことを請求することができる。"},
{c:"ken",lv:2,a:false,
 q:"大家さんは、更新したくなければ、理由がなくても、期間が終わる1か月前に「更新しません」と伝えればよい。",
 exp:`<p>借家の借主は、住む場所を失うと大変なので、強く守られています。</p><p>大家さんが更新を断るには、<mark>期間が終わる1年前から6か月前までに通知</mark>し、さらに<b>正当な理由（正当事由）</b>が必要です。</p><p>正当事由とは、大家さん自身がどうしても住む必要がある、などの事情です。立退料を払うことも考慮されます。</p>`,
 pt:"借家の更新拒絶：1年前〜6か月前の通知＋正当事由",
 hon:"建物の賃貸人による建物の賃貸借の更新拒絶の通知は、建物の賃貸人及び賃借人が建物の使用を必要とする事情等を考慮して、正当の事由があると認められる場合でなければ、することができない。"},
{c:"ken",lv:3,a:true,
 q:"更新のない「定期建物賃貸借」を結ぶには、大家さんが事前に、契約書とは別の書面を渡して「更新がなく、期間が終われば終了します」と説明しなければならない。",
 exp:`<p><b>定期建物賃貸借</b>（定期借家）は、期間が来たら更新されずに終わる借家です。</p><p>借主にとって不利なので、<br>① 契約は<b>書面（電磁的記録も可）</b>で<br>② <mark>契約前に、契約書とは別の書面で「更新がない」ことを説明</mark>（借主の承諾があれば電磁的方法も可）<br>が必要です。</p><p>説明をしなかったら、「更新がない」という部分は無効になり、ふつうの借家になります。</p>`,
 pt:"定期借家：書面で契約＋事前に別書面で「更新なし」を説明",
 hon:"定期建物賃貸借をしようとするときは、建物の賃貸人は、あらかじめ、建物の賃借人に対し、契約の更新がなく、期間の満了により当該建物の賃貸借は終了することについて、その旨を記載した書面を交付して説明しなければならない。"},
{c:"ken",lv:3,a:true,
 q:"借主がつけたエアコンなどを、契約終了のときに大家さんに買い取ってもらう権利（造作買取請求権）は、特約でなくすことができる。",
 exp:`<p>大家さんの同意を得てつけたエアコンや畳などを<b>造作（ぞうさく）</b>といいます。借家が終わるとき、借主は造作を時価で買い取ってと請求できます。</p><p>でも、この権利は<mark>「買い取りません」という特約でなくすことができます</mark>。</p><p>借地の<b>建物買取請求権</b>は特約でなくせない（定期借地などは別）ので、ちがいに注意しましょう。</p>`,
 pt:"造作買取請求権は特約で排除できる",
 hon:"建物の賃貸人の同意を得て建物に付加した造作がある場合には、建物の賃借人は、建物の賃貸借が期間の満了又は解約の申入れによって終了するときに、建物の賃貸人に対し、その造作を時価で買い取るべきことを請求することができるが、この規定は特約で排除することができる。"},
{c:"ken",lv:2,a:true,fig:"souzoku",
 q:"おじいさんが亡くなったとき、その子（父）がすでに亡くなっていたら、孫が父の代わりに相続する。",
 exp:`<p>本来相続するはずの人が先に亡くなっていたとき、その子が代わりに相続することを<b>代襲相続（だいしゅうそうぞく）</b>といいます。</p><p>この例では、<mark>父の代わりに孫が相続</mark>します。孫の取り分は、父が受け取るはずだった分と同じです。</p><p>代襲相続が起きるのは、先に<b>死亡</b>していたとき、<b>相続欠格</b>や<b>廃除</b>で相続できないときです。</p>`,
 pt:"代襲相続：死亡・欠格・廃除のとき、子の子（孫）が代わりに相続",
 hon:"被相続人の子が、相続の開始以前に死亡したときは、その者の子がこれを代襲して相続人となる。",
 w:[["代襲相続","だいしゅうそうぞく","相続人の代わりに、その子が相続すること"]]},
{c:"ken",lv:3,a:false,fig:"souzoku",
 q:"父が相続放棄をした場合、父の子（孫）が父の代わりに相続する（代襲相続する）。",
 exp:`<p>相続放棄をした人は、<b>はじめから相続人ではなかった</b>ことになります。</p><p>そのため、<mark>相続放棄の場合は、代襲相続は起きません</mark>。孫が代わりに相続することはありません。</p><p>代襲相続が起きるのは「死亡・欠格・廃除」の3つだけ。「放棄」は入らない、と覚えましょう。</p>`,
 pt:"相続放棄では代襲相続は起きない",
 hon:"相続人が相続の放棄をした場合には、その者の子が代襲して相続人となる。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"自分で手書きする遺言（自筆証書遺言）でも、財産の一覧（財産目録）の部分はパソコンで作ってよい。",
 exp:`<p><b>自筆証書遺言</b>は、全文・日付・氏名を<b>自分で手書き</b>して、はんこを押す遺言です。</p><p>ただし、財産がたくさんあると書くのが大変なので、<mark>財産目録はパソコンで作ったり、通帳のコピーを付けたりしてもOK</mark>になりました。</p><p>その場合、目録の<b>すべてのページに署名・押印</b>が必要です。</p>`,
 pt:"自筆証書遺言の財産目録は手書き不要（各ページに署名押印）",
 hon:"自筆証書にこれと一体のものとして相続財産の目録を添付する場合には、その目録については、自書することを要しない。この場合において、遺言者は、その目録の毎葉に署名し、印を押さなければならない。"},
{c:"ken",lv:3,a:true,
 q:"15歳になれば、親の同意がなくても、ひとりで遺言をすることができる。",
 exp:`<p>遺言は、亡くなった後の財産について、自分の最後の気持ちを残すものです。</p><p>本人の気持ちを大切にするため、<mark>15歳以上なら、親の同意なしに遺言できます</mark>。未成年者の契約のルール（親の同意が必要）とはちがいます。</p><p>また、遺言はいつでも書き直せます。前の遺言と内容がぶつかる部分は、<b>新しい遺言</b>が優先です。</p>`,
 pt:"遺言は15歳から。内容が抵触する部分は後の遺言が優先",
 hon:"15歳に達した者は、遺言をすることができる。"},
{c:"ken",lv:3,a:true,
 q:"夫が亡くなったあと、妻が住んでいた夫名義の家に、そのままタダで住み続けられる権利（配偶者居住権）を、遺産分割などで得ることができる。",
 exp:`<p>夫が亡くなると、家を子どもが相続することもあります。そのとき、妻が住む家を失ったら困りますよね。</p><p>そこで、<mark>配偶者が住んでいた家に、原則として亡くなるまでタダで住める</mark>権利ができました。これが<b>配偶者居住権</b>です。遺産分割や遺言（遺贈）で取得します。</p><p>この権利を新しい持ち主などに主張するには、<b>登記</b>が必要です。</p>`,
 pt:"配偶者居住権：遺産分割・遺贈で取得、原則終身、対抗には登記",
 hon:"被相続人の配偶者は、被相続人の財産に属した建物に相続開始の時に居住していた場合において、遺産分割によって配偶者居住権を取得するものとされたときは、その居住していた建物の全部について無償で使用及び収益をする権利を取得する。"},
{c:"ken",lv:2,a:false,
 q:"兄弟3人で共有している土地を他人に売るには、持分の過半数を持つ2人が賛成すればよい。",
 exp:`<p>共有物そのものを売ることは、形や性質を大きく変える<b>変更</b>にあたります。</p><p><mark>共有物全体を売るには、共有者全員の同意が必要</mark>です。2人の賛成では足りません。</p><p>ただし、<b>自分の持分だけ</b>なら、ほかの人の同意なしに売れます。</p>`,
 pt:"共有物全体の売却は全員の同意。自分の持分だけなら単独で処分可",
 hon:"各共有者は、他の共有者の同意を得なければ、共有物に変更（その形状又は効用の著しい変更を伴わないものを除く。）を加えることができない。"},
{c:"ken",lv:2,a:true,
 q:"マンションの廊下や階段、エレベーターは、住んでいる人みんなで使う「共用部分」である。",
 exp:`<p>マンションには、2つの部分があります。</p><p>・<b>専有部分</b>：それぞれの部屋（自分だけのもの）<br>・<b>共用部分</b>：<mark>廊下・階段・エレベーターなど、みんなで使う部分</mark></p><p>このほか、集会室のように、本来は部屋として使える場所を<b>規約</b>で共用部分にすることもできます（規約共用部分。第三者に主張するには登記が必要）。</p>`,
 pt:"専有部分＝各部屋／共用部分＝廊下・階段など",
 hon:"数個の専有部分に通ずる廊下又は階段室その他構造上区分所有者の全員又はその一部の共用に供されるべき建物の部分は、区分所有権の目的とならない。"},
{c:"ken",lv:3,a:true,
 q:"マンションの部屋（専有部分）と、その敷地を使う権利（敷地利用権）は、規約で特別に決めていない限り、別々に売ることはできない。",
 exp:`<p>マンションの部屋だけ売って、敷地を使う権利は手元に残す…ということができたら、部屋を買った人は土地を使えず困ってしまいます。</p><p>だから<mark>専有部分と敷地利用権は、原則としてセットで動き、別々に処分できません</mark>。</p><p>ただし、規約で別に決めることはできます。</p>`,
 pt:"専有部分と敷地利用権は、規約に別段の定めがなければ分離処分不可",
 hon:"敷地利用権が数人で有する所有権その他の権利である場合には、区分所有者は、規約に別段の定めがあるときを除き、その有する専有部分とその専有部分に係る敷地利用権とを分離して処分することができない。"},
{c:"ken",lv:3,a:true,
 q:"会社の従業員が仕事中に人にけがをさせた場合、会社も被害者に損害賠償をしなければならないことがある（使用者責任）。",
 exp:`<p>人に損害を与えたら賠償する責任があります（<b>不法行為</b>）。</p><p>会社は従業員を使ってもうけているので、<mark>従業員が仕事の中で人に損害を与えたら、会社も責任を負います</mark>。これを<b>使用者責任</b>といいます。</p><p>会社が被害者に払った後は、事情に応じて、ある程度の範囲で従業員に請求（求償）できます。</p>`,
 pt:"使用者責任：事業の執行についての不法行為は会社も賠償",
 hon:"ある事業のために他人を使用する者は、被用者がその事業の執行について第三者に加えた損害を賠償する責任を負う。"},
{c:"ken",lv:3,a:true,
 q:"けがをさせられた（人の体を傷つけられた）場合の損害賠償の請求権は、損害と加害者を知った時から5年間使わないと時効で消える。",
 exp:`<p>不法行為の損害賠償請求権の時効は、ふつうは<b>損害と加害者を知った時から3年</b>です。</p><p>でも、<mark>人の命や体を傷つけられた場合は5年</mark>に延びます。被害が大きく、治療に時間がかかることも多いからです。</p><p>また、知らなくても、不法行為の時から<b>20年</b>たつと消えます。</p>`,
 pt:"不法行為の時効：知った時から3年（生命・身体は5年）／行為時から20年",
 hon:"人の生命又は身体を害する不法行為による損害賠償請求権は、被害者又はその法定代理人が損害及び加害者を知った時から5年間行使しないときは、時効によって消滅する。"},
{c:"ken",lv:2,a:true,
 q:"建物を新しく建てたときは、その建物の持ち主になった日から1か月以内に、表題登記を申請しなければならない。",
 exp:`<p>登記簿は、大きく2つの部分に分かれます。</p><p>・<b>表題部</b>：建物の場所・種類・構造・広さなど（どんな物件か）<br>・<b>権利部</b>：だれが持ち主か、抵当権があるか など</p><p>新しく建物ができたら、まず表題部を作る<b>表題登記</b>をします。これは<mark>1か月以内の申請義務</mark>があります。</p><p>一方、権利部の登記は原則として義務ではありません（相続登記などは例外）。</p>`,
 pt:"表題登記は1か月以内の申請義務。権利の登記は原則任意",
 hon:"新築した建物の所有権を取得した者は、その所有権の取得の日から1か月以内に、表題登記を申請しなければならない。"},
{c:"ken",lv:2,a:true,
 q:"売買による所有権移転の登記は、原則として、売主と買主が一緒に（共同で）申請する。",
 exp:`<p>登記によって得をする人（<b>登記権利者</b>、ここでは買主）と、損をする人（<b>登記義務者</b>、ここでは売主）が<mark>一緒に申請</mark>するのが原則です（<b>共同申請</b>）。</p><p>損をする人も加わることで、ウソの登記を防げます。</p><p>例外として、<b>相続</b>による登記や、判決による登記などは、1人で申請できます。</p>`,
 pt:"権利の登記は原則共同申請（相続などは単独）",
 hon:"権利に関する登記の申請は、法令に別段の定めがある場合を除き、登記権利者及び登記義務者が共同してしなければならない。"},
{c:"ken",lv:3,a:true,
 q:"土地や建物の持ち主が引っ越して住所が変わったときは、変わった日から2年以内に、住所変更の登記を申請しなければならない。",
 exp:`<p>登記簿の住所が古いままだと、持ち主に連絡がとれず、空き家や所有者不明の土地が増えてしまいます。</p><p>そこで<mark>2026年4月から、住所や氏名が変わったら2年以内に変更登記をすることが義務</mark>になりました。</p><p>正当な理由なく怠ると、<b>5万円以下の過料</b>になることがあります。相続登記の義務化（3年以内）とあわせて覚えましょう。</p>`,
 pt:"住所・氏名の変更登記：変更日から2年以内に申請義務（2026年4月〜）",
 hon:"所有権の登記名義人の氏名若しくは名称又は住所について変更があったときは、当該所有権の登記名義人は、その変更があった日から2年以内に、氏名等についての変更の登記を申請しなければならない。"},
{c:"ken",lv:3,a:true,
 q:"仕事をまかせる契約（委任契約）は、まかせた人もまかされた人も、いつでも解除することができる。",
 exp:`<p><b>委任</b>は、信頼関係にもとづいて仕事をまかせる契約です（不動産屋さんへの依頼や、弁護士への依頼など）。</p><p>信頼がなくなったら続けても意味がないので、<mark>どちらからでも、いつでも解除できます</mark>。</p><p>ただし、相手に不利な時期に解除した場合などは、やむを得ない理由がない限り、損害賠償が必要になることがあります。また、委任は当事者の<b>死亡</b>などで終わります。</p>`,
 pt:"委任は各当事者がいつでも解除できる（不利な時期なら損害賠償の場合あり）",
 hon:"委任は、各当事者がいつでもその解除をすることができる。"}
);

Q.push(
{c:"hou",lv:1,a:true,fig:"toshi",
 q:"都市計画区域は、原則として都道府県が指定する。",
 exp:`<p><b>都市計画区域</b>は、「ここを1つの街としてまとめて計画しよう」というエリアです。</p><p>指定するのは<mark>原則として都道府県</mark>です。2つ以上の都府県にまたがる場合は、<b>国土交通大臣</b>が指定します。</p><p>市町村の境目にとらわれず、実際の街のつながりに合わせて決められます。</p>`,
 pt:"都市計画区域の指定：都道府県（2以上の都府県にまたがるなら国土交通大臣）",
 hon:"都市計画区域は、原則として都道府県が指定するが、2以上の都府県の区域にわたる都市計画区域は、国土交通大臣が指定する。"},
{c:"hou",lv:1,a:true,
 q:"第一種低層住居専用地域は、低い住宅の、静かで良い住まいの環境を守るための用途地域である。",
 exp:`<p>用途地域の中でも、もっとも静かな住宅地向けなのが<b>第一種低層住居専用地域</b>です。</p><p>ここでは<mark>高い建物や大きなお店、工場などは建てられません</mark>。建物の高さも、原則<b>10mか12m</b>までに制限されます（絶対高さ制限）。</p><p>名前の「低層」「住居専用」から、どんな場所か想像しやすいですね。</p>`,
 pt:"第一種低層住居専用地域 ＝ 低層住宅の良好な環境を守る（高さ10m or 12m）",
 hon:"第一種低層住居専用地域は、低層住宅に係る良好な住居の環境を保護するため定める地域とする。"},
{c:"hou",lv:1,a:true,
 q:"建物を建てる前に、その設計が法律に合っているかどうか、役所や指定確認検査機関のチェック（建築確認）を受ける必要がある。",
 exp:`<p><b>建築確認</b>は、工事を始める前に「この設計は建築基準法などに合っています」と確認してもらう手続きです。</p><p>確認を受けて<b>確認済証</b>をもらうまで、<mark>工事を始めてはいけません</mark>。</p><p>工事が終わったら<b>完了検査</b>を受けます。チェックは、役所の建築主事や、民間の指定確認検査機関が行います。</p>`,
 pt:"建築確認 → 確認済証 → 着工 → 完了検査",
 hon:"建築主は、建築確認を要する建築物の建築をしようとする場合、その工事に着手する前に、建築主事等の確認を受け、確認済証の交付を受けなければならない。"},
{c:"hou",lv:2,a:true,fig:"toshi",
 q:"都市計画区域の外でも、そのままにしておくと将来困りそうな場所には、都道府県が「準都市計画区域」を指定できる。",
 exp:`<p>都市計画区域の外でも、大きな道路ぞいにお店が次々と建つなど、放っておくと街並みが乱れる場所があります。</p><p>そこで<mark>都道府県が「準都市計画区域」を指定</mark>して、用途地域などの一部のルールをかけられます。</p><p>ただし、街を積極的に作るための「市街化区域・市街化調整区域の線引き」は、準都市計画区域ではできません。</p>`,
 pt:"準都市計画区域：都市計画区域外に都道府県が指定（線引きはできない）",
 hon:"都道府県は、都市計画区域外の区域のうち、そのまま土地利用を整序し、又は環境を保全するための措置を講ずることなく放置すれば、将来における一体の都市としての整備、開発及び保全に支障が生じるおそれがあると認められる一定の区域を、準都市計画区域として指定することができる。"},
{c:"hou",lv:3,a:false,
 q:"特別用途地区は、用途地域が定められていない場所に定めることができる。",
 exp:`<p>名前が似ている2つの地区に注意です。</p><p>・<b>特別用途地区</b>：<mark>用途地域の「中」</mark>で、ルールを上乗せしたり、ゆるめたりする（文教地区など）<br>・<b>特定用途制限地域</b>：<mark>用途地域の「外」</mark>（市街化調整区域を除く）で、困る建物を制限する</p><p>「特別」は中、「特定…制限」は外、と覚えましょう。</p>`,
 pt:"特別用途地区は用途地域内。特定用途制限地域は用途地域外",
 hon:"特別用途地区は、用途地域が定められていない土地の区域（市街化調整区域を除く。）内において定めることができる。（→ 誤り）"},
{c:"hou",lv:3,a:true,
 q:"都市計画で決まった道路などの予定地（都市計画施設の区域）に建物を建てるには、原則として都道府県知事などの許可が必要である。",
 exp:`<p>将来、道路や公園を作る予定の土地に、大きな建物を建てられたら困ります。工事のときに取りこわしが大変だからです。</p><p>そこで、<mark>都市計画施設の区域や市街地開発事業の区域で建物を建てるには、原則として知事等の許可</mark>が必要です（都市計画法53条）。</p><p>ただし、簡単にこわせる軽い建物（木造2階建てまでなど）は、許可が出やすくなっています。</p>`,
 pt:"都市計画施設等の区域内の建築 → 知事等の許可（53条）",
 hon:"都市計画施設の区域又は市街地開発事業の施行区域内において建築物の建築をしようとする者は、原則として、都道府県知事等の許可を受けなければならない。"},
{c:"hou",lv:2,a:true,fig:"kaihatsu",
 q:"図書館や公民館、駅舎などを建てるための開発行為は、広さに関係なく開発許可がいらない。",
 exp:`<p>開発許可には、<b>許可がいらない例外</b>があります。</p><p>・<mark>図書館・公民館・駅舎・変電所</mark>など、公益上必要な建物のための開発<br>・<b>都市計画事業</b>や<b>土地区画整理事業</b>などとして行う開発<br>・<b>非常災害</b>のための応急の開発</p><p>これらは、場所や広さに関係なく許可不要です。（学校・病院・社会福祉施設は、この例外に入らないので注意）</p>`,
 pt:"図書館・公民館・駅舎などの公益施設 → 開発許可不要（学校・病院は必要）",
 hon:"駅舎その他の鉄道の施設、図書館、公民館、変電所等の公益上必要な建築物の建築の用に供する目的で行う開発行為は、開発許可を受ける必要がない。"},
{c:"hou",lv:3,a:false,fig:"kaihatsu",
 q:"農家が住む家を建てるための開発行為は、市街化区域でも広さに関係なく開発許可がいらない。",
 exp:`<p>農業・林業・漁業の人の住宅や、そのための建物（畜舎など）を建てる開発は、<b>市街化区域以外</b>なら許可がいりません。</p><p>でも、<mark>市街化区域ではこの例外はなく、1,000㎡以上なら許可が必要</mark>です。</p><p>市街化区域は「街をつくる所」なので、農業のための特別扱いはしない、という考え方です。</p>`,
 pt:"農林漁業用の例外は市街化区域にはない（1,000㎡以上なら許可）",
 hon:"市街化区域内において、農業を営む者の居住の用に供する建築物の建築の用に供する目的で行う開発行為は、その規模にかかわらず開発許可を受ける必要がない。（→ 誤り）"},
{c:"hou",lv:3,a:true,
 q:"開発許可を申請する前に、その開発に関係する道路や公園などの公共施設の管理者と協議し、同意を得ておく必要がある。",
 exp:`<p>開発をすると、近くの道路に車がふえたり、新しい公園を作ったりします。</p><p>だから申請する前に、<br>・<mark>すでにある公共施設の管理者 → 協議＋同意</mark><br>・<b>新しくできる</b>公共施設を管理する人 → 協議<br>が必要です。</p><p>「すでにあるもの」は同意まで、「これから作るもの」は協議だけ、というちがいがポイントです。</p>`,
 pt:"既存の公共施設の管理者 → 協議・同意／新設の公共施設の管理者 → 協議",
 hon:"開発許可を申請しようとする者は、あらかじめ、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。"},
{c:"hou",lv:3,a:true,
 q:"開発許可を受けた区域では、工事完了の公告の後は、原則として、予定していた建物以外の建物は建てられない。",
 exp:`<p>開発許可は、「ここにはこういう建物を建てます」という計画にもとづいて出されます。</p><p>だから工事完了の公告の後は、<mark>予定建築物以外は原則として建てられません</mark>。</p><p>ただし、その場所に<b>用途地域</b>が定められている場合は、用途地域のルールで十分に管理できるので、予定建築物以外も建てられます。また、知事が許可したときもOKです。</p>`,
 pt:"完了公告後は予定建築物以外は原則不可（用途地域があれば例外）",
 hon:"開発許可を受けた開発区域内においては、工事完了の公告があった後は、原則として、当該開発許可に係る予定建築物等以外の建築物を新築してはならない。"},
{c:"hou",lv:2,a:true,fig:"youto",
 q:"神社・お寺・教会、保育所、診療所、公衆浴場は、どの用途地域にも建てることができる。",
 exp:`<p>用途地域ごとに建てられる建物が決まっていますが、<b>どこにでも建てられる建物</b>もあります。</p><p><mark>神社・寺院・教会、保育所、診療所、公衆浴場、交番、巡査派出所</mark>などです。</p><p>どれも、住宅地にも工場地帯にも必要な、生活に身近な施設です。「<b>診療所</b>」は小さなクリニックのことで、ベッドが20床以上の「<b>病院</b>」とは別に扱います。</p>`,
 pt:"どこでもOK：神社寺院教会・保育所・診療所・公衆浴場・交番",
 hon:"神社、寺院、教会、保育所、診療所、公衆浴場は、すべての用途地域内において建築することができる。"},
{c:"hou",lv:2,a:false,fig:"youto",
 q:"病院は、第一種低層住居専用地域に建てることができる。",
 exp:`<p>病院は、救急車が出入りしたり、たくさんの人や車が来たりします。</p><p>そのため、<mark>第一種・第二種低層住居専用地域、田園住居地域、工業地域、工業専用地域には、病院は建てられません</mark>。</p><p>一方、小さな<b>診療所</b>はどこでもOK。病院と診療所のちがいがよくねらわれます。</p>`,
 pt:"病院は低層住居専用・田園住居・工業・工業専用地域に建てられない",
 hon:"第一種低層住居専用地域内においては、病院を建築することができる。（→ 誤り）"},
{c:"hou",lv:2,a:true,fig:"youto",
 q:"建物の敷地が2つの用途地域にまたがる場合、敷地の広いほう（過半）が属する用途地域のルールが、敷地全体にかかる。",
 exp:`<p>敷地が2つの用途地域にまたがっているとき、どちらの<b>用途制限</b>（建てられる建物の種類）に従うかの問題です。</p><p>答えは、<mark>敷地の過半（半分より多く）が属する地域のルール</mark>を、敷地全体に当てはめます。</p><p>ちなみに、<b>建ぺい率・容積率</b>は、それぞれの地域の部分ごとに計算して合計する（加重平均）、とルールが違います。</p>`,
 pt:"用途制限は過半の地域で決める。建ぺい率・容積率は加重平均",
 hon:"建築物の敷地が2以上の用途地域にわたる場合においては、その建築物又はその敷地の全部について、敷地の過半の属する地域の用途制限に関する規定を適用する。"},
{c:"hou",lv:2,a:true,fig:"kenpei",
 q:"特定行政庁が指定する角地にある敷地は、建ぺい率が10%ゆるくなる（たとえば60%なら70%になる）。",
 exp:`<p>角地は2方向が道路に面しているので、日当たりや風通しがよく、火事も広がりにくい場所です。</p><p>そこで、<mark>特定行政庁が指定する角地なら、建ぺい率に10%を加えられます</mark>。</p><p>また、<b>防火地域内の耐火建築物</b>なども、建ぺい率に10%を加えられます。両方を満たせば、合わせて20%増えます。</p>`,
 pt:"建ぺい率＋10%：特定行政庁指定の角地／防火地域内の耐火建築物等",
 hon:"街区の角にある敷地又はこれに準ずる敷地で特定行政庁が指定するものの内にある建築物については、建ぺい率の限度に10分の1を加えたものとする。"},
{c:"hou",lv:3,a:true,fig:"kenpei",
 q:"建ぺい率が80%の地域で、防火地域の中に耐火建築物を建てる場合、建ぺい率の制限はなくなる（100%まで建てられる）。",
 exp:`<p>建ぺい率は、火事が広がるのを防ぐ目的もあります。</p><p>もともと80%という高い建ぺい率が認められている地域（商業地域など）で、さらに<b>防火地域</b>の中に、火に強い<b>耐火建築物</b>を建てるなら、火事の心配がかなり小さくなります。</p><p>そこで<mark>この場合は、建ぺい率の制限が適用されません</mark>（敷地いっぱいに建てられる）。</p>`,
 pt:"建ぺい率80%地域＋防火地域内の耐火建築物等 → 建ぺい率制限なし",
 hon:"建ぺい率の限度が10分の8とされている地域内で、かつ、防火地域内にある耐火建築物等については、建ぺい率の制限は適用されない。"},
{c:"hou",lv:3,a:true,fig:"kenpei",
 q:"前の道路の幅が12m未満のときは、住居系の地域では「道路の幅（m）× 0.4」と、決められた容積率のうち、小さいほうがその敷地の容積率になる。",
 exp:`<p>細い道路に面した土地に大きな建物を建てると、道路が混雑したり、日当たりが悪くなったりします。</p><p>そこで<mark>前面道路の幅が12m未満なら、道路の幅で容積率がおさえられます</mark>。</p><p>・<b>住居系</b>の用途地域 → 道路の幅 × <b>4/10</b><br>・<b>それ以外</b> → 道路の幅 × <b>6/10</b></p><p>たとえば、住居系で道路の幅が4m、決められた容積率が200%なら、4×0.4＝160% と 200% の小さいほう → <b>160%</b>です。</p>`,
 pt:"前面道路12m未満：住居系は幅×4/10、その他は幅×6/10と比べて小さいほう",
 hon:"前面道路の幅員が12m未満である建築物の容積率は、当該前面道路の幅員のメートルの数値に、住居系の用途地域にあっては10分の4を乗じたもの以下でなければならない。"},
{c:"hou",lv:3,a:true,fig:"dorosha",
 q:"幅4m未満の古い道で、特定行政庁が指定したもの（2項道路）は、道の中心線から2m下がった線が、道路と敷地の境目とみなされる。",
 exp:`<p>昔からある幅の狭い道も、建築基準法ができる前から建物が並んでいれば、<b>道路</b>として扱われることがあります。これを<b>2項道路</b>といいます。</p><p>ただし、将来は道を4mに広げたいので、<mark>道の中心線から2m下がった線を、道路の境界線とみなします</mark>。</p><p>下がった部分（セットバック部分）には建物を建てられず、<b>敷地面積にも入りません</b>。</p>`,
 pt:"2項道路：中心線から2m後退した線が道路境界（後退部分は敷地面積に不算入）",
 hon:"建築基準法第42条第2項の規定により道路とみなされる道は、原則としてその中心線からの水平距離2mの線をその道路の境界線とみなす。"},
{c:"hou",lv:2,a:false,fig:"dorosha",
 q:"道路の上の空いているところなら、自分の家の門や塀を自由に建ててもよい。",
 exp:`<p>道路は、人や車が通り、火事のときに消防車が入るための大切な場所です。</p><p>だから<mark>建物や門・塀などは、原則として道路の中や道路の上に突き出して建てられません</mark>。</p><p>例外は、地下の建物、公衆便所や巡査派出所など特定行政庁が許可したもの、アーケードなどです。</p>`,
 pt:"道路内には原則として建築物（門・塀を含む）を建てられない",
 hon:"建築物又は敷地を造成するための擁壁は、道路内に、又は道路に突き出して建築し、又は築造してはならない。"},
{c:"hou",lv:3,a:true,
 q:"商業地域、工業地域、工業専用地域では、日影規制（日かげ規制）の対象区域を定めることができない。",
 exp:`<p><b>日影規制</b>は、高い建物が周りの家に長い時間、日かげを作らないようにするルールです。</p><p>住宅地では大切ですが、<mark>商業地域・工業地域・工業専用地域</mark>は、もともと大きな建物が集まる所なので、対象にできません。</p><p>「お店と工場の地域は日かげを気にしない」と覚えましょう。</p>`,
 pt:"日影規制の対象外：商業地域・工業地域・工業専用地域",
 hon:"日影による中高層の建築物の高さの制限の対象区域は、商業地域、工業地域及び工業専用地域以外の地域のうち地方公共団体の条例で指定する区域とする。"},
{c:"hou",lv:3,a:true,
 q:"防火地域の中で、3階建て以上、または延べ面積が100㎡をこえる建物は、耐火建築物など（火にとても強い建物）にしなければならない。",
 exp:`<p><b>防火地域</b>は、駅前や大通りぞいなど、建物がぎっしり並ぶ所に指定されます。火事が起きると大きな被害になるので、建物の作りに厳しいルールがあります。</p><p><mark>防火地域では「3階以上」または「延べ面積100㎡超」の建物は、耐火建築物等</mark>にします。それより小さい建物も、準耐火建築物等にする必要があります。</p><p>防火地域より少しゆるい<b>準防火地域</b>もあります。</p>`,
 pt:"防火地域：3階以上 or 100㎡超 → 耐火建築物等",
 hon:"防火地域内においては、階数が3以上であり、又は延べ面積が100㎡を超える建築物は、耐火建築物等としなければならない。"},
{c:"hou",lv:3,a:true,
 q:"2025年4月から、木造2階建ての住宅を新しく建てるときは、都市計画区域の内か外かに関係なく、建築確認が必要になった。",
 exp:`<p>建築確認がいるかどうかは、場所と建物の大きさで決まります。</p><p>・<b>都市計画区域・準都市計画区域の中</b> → 新築なら大きさに関係なく必要<br>・<b>区域の外</b> → 一定の大きさ以上の建物だけ必要</p><p>2025年4月の改正で、区域の外でも<mark>2階建て以上、または延べ面積200㎡をこえる建物</mark>は、建築確認が必要になりました。だから木造2階建ての家は、どこでも必要です。</p>`,
 pt:"2025年4月〜：2階以上または200㎡超の建物は全国で建築確認が必要",
 hon:"木造2階建ての住宅を新築する場合、都市計画区域外であっても、建築確認を受ける必要がある。"},
{c:"hou",lv:2,a:false,
 q:"都市計画区域の中でも、小さな平屋の家を新築するときは、建築確認はいらない。",
 exp:`<p><mark>都市計画区域・準都市計画区域の中では、新築なら大きさに関係なく建築確認が必要</mark>です。小さな平屋でも同じです。</p><p>確認がいらないのは、<b>防火地域・準防火地域の外</b>で、<b>10㎡以内</b>の増築・改築・移転をする場合などに限られます。新築は、10㎡以内でも必要です。</p>`,
 pt:"都市計画区域内の新築は規模を問わず建築確認が必要",
 hon:"都市計画区域内において、延べ面積が50㎡の平家建ての住宅を新築する場合、建築確認を受ける必要はない。（→ 誤り）"},
{c:"hou",lv:3,a:true,
 q:"宅地造成等工事規制区域の中で、盛土をして高さ1mをこえる崖ができる工事をするには、原則として都道府県知事の許可が必要である。",
 exp:`<p>盛土（土を盛ること）や切土（土を削ること）がいいかげんだと、大雨で崩れて大きな災害になります（2021年の熱海の土石流がきっかけで法律が強化されました）。</p><p><b>盛土規制法</b>では、<b>宅地造成等工事規制区域</b>の中で、次のような工事に<mark>知事の許可</mark>が必要です。</p><p>・盛土で高さ<b>1m超</b>の崖ができる<br>・切土で高さ<b>2m超</b>の崖ができる<br>・崖ができなくても、盛土の高さが<b>2m超</b><br>・工事の面積が<b>500㎡超</b></p>`,
 pt:"盛土1m超の崖／切土2m超の崖／盛土2m超／500㎡超 → 知事の許可",
 hon:"宅地造成等工事規制区域内において、盛土であって当該盛土をした土地の部分に高さが1mを超える崖を生ずることとなるものに関する工事を行う場合、原則として都道府県知事の許可を受けなければならない。"},
{c:"hou",lv:3,a:true,fig:"kanchi",
 q:"土地区画整理事業で仮換地が指定されると、もとの土地の持ち主は、もとの土地を使えなくなり、代わりに仮換地を使えるようになる。",
 exp:`<p><b>土地区画整理事業</b>は、ばらばらの土地を整理し直して、道路や公園のある街に作りかえる事業です。工事の間、持ち主は一時的に別の土地を使います。この一時的な土地が<b>仮換地（かりかんち）</b>です。</p><p>仮換地が指定されると、<mark>もとの土地（従前の宅地）は使えなくなり、仮換地を使えます</mark>。</p><p>ただし、<b>持ち主であることは変わりません</b>。もとの土地を売ったり、抵当権をつけたりはできます。</p>`,
 pt:"仮換地指定後：使うのは仮換地、売買・登記などはもとの土地で",
 hon:"仮換地が指定された場合においては、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができるものとし、従前の宅地については、使用し、又は収益することができない。",
 w:[["換地","かんち","区画整理のあとに、もとの土地の代わりにもらう土地"]]},
{c:"hou",lv:3,a:true,fig:"kanchi",
 q:"土地区画整理事業の換地処分が公告されると、その翌日から、新しい土地（換地）がもとの土地とみなされる。",
 exp:`<p>工事が終わると、<b>換地処分</b>という最後の手続きをし、それを公告します。</p><p>公告があった<mark>日の翌日</mark>から、<b>換地がもとの土地とみなされ</b>、正式に新しい土地の持ち主になります。</p><p>工事が始まってから換地処分の公告までは、区域内で建物を建てたりするには<b>知事等の許可</b>が必要です（76条許可）。</p>`,
 pt:"換地処分の公告の翌日から、換地が従前の宅地とみなされる",
 hon:"換地計画において定められた換地は、換地処分の公告があった日の翌日から、従前の宅地とみなされる。"},
{c:"hou",lv:2,a:true,fig:"nouchi",
 q:"親から農地を相続した場合、農地法3条の許可はいらないが、農業委員会への届出が必要である。",
 exp:`<p>相続は、本人の意思とは関係なく起こるものなので、<mark>農地法3条の許可はいりません</mark>。</p><p>でも、だれが農地を持っているか把握するため、<mark>農業委員会への届出</mark>が必要です（遅滞なく）。</p><p>同じように、遺産分割で農地をもらった場合も、許可は不要です。</p>`,
 pt:"相続による農地の取得 → 3条許可不要、農業委員会へ届出",
 hon:"相続により農地を取得する場合は、農地法第3条第1項の許可を受ける必要はないが、遅滞なく、農業委員会にその旨を届け出なければならない。"},
{c:"hou",lv:3,a:true,fig:"nouchi",
 q:"農地に抵当権をつけるだけなら、農地法の許可はいらない。",
 exp:`<p>農地法3条や5条の許可が必要なのは、農地を<b>使う人が変わる</b>ときです（売る・貸す・地上権をつけるなど）。</p><p><mark>抵当権</mark>は、お金を借りるときの担保で、農地はそのまま持ち主が使い続けます。だから<b>許可はいりません</b>。</p><p>ただし、競売で農地が売られるときは、買う人について許可が必要です。</p>`,
 pt:"抵当権の設定は使う人が変わらないので許可不要",
 hon:"農地に抵当権を設定する場合、農地法第3条第1項の許可を受ける必要はない。"},
{c:"hou",lv:2,a:false,fig:"nouchi",
 q:"市街化調整区域の農地を宅地にするときも、あらかじめ農業委員会に届け出れば、許可はいらない。",
 exp:`<p>「届出だけでOK」という特例は、<mark>市街化区域だけ</mark>のものです。</p><p>市街化調整区域は「街になるのをおさえる所」なので、農地を宅地にする（転用する）には、ふつうどおり<b>4条・5条の許可</b>が必要です。</p>`,
 pt:"届出で足りる特例は市街化区域内のみ",
 hon:"市街化調整区域内にある農地を、あらかじめ農業委員会に届け出て転用する場合には、農地法第4条第1項の許可を受ける必要がない。（→ 誤り）"},
{c:"hou",lv:3,a:true,fig:"nouchi",
 q:"農地法3条や5条の許可が必要なのに、許可を受けずに農地を売る契約をしても、その契約は効力がない。",
 exp:`<p>許可を受けないまま売買しても、<mark>所有権は移らず、契約は効力を生じません</mark>。</p><p>さらに、無断で転用した場合は、工事の中止や元に戻すことを命じられたり、罰則を受けたりすることもあります。</p>`,
 pt:"許可のない3条・5条の権利移動は効力を生じない",
 hon:"農地法第3条第1項又は第5条第1項の許可を受けないでした行為は、その効力を生じない。"},
{c:"hou",lv:2,a:true,fig:"nouchi",
 q:"登記簿では「山林」となっていても、実際に田んぼとして使っている土地は、農地法の「農地」にあたる。",
 exp:`<p>農地かどうかは、登記簿の地目ではなく、<mark>今、実際にどう使っているか（現況）</mark>で決まります。</p><p>反対に、登記簿では「田」となっていても、何十年も前から駐車場になっているなら、農地ではありません。</p><p>また、家庭菜園のような一時的なものは農地にあたりません。</p>`,
 pt:"農地かどうかは現況で判断（登記簿の地目は関係ない）",
 hon:"農地法上の農地に該当するかどうかは、その土地の現況によって判断され、登記簿上の地目によって判断されるものではない。"},
{c:"hou",lv:3,a:false,fig:"kokudo",
 q:"国土利用計画法の事後届出が必要なのに届け出なかった場合、その土地の売買契約は無効になる。",
 exp:`<p>事後届出は、土地の取引を<b>あとから見守る</b>しくみです。</p><p>届け出なかったら<b>罰則</b>（6か月以下の拘禁刑または100万円以下の罰金）はありますが、<mark>契約そのものは有効</mark>です。</p><p>また、届出を受けた知事は、<b>土地の利用目的</b>について勧告ができますが、<b>値段</b>については勧告できません。</p>`,
 pt:"届出をしなくても契約は有効（罰則はある）",
 hon:"事後届出が必要な土地売買等の契約を締結したにもかかわらず、所定の期間内に事後届出をしなかった場合、当該契約は無効となる。（→ 誤り）"},
{c:"hou",lv:3,a:false,fig:"kokudo",
 q:"事後届出を受けた都道府県知事は、土地の値段が高すぎると思ったら、値段を下げるよう勧告できる。",
 exp:`<p>事後届出は、契約したあとの届出なので、値段はもう決まっています。</p><p>そのため、知事が勧告できるのは<mark>土地の利用目的</mark>についてだけです。<b>値段（対価の額）について勧告はできません</b>。</p><p>勧告は、届出があった日から<b>3週間以内</b>に行います。</p>`,
 pt:"事後届出の勧告は「利用目的」だけ（価格は対象外）",
 hon:"都道府県知事は、事後届出に係る土地の利用目的に従った土地利用が土地利用基本計画等に適合せず、周辺の地域の適正かつ合理的な土地利用を図るために著しい支障があると認めるときは、土地利用審査会の意見を聴いて、その利用目的について必要な変更をすべきことを勧告することができる。"},
{c:"hou",lv:3,a:true,fig:"kokudo",
 q:"市街化区域で、1人の人が、となり合う1,500㎡と1,000㎡の土地を、計画的にそれぞれ別の持ち主から買った場合、事後届出が必要である。",
 exp:`<p>1つ1つは2,000㎡より小さくても、<b>まとめて使う目的で</b>買い集めると、大きな土地の取引と同じことになります。これを<b>一団の土地</b>といいます。</p><p>事後届出では、<mark>買う側（権利取得者）が合計した広さ</mark>で判断します。1,500＋1,000＝2,500㎡なので、届出が必要です。</p><p>反対に、売る側が2,500㎡を2人に分けて売り、1人が1,000㎡ずつしか買わないなら、届出はいりません。</p>`,
 pt:"事後届出は「買う側」の合計面積で判断（一団の土地）",
 hon:"市街化区域内において、Aが、一団の土地である甲土地（1,500㎡）と乙土地（1,000㎡）を別々の者から順次購入した場合、Aはそれぞれの契約について事後届出を行う必要がある。"},
{c:"hou",lv:2,a:true,fig:"kokudo",
 q:"市街化区域にある3,000㎡の土地を相続した場合は、国土利用計画法の事後届出はいらない。",
 exp:`<p>事後届出がいるのは、<b>お金などを払って（対価を得て）</b>、<b>契約によって</b>土地の権利が移る場合です。</p><p><mark>相続</mark>は契約ではないので、届出はいりません。<b>贈与</b>（タダであげる）も、お金を払っていないので不要です。</p><p>また、当事者の一方が<b>国や地方公共団体</b>の場合も不要です。</p>`,
 pt:"相続・贈与・国等が当事者 → 事後届出は不要",
 hon:"相続により市街化区域内の3,000㎡の土地を取得した者は、事後届出を行う必要はない。"}
);

Q.push(
{c:"zei",lv:2,a:true,
 q:"固定資産税の標準税率は1.4%である。",
 exp:`<p>固定資産税は、<b>課税標準（固定資産税評価額など）× 税率</b>で計算します。</p><p>標準税率は<mark>1.4%</mark>です。「標準」なので、市町村は条例でこれと違う税率にすることもできます。</p><p>納める時期は、原則として<b>4月・7月・12月・2月</b>の年4回（市町村の条例で変えられる）です。</p>`,
 pt:"固定資産税の標準税率は1.4%",
 hon:"固定資産税の標準税率は、100分の1.4である。"},
{c:"zei",lv:3,a:false,
 q:"人が住むための家が建っている土地（住宅用地）は、広さに関係なく、固定資産税の課税標準が6分の1になる。",
 exp:`<p>住宅用地の特例は、広さで2段階に分かれます。</p><p>・<b>200㎡以下</b>の部分（小規模住宅用地）→ <mark>6分の1</mark><br>・<b>200㎡をこえる</b>部分 → <mark>3分の1</mark>（建物の床面積の10倍まで）</p><p>だから「広さに関係なく6分の1」は×です。</p>`,
 pt:"住宅用地：200㎡以下は1/6、200㎡超の部分は1/3",
 hon:"住宅用地のうち、小規模住宅用地以外の部分に対して課する固定資産税の課税標準は、価格の3分の1の額とされる。"},
{c:"zei",lv:3,a:true,
 q:"新築の住宅は、一定の条件を満たすと、固定資産税が3年間（一定のマンションなどは5年間）、半分に減額される。",
 exp:`<p>家を建てたばかりの人を応援するため、<b>新築住宅の固定資産税の減額</b>があります。</p><p>床面積120㎡までの部分について、<mark>税額が2分の1</mark>になります。期間は<b>3年間</b>、3階建て以上の耐火・準耐火のマンションなどは<b>5年間</b>です。</p><p>※この特例は期限つきで延長されているもので、受験する年度の最新の情報を確認しましょう。</p>`,
 pt:"新築住宅：120㎡までの部分の税額が1/2（3年間、中高層耐火は5年間）",
 hon:"一定の要件を満たす新築住宅に対して課する固定資産税は、新たに課されることとなった年度から3年度分に限り、120㎡までの部分に相当する税額の2分の1が減額される。"},
{c:"zei",lv:3,a:true,
 q:"同じ市町村にある、ある人の土地の課税標準の合計が30万円未満なら、土地の固定資産税はかからない（免税点）。",
 exp:`<p>税額が小さすぎる場合は、手間のほうが大きいので、税金をかけません。これを<b>免税点</b>といいます。</p><p>固定資産税の免税点は、同じ市町村内で同じ人が持つものの課税標準の合計で、</p><p>・<b>土地</b> → <mark>30万円</mark><br>・<b>家屋</b> → <mark>20万円</mark><br>・<b>償却資産</b> → 150万円</p><p>です。これ未満なら課税されません。</p>`,
 pt:"固定資産税の免税点：土地30万円・家屋20万円",
 hon:"市町村は、同一の者について当該市町村の区域内におけるその者の所有に係る土地に対して課する固定資産税の課税標準となるべき額が30万円に満たない場合には、固定資産税を課することができない。"},
{c:"zei",lv:3,a:false,
 q:"不動産取得税の標準税率は、どんな建物を手に入れたときでも一律3%である。",
 exp:`<p>不動産取得税の標準税率は<mark>4%</mark>です。</p><p>ただし特例で、<b>土地</b>と<b>住宅</b>を手に入れたときは<mark>3%</mark>になります。お店や事務所などの<b>住宅以外の建物</b>は4%のままです。</p><p>「土地と住宅は3%、それ以外の建物は4%」と覚えましょう。（特例は期限つきで延長が続いています）</p>`,
 pt:"不動産取得税：本則4%。土地・住宅は特例3%、住宅以外の家屋は4%",
 hon:"不動産取得税の標準税率は100分の4であるが、土地及び住宅の取得については、特例により100分の3とされている。"},
{c:"zei",lv:3,a:true,
 q:"新築の住宅（床面積50㎡以上240㎡以下）を手に入れたときは、不動産取得税の課税標準から1,200万円を差し引ける。",
 exp:`<p>家を手に入れた人の負担を軽くするため、不動産取得税には<b>控除</b>があります。</p><p>一定の<b>新築住宅</b>なら、課税標準から<mark>1,200万円</mark>を差し引けます。床面積は<b>50㎡以上240㎡以下</b>（一戸建て以外の貸家は40㎡以上）が条件です。</p><p>たとえば評価額1,000万円の新築住宅なら、1,000－1,200 → 0円で、税金はかかりません。</p>`,
 pt:"新築住宅の不動産取得税：課税標準から1,200万円控除（50〜240㎡）",
 hon:"一定の要件を満たす新築住宅を取得した場合における住宅の取得に対して課する不動産取得税の課税標準の算定については、一戸につき1,200万円を価格から控除する。"},
{c:"zei",lv:3,a:true,
 q:"宅地を手に入れたときの不動産取得税は、課税標準を2分の1にして計算する特例がある。",
 exp:`<p>宅地（宅地と評価された土地）を手に入れたときは、<mark>課税標準を価格の2分の1</mark>にする特例があります。</p><p>固定資産税の住宅用地の特例（1/6・1/3）と混同しないようにしましょう。不動産取得税の宅地の特例は「<b>1/2</b>」です。</p><p>（この特例も期限つきで延長が続いています）</p>`,
 pt:"宅地の取得：不動産取得税の課税標準は1/2",
 hon:"宅地評価土地を取得した場合における当該土地の取得に対して課する不動産取得税の課税標準は、当該土地の価格の2分の1の額とされる。"},
{c:"zei",lv:3,a:true,
 q:"土地を手に入れたときの課税標準が10万円未満なら、不動産取得税はかからない。",
 exp:`<p>不動産取得税にも<b>免税点</b>があります。</p><p>・<b>土地</b> → <mark>10万円</mark><br>・<b>家屋（建築による取得）</b> → <mark>23万円</mark>（1戸につき）<br>・<b>家屋（売買などそれ以外の取得）</b> → <mark>12万円</mark></p><p>これ未満なら課税されません。固定資産税の免税点（土地30万円・家屋20万円）とちがうので注意しましょう。</p>`,
 pt:"不動産取得税の免税点：土地10万円・家屋(建築)23万円・家屋(その他)12万円",
 hon:"不動産取得税は、土地の取得にあっては課税標準となるべき額が10万円に満たない場合においては、課することができない。"},
{c:"zei",lv:3,a:true,
 q:"国や地方公共団体が作った契約書には、印紙税はかからない。",
 exp:`<p>国や地方公共団体は、印紙税を納める側にならない（<b>非課税</b>）ことになっています。</p><p>国・地方公共団体とふつうの会社が契約書を2通作って1通ずつ持つ場合、</p><p>・<b>会社が持つ</b>ほう（国などが作成したとみなす）→ <mark>非課税</mark><br>・<b>国などが持つ</b>ほう（会社が作成したとみなす）→ <mark>課税</mark></p><p>という少しややこしいルールがあります。</p>`,
 pt:"国・地方公共団体が作成した文書は非課税（会社が保存する分）",
 hon:"国、地方公共団体が作成した文書には、印紙税は課されない。"},
{c:"zei",lv:3,a:true,
 q:"土地の交換契約書に、交換する土地それぞれの値段が書いてある場合、高いほうの金額が印紙税の「記載金額」になる。",
 exp:`<p>印紙税は、契約書に書いてある金額（<b>記載金額</b>）によって税額が決まります。</p><p>交換契約書の場合は、<br>・両方の値段が書いてある → <mark>高いほう</mark><br>・差額だけ書いてある → <b>差額</b><br>が記載金額になります。</p><p>ちなみに<b>贈与契約書</b>は、お金のやりとりがないので「記載金額のない契約書」として200円です。</p>`,
 pt:"交換契約書の記載金額：双方の価額があれば高いほう、差額のみなら差額",
 hon:"土地の交換契約書において、交換対象物の双方の価額が記載されているときはいずれか高いほうの金額を、交換差金のみが記載されているときは当該交換差金を、それぞれ記載金額とする。"},
{c:"zei",lv:3,a:false,
 q:"建物を貸す契約書（建物の賃貸借契約書）には、印紙税がかかる。",
 exp:`<p>不動産の契約書でも、印紙税がかかるものとかからないものがあります。</p><p>・<b>土地</b>の賃貸借契約書（土地賃借権の設定）→ <mark>かかる</mark><br>・<b>建物</b>の賃貸借契約書 → <mark>かからない</mark></p><p>土地を借りる契約は、権利金などの大きなお金が動くことが多いため、課税の対象になっています。</p>`,
 pt:"土地の賃貸借契約書は課税、建物の賃貸借契約書は非課税",
 hon:"建物の賃貸借契約書は、印紙税の課税文書に該当する。（→ 誤り）"},
{c:"zei",lv:3,a:true,
 q:"印紙税がかかる契約書に収入印紙をはらなかった場合、本来の税額とその2倍（合わせて3倍）の過怠税をとられることがある。",
 exp:`<p>印紙をはらなくても、<b>契約そのものは有効</b>です。</p><p>でも、税金をちゃんと納めていないので、罰として<mark>本来の税額の3倍（本来の額＋2倍）の過怠税</mark>がかかります。</p><p>自分から「はり忘れていました」と申し出た場合は、<b>1.1倍</b>に軽くなります。</p>`,
 pt:"印紙のはり忘れ：過怠税は3倍（自主申出なら1.1倍）。契約は有効",
 hon:"印紙税の課税文書の作成者が、納付すべき印紙税を課税文書の作成の時までに納付しなかった場合には、当該納付しなかった印紙税の額とその2倍に相当する金額との合計額に相当する過怠税が徴収される。"},
{c:"zei",lv:3,a:true,
 q:"住む家（床面積50㎡以上）を買って、買ってから1年以内に所有権移転の登記をすれば、登録免許税の税率が軽くなる特例を受けられる。",
 exp:`<p>登録免許税にも、住宅を買った人を応援する<b>軽減税率</b>の特例があります。</p><p>主な条件は、<br>・自分が<b>住むための家</b>であること<br>・床面積が<mark>50㎡以上</mark><br>・取得後<mark>1年以内</mark>に登記すること<br>などです。売買による所有権移転登記の税率は、原則2%が<b>0.3%</b>に下がります。</p><p>この特例は、<b>売買</b>や<b>競売</b>で取得した場合が対象で、<b>贈与や相続</b>は対象外です。</p>`,
 pt:"住宅用家屋の軽減：自己居住・50㎡以上・取得後1年以内に登記",
 hon:"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置は、当該家屋の床面積が50㎡以上であり、その取得後1年以内に登記を受けるものに限り適用される。"},
{c:"zei",lv:2,a:true,
 q:"自分が住んでいる家を売ってもうけ（譲渡所得）が出たとき、一定の条件を満たせば、もうけから最高3,000万円を差し引ける。",
 exp:`<p>家を売ってもうけが出ると、<b>所得税・住民税</b>がかかります。</p><p>でも、住んでいた家を売るのは、引っ越しや住みかえのためのことが多いですよね。そこで<mark>居住用財産を売ったときは、もうけから最高3,000万円を控除</mark>できます。</p><p>所有期間の長さは問いません。ただし、配偶者や親子など特別な関係の人に売った場合は使えません。また、前の年や前々年にこの特例を使っていると使えません。</p>`,
 pt:"居住用財産の譲渡：3,000万円特別控除（所有期間は問わない）",
 hon:"個人が居住用財産を譲渡した場合、一定の要件の下で、譲渡所得の金額から最高3,000万円を控除できる。"},
{c:"zei",lv:3,a:false,
 q:"土地を売ったときの所得が「長期譲渡所得」になるかどうかは、売った日に、持っていた期間が5年をこえているかで決まる。",
 exp:`<p>土地・建物を売ったもうけは、持っていた期間で税率が変わります。</p><p>・<b>長期譲渡所得</b>（税率が低い）→ 所有期間<b>5年超</b><br>・<b>短期譲渡所得</b>（税率が高い）→ 5年以下</p><p>ただし、5年をこえるかどうかは、売った日ではなく<mark>売った年の1月1日</mark>の時点で判断します。ここがひっかけです。</p>`,
 pt:"長期・短期は「譲渡した年の1月1日」に所有期間5年超かで判断",
 hon:"土地等の譲渡所得が長期譲渡所得に該当するかどうかは、譲渡した年の1月1日において所有期間が5年を超えるかどうかで判定する。"},
{c:"zei",lv:2,a:true,
 q:"新築の家として広告できるのは、建てられてから1年未満で、まだだれも住んだことがない（使われたことがない）建物だけである。",
 exp:`<p>不動産の広告で使う言葉には、きちんとした決まりがあります。</p><p><b>新築</b>とは、<mark>建築工事完了後1年未満</mark>で、かつ<mark>使用されたことがない</mark>ものです。</p><p>1年以内でも一度人が住んだら、新築とは言えません。また、だれも住んでいなくても1年をこえたら新築ではありません。</p>`,
 pt:"新築 ＝ 完成後1年未満 かつ 未使用",
 hon:"新築とは、建築工事完了後1年未満であって、居住の用に供されたことがないものをいう。"},
{c:"zei",lv:2,a:true,
 q:"不動産の広告で部屋の広さを「〇畳」と書くときは、1畳あたり1.62㎡以上として計算しなければならない。",
 exp:`<p>畳の大きさは、地域や建物によってちがいます。小さな畳で「6畳」と言われると、実際よりせまいことになってしまいます。</p><p>そこで広告では、<mark>1畳 ＝ 1.62㎡以上</mark>として計算する決まりがあります。</p><p>徒歩の「80mで1分」と並んで、広告ルールの代表的な数字です。</p>`,
 pt:"広告の畳数は1畳＝1.62㎡以上で換算",
 hon:"住宅の居室等の広さを畳数で表示する場合においては、畳1枚当たりの広さは1.62㎡以上の広さがあるという意味で用いること。"},
{c:"zei",lv:2,a:true,
 q:"実際には売るつもりのない物件や、もう売れてしまった物件を広告にのせて、お客さんを呼びこむこと（おとり広告）は禁止されている。",
 exp:`<p>「こんなに安い物件があります」と広告して、来たお客さんに「それはもう売れました。代わりにこちらは…」と別の物件をすすめる。これが<b>おとり広告</b>です。</p><p>お客さんをだますことになるので、<mark>景品表示法でも宅建業法でも禁止</mark>されています。</p><p>実際には存在しない物件の広告も同じく禁止です。</p>`,
 pt:"おとり広告（取引する意思のない・できない物件の広告）は禁止",
 hon:"物件は存在するが、実際には取引の対象となり得ない物件に関する表示をしてはならない。"},
{c:"zei",lv:3,a:true,
 q:"地価公示では、標準地の値段を、2人以上の不動産鑑定士に鑑定してもらって決める。その土地に建物があっても、建物がないもの（更地）として評価する。",
 exp:`<p>地価公示の流れは次のとおりです。</p><p>① 土地鑑定委員会が<b>標準地</b>を選ぶ<br>② <mark>2人以上の不動産鑑定士</mark>が鑑定評価をする<br>③ 土地鑑定委員会がその結果を審査・調整して<b>正常な価格</b>を判定し、公示する</p><p>正常な価格は、<mark>建物などがあっても、それがないもの（更地）として</mark>計算します。土地そのものの値段を知るためです。</p>`,
 pt:"地価公示：2人以上の不動産鑑定士、建物があっても更地として評価",
 hon:"土地鑑定委員会は、標準地について、2人以上の不動産鑑定士の鑑定評価を求めるものとし、当該標準地に建物その他の定着物がある場合には、これらが存しないものとして正常な価格を判定する。"},
{c:"zei",lv:2,a:true,
 q:"不動産の鑑定評価の方法には、原価法・取引事例比較法・収益還元法の3つの基本的な方法がある。",
 exp:`<p>不動産の値段を決める基本的な方法は3つです。</p><p>・<b>原価法</b>：いま同じものを作ったらいくらかかるか（再調達原価）から、古くなった分を引く<br>・<b>取引事例比較法</b>：近くで似た物件がいくらで売れたかと比べる<br>・<b>収益還元法</b>：その物件がこれからいくら<b>稼げるか</b>から計算する</p><p>鑑定士は、<mark>これらを組み合わせて</mark>値段を決めます。</p>`,
 pt:"鑑定評価の3手法：原価法・取引事例比較法・収益還元法",
 hon:"不動産の価格を求める鑑定評価の基本的な手法は、原価法、取引事例比較法及び収益還元法に大別される。"},
{c:"zei",lv:3,a:false,
 q:"収益還元法は、人に貸して家賃をもらっている物件にしか使えず、自分で住んでいる家には使えない。",
 exp:`<p>収益還元法は、物件が<b>生み出すお金</b>から値段を計算する方法です。</p><p>自分で住んでいる家でも、「もし人に貸したら、いくら家賃がとれるか」を考えれば計算できます。だから<mark>自分で使っている不動産にも適用できます</mark>。</p><p>文化財など、市場で取引されない特別なものを除き、基本的に使える方法です。</p>`,
 pt:"収益還元法は自用の不動産にも適用できる",
 hon:"収益還元法は、賃貸用不動産又は賃貸以外の事業の用に供する不動産の価格を求める場合に特に有効であるが、自用の不動産にも賃貸を想定することにより適用されるものである。"},
{c:"zei",lv:3,a:true,
 q:"住宅金融支援機構は、災害で家を失った人が家を建て直すためのお金を、直接貸すことができる。",
 exp:`<p>住宅金融支援機構の中心の仕事は<b>証券化支援</b>（銀行のローンの買い取りなど）でしたね。</p><p>でも、民間の銀行だけでは貸しにくい、特別な場合には<mark>直接お金を貸す（直接融資）</mark>こともあります。</p><p>代表例は、<b>災害復興</b>のための建て直し、<b>子どもを育てる家庭や高齢者向けの賃貸住宅</b>の建設、<b>マンションの共用部分の改良</b>などです。</p>`,
 pt:"機構の直接融資：災害復興・子育て/高齢者向け賃貸・マンション共用部分改良など",
 hon:"独立行政法人住宅金融支援機構は、災害復興建築物の建設又は購入に必要な資金の貸付けを業務として行っている。"},
{c:"zei",lv:3,a:true,
 q:"住宅金融支援機構は、高齢者が自分の住む家をバリアフリーにする工事のお金を、亡くなったときにまとめて返すしくみで貸すことができる。",
 exp:`<p>高齢者は、毎月ローンを返すのが大変なことがあります。</p><p>そこで機構は、高齢者が自分の住む家の<b>バリアフリー工事</b>や<b>耐震改修工事</b>をするお金を、<mark>亡くなったときに一括して返す方法（死亡時一括償還）</mark>で貸すことができます。</p><p>生きている間は利息だけ払い、元金は亡くなった後に家を売るなどして返します。</p>`,
 pt:"高齢者向け：バリアフリー・耐震改修の貸付けは死亡時一括償還が可能",
 hon:"機構は、高齢者が自ら居住する住宅について行うバリアフリー工事又は耐震改修工事に係る貸付けについて、貸付金の償還を高齢者の死亡時に一括して行うという制度を設けている。"},
{c:"zei",lv:2,a:false,
 q:"昔、川が流れていた場所（旧河道）は、地盤がしっかりしているので、宅地に向いている。",
 exp:`<p><b>旧河道（きゅうかどう）</b>は、昔の川が流れていた跡の土地です。</p><p>砂や泥がたまってできた土地なので、<mark>地盤が弱く、水がたまりやすい</mark>です。地震のときに<b>液状化</b>しやすいこともあります。</p><p>だから、一般に<b>宅地には向いていません</b>。</p>`,
 pt:"旧河道は地盤が軟弱で宅地に不向き",
 hon:"旧河道は、地盤が堅固で、宅地として積極的に利用することが望ましい。（→ 誤り）"},
{c:"zei",lv:3,a:true,
 q:"川ぞいにある自然堤防は、まわりの低地より少し高く、砂などでできているので、比較的宅地に向いている。",
 exp:`<p><b>自然堤防</b>は、川があふれたときに運ばれた砂が、川ぞいに積もってできた<b>少し高い土地</b>です。</p><p>まわりの低地（後背湿地）よりも水はけがよいので、<mark>比較的宅地に向いています</mark>。昔から集落ができてきた場所です。</p><p>反対に、自然堤防の外側の<b>後背湿地</b>は、水はけが悪く、宅地には向きません。</p>`,
 pt:"自然堤防は比較的宅地向き。その背後の後背湿地は不向き",
 hon:"自然堤防は、主に砂や小礫からなり、排水性がよく地盤の支持力もあるため、宅地として良好な土地であることが多い。"},
{c:"zei",lv:2,a:true,
 q:"木材は、よく乾燥しているほど強い。",
 exp:`<p>木材にふくまれる水分の量を<b>含水率</b>といいます。</p><p>木材は、<mark>乾燥して含水率が低いほど、強度が高くなります</mark>。だから、建物には十分に乾燥させた木材を使います。</p><p>また、木材は湿気が多いと、腐ったりシロアリに食べられたりしやすくなります。</p>`,
 pt:"木材は乾燥しているほど強い",
 hon:"木材の強度は、含水率が小さい状態の方が大きくなる。"},
{c:"zei",lv:3,a:true,
 q:"鉄筋コンクリートでは、コンクリートがアルカリ性であるため、中の鉄筋がさびるのを防いでいる。",
 exp:`<p><b>鉄筋コンクリート</b>は、引っぱる力に強い鉄筋と、押す力に強いコンクリートを組み合わせたものです。</p><p>さらに、<mark>コンクリートはアルカリ性</mark>なので、中の鉄筋がさびにくくなります。時間がたってコンクリートが中性に近づく（<b>中性化</b>）と、鉄筋がさびやすくなります。</p><p>また、鉄筋とコンクリートは、熱による伸び縮みの割合がほぼ同じなので、うまく一体になります。</p>`,
 pt:"コンクリートのアルカリ性が鉄筋のさびを防ぐ（中性化に注意）",
 hon:"鉄筋コンクリート構造において、コンクリートはアルカリ性であるため、鉄筋の錆を防ぐ役割を果たしている。"},
{c:"zei",lv:3,a:false,
 q:"鉄骨でできた建物は、火に強いので、特に何もしなくても火事のときに安全である。",
 exp:`<p>鉄は燃えませんが、<mark>熱に弱く、高温になると急に強度が落ちます</mark>。火事のときに鉄骨が曲がって、建物がくずれるおそれがあります。</p><p>そのため、鉄骨造の建物では、鉄骨を<b>耐火被覆（たいかひふく）</b>という材料でおおって、熱から守ります。</p><p>鉄骨はさびにも弱いので、さび止めも必要です。</p>`,
 pt:"鉄骨は熱に弱い → 耐火被覆が必要",
 hon:"鉄骨構造は、不燃構造であり、耐火材料による耐火被覆がなくても耐火構造にすることができる。（→ 誤り）"}
);

/* ひっかけ（×が正解）の追加分 */
Q.push(
/* ---- 権利関係 ---- */
{c:"ken",lv:1,a:false,
 q:"今の法律では、20歳になるまでは未成年者である。",
 exp:`<p>2022年4月から、<mark>成年になる年齢は18歳</mark>に引き下げられました。</p><p>だから今は、<b>18歳未満</b>が未成年者です。古い本やネットの情報では「20歳」と書かれていることがあるので注意しましょう。</p>`,
 pt:"成年年齢は18歳（2022年4月〜）",
 hon:"年齢20歳をもって、成年とする。（→ 誤り）"},
{c:"ken",lv:2,a:false,fig:"sagi",
 q:"だまされて（詐欺）土地を売った人は、その土地を次に買った人が事情を知らなければ、その人に落ち度があっても、取消しを主張できない。",
 exp:`<p>詐欺の取消しから守られる第三者は、<mark>善意（知らない）かつ無過失（落ち度がない）</mark>の人だけです。</p><p>事情を知らなくても、<b>注意すれば気づけた（過失がある）</b>なら守られません。だまされた人は、その第三者に取消しを主張できます。</p><p>「善意だけでよい」のは虚偽表示のほう。詐欺は「善意＋無過失」です。</p>`,
 pt:"詐欺：第三者が保護されるのは「善意かつ無過失」のときだけ",
 hon:"詐欺による意思表示の取消しは、善意の第三者に対抗することができない（第三者の過失の有無を問わない）。（→ 誤り）"},
{c:"ken",lv:2,a:false,fig:"nijuu",
 q:"同じ土地が2人に売られた場合（二重譲渡）、先に土地の引渡しを受けて使い始めたほうが勝つ。",
 exp:`<p>土地や建物の二重譲渡で勝ち負けを決めるのは、<mark>登記</mark>です。引渡しや、契約の早い遅いではありません。</p><p>引渡しで守られるのは、<b>借家の借主</b>（借地借家法）の場合です。ここを混同しないようにしましょう。</p>`,
 pt:"不動産の二重譲渡は「登記」で決まる（引渡しではない）",
 hon:"不動産の二重譲渡においては、先に引渡しを受けた譲受人が、登記がなくても他方の譲受人に所有権を対抗することができる。（→ 誤り）"},
{c:"ken",lv:2,a:false,
 q:"他人の土地だと知りながら使っていた人は、何年使い続けても、その土地を時効で自分のものにすることはできない。",
 exp:`<p>他人のものだと<b>知っていた</b>（悪意）としても、取得時効はあります。期間が長くなるだけです。</p><p>・善意・無過失 → <b>10年</b><br>・悪意、または過失あり → <mark>20年</mark></p><p>どちらも「自分のものとして」「おだやかに・堂々と」占有していることが必要です。</p>`,
 pt:"悪意でも20年で取得時効が完成する",
 hon:"他人の物であることを知りながら所有の意思をもって平穏かつ公然に占有を継続した者は、時効によってその所有権を取得することはできない。（→ 誤り）"},
{c:"ken",lv:2,a:false,
 q:"借金を返してもらう権利は、返してもらえる時から3年間使わないと、時効で消える。",
 exp:`<p>お金を返してもらう権利（債権）の消滅時効は、</p><p>・権利を使えることを<b>知った時</b>から<mark>5年</mark><br>・権利を使える<b>時</b>から<mark>10年</mark></p><p>のどちらか早いほうです。「3年」は、不法行為の損害賠償（知った時から）の期間と混ざったひっかけです。</p>`,
 pt:"債権の消滅時効は5年／10年。3年は不法行為",
 hon:"債権は、権利を行使することができる時から3年間行使しないときは、時効によって消滅する。（→ 誤り）"},
{c:"ken",lv:2,a:false,fig:"shakuchi",
 q:"建物を建てるための借地契約で期間を50年と決めても、借地権の期間は30年になる。",
 exp:`<p>借地権は<b>最低30年</b>でした。30年より<b>短く</b>決めたときは30年になります。</p><p>でも、<mark>30年より長く決めるのは自由</mark>です。50年と決めたら、そのとおり50年になります。</p><p>借主にとって有利な約束は、そのまま認められるのです。</p>`,
 pt:"借地権：30年より短い定めは30年に。長い定めはそのまま有効",
 hon:"借地権の存続期間は30年とし、契約でこれより長い期間を定めたときであっても、その期間は30年とする。（→ 誤り）"},
{c:"ken",lv:2,a:false,fig:"souzoku",
 q:"夫が亡くなり、子どもはいなくて、妻と夫の親が相続する場合、妻の法定相続分は2分の1である。",
 exp:`<p>子どもがいないときは、次の順で相続人になります。</p><p>・配偶者＋<b>親（直系尊属）</b> → 配偶者 <mark>2/3</mark>、親 1/3<br>・配偶者＋<b>兄弟姉妹</b> → 配偶者 <mark>3/4</mark>、兄弟姉妹 1/4</p><p>配偶者の取り分は、相手が遠い関係になるほど増えていきます（1/2 → 2/3 → 3/4）。</p>`,
 pt:"配偶者＋親 ＝ 2/3：1/3",
 hon:"被相続人に子がなく、配偶者と父母が相続人となる場合、配偶者の法定相続分は2分の1である。（→ 誤り）"},
{c:"ken",lv:2,a:false,fig:"souzoku",
 q:"子どもも親もいない人が亡くなり、妻と夫の兄弟が相続する場合、妻の法定相続分は3分の2である。",
 exp:`<p>配偶者と<b>兄弟姉妹</b>が相続するときは、<mark>配偶者が3/4、兄弟姉妹が1/4</mark>です。</p><p>3分の2は、配偶者と<b>親</b>が相続するときの割合です。</p><p>覚え方：子と一緒なら<b>半分</b>、親と一緒なら<b>3分の2</b>、兄弟と一緒なら<b>4分の3</b>。</p>`,
 pt:"配偶者＋兄弟姉妹 ＝ 3/4：1/4",
 hon:"配偶者と兄弟姉妹が相続人となる場合、配偶者の法定相続分は3分の2である。（→ 誤り）"},
{c:"ken",lv:2,a:false,
 q:"親が生きているうちに、子は家庭裁判所に申し出て、前もって相続放棄をしておくことができる。",
 exp:`<p>相続放棄は、<mark>相続が始まった後（親が亡くなった後）</mark>でないとできません。</p><p>生きているうちに「放棄します」と約束しても、法律上の効果はありません。</p><p>一方、<b>遺留分の放棄</b>は、家庭裁判所の許可があれば、生きているうちにもできます。この2つの区別がよくねらわれます。</p>`,
 pt:"相続放棄は相続開始前はできない（遺留分の放棄は許可があればできる）",
 hon:"相続の開始前においても、家庭裁判所に申述して相続の放棄をすることができる。（→ 誤り）"},
{c:"ken",lv:3,a:false,
 q:"自分で手書きした遺言書の日付を「令和8年10月吉日」と書いても、その遺言は有効である。",
 exp:`<p>自筆証書遺言には、<b>日付</b>を書く必要があります。遺言が2つ以上あったとき、どちらが新しいかを判断するためです。</p><p>「吉日」では、何日に書いたのか特定できません。そのため裁判所は、<mark>「吉日」と書いた遺言は無効</mark>と判断しています。</p>`,
 pt:"自筆証書遺言の日付は特定が必要。「吉日」は無効",
 hon:"自筆証書遺言の日付として「令和○年○月吉日」と記載した遺言は、有効である。（→ 誤り）"},
{c:"ken",lv:3,a:false,fig:"dairi",
 q:"代理人が「本人のための契約です」と示さずに契約した場合でも、その契約の効果は常に本人に届く。",
 exp:`<p>代理人は、「Aさんの代理人として契約します」と示す必要があります。これを<b>顕名（けんめい）</b>といいます。</p><p>顕名がないと、相手は代理人自身との契約だと思いますよね。だから<mark>原則として、代理人自身が契約したことになります</mark>。</p><p>ただし、相手が<b>本人のための契約だと知っていた、または知ることができた</b>ときは、本人に効果が届きます。</p>`,
 pt:"顕名がない → 原則は代理人自身の契約（相手が知り、知り得たときは本人に）",
 hon:"代理人が本人のためにすることを示さないでした意思表示は、常に本人に対して直接にその効力を生ずる。（→ 誤り）"},
{c:"ken",lv:2,a:false,
 q:"しめし合わせたウソの契約（虚偽表示）は、事情を知らない第三者であっても、知らないことに落ち度がなければ守られない。",
 exp:`<p>虚偽表示の第三者が守られる条件は、<mark>善意（知らない）だけ</mark>です。落ち度（過失）があっても守られます。</p><p>ウソの契約をわざと作った本人たちの責任が、とても重いからです。</p><p>詐欺では「善意＋無過失」が必要だったので、ちがいに注意しましょう。</p>`,
 pt:"虚偽表示の第三者は「善意」だけで保護される",
 hon:"相手方と通じてした虚偽の意思表示の無効は、善意でかつ過失のない第三者に限り、対抗することができない。（→ 誤り）"},
{c:"ken",lv:3,a:false,
 q:"ふつうの借家契約で「大家さんはいつでも、理由がなくても解約できる」という特約をすれば、その特約は有効である。",
 exp:`<p>借地借家法は、借りている人を守るための法律です。</p><p>大家さんからの解約には、<b>正当事由</b>と<b>6か月前の申入れ</b>が必要でした。<mark>これより借主に不利な特約は無効</mark>です。</p><p>反対に、借主に有利な特約は有効です。</p>`,
 pt:"借地借家法の規定より借主に不利な特約は無効",
 hon:"建物の賃貸借において、賃貸人がいつでも正当の事由なく解約の申入れをすることができる旨の特約は、有効である。（→ 誤り）"},
{c:"ken",lv:3,a:false,
 q:"家賃を払えなくなった借主は、大家さんに「敷金から差し引いておいてください」と言って、支払いをすませたことにできる。",
 exp:`<p>敷金は、大家さんが<b>万一のために預かっているお金</b>です。</p><p>家賃が払われないとき、<b>大家さん</b>が「敷金から差し引く」と決めることはできます。でも<mark>借主のほうから「敷金から引いて」と言うことはできません</mark>。</p><p>それを許すと、部屋を出るときの修理代などのための敷金がなくなってしまうからです。</p>`,
 pt:"敷金を未払い家賃にあてると言えるのは貸主だけ（借主からは不可）",
 hon:"賃借人は、賃貸人に対し、敷金をその債務の弁済に充てることを請求することができる。（→ 誤り）"},
{c:"ken",lv:3,a:false,
 q:"マンションの区分所有者は、自分の部屋（専有部分）を持ったまま、共用部分の持分だけを他人に売ることができる。",
 exp:`<p>共用部分（廊下や階段など）の持分は、部屋（専有部分）と<mark>セットで動きます</mark>。</p><p>部屋を売れば共用部分の持分も一緒に移り、<b>持分だけを別に売ることは原則できません</b>。</p><p>敷地利用権と同じく、「部屋と切りはなせない」と覚えましょう。</p>`,
 pt:"共用部分の持分は専有部分と分離して処分できない",
 hon:"共有者は、その有する専有部分と分離して共用部分の持分を処分することができる。（→ 誤り）"},
/* ---- 法令上の制限 ---- */
{c:"hou",lv:1,a:false,fig:"toshi",
 q:"すべての都市計画区域は、必ず市街化区域と市街化調整区域に分けなければならない。",
 exp:`<p>市街化区域と市街化調整区域に分けること（<b>区域区分・線引き</b>）は、<mark>原則として「必要なときに定める」もの</mark>です。</p><p>分けていない都市計画区域を<b>非線引き都市計画区域</b>といいます。</p><p>ただし、三大都市圏の一部や大きな都市などでは、必ず線引きをします。</p>`,
 pt:"線引き（区域区分）は原則任意。非線引き都市計画区域もある",
 hon:"都市計画区域については、すべて区域区分を定めなければならない。（→ 誤り）"},
{c:"hou",lv:1,a:false,fig:"kenpei",
 q:"建ぺい率とは、建物の延べ面積（全部の階の合計）が敷地の何%かを表すものである。",
 exp:`<p>これは<b>容積率</b>の説明です。</p><p>・<b>建ぺい率</b> ＝ <mark>建築面積</mark>（上から見た建物の広さ）÷ 敷地面積<br>・<b>容積率</b> ＝ <mark>延べ面積</mark>（全部の階の合計）÷ 敷地面積</p><p>「建ぺい率は横の広がり、容積率は全体のボリューム」と覚えましょう。</p>`,
 pt:"建ぺい率＝建築面積÷敷地／容積率＝延べ面積÷敷地",
 hon:"建ぺい率とは、建築物の延べ面積の敷地面積に対する割合をいう。（→ 誤り）"},
{c:"hou",lv:2,a:false,fig:"kaihatsu",
 q:"市街化区域で800㎡の土地を開発するときは、開発許可が必要である。",
 exp:`<p>市街化区域で開発許可が必要なのは、原則として<mark>1,000㎡以上</mark>です。</p><p>800㎡なら、原則として<b>許可はいりません</b>。（三大都市圏の一部などで、条例で500㎡以上などに引き下げている場合は別です）</p>`,
 pt:"市街化区域は1,000㎡未満なら原則開発許可不要",
 hon:"市街化区域内において行う開発行為で、その規模が800㎡であるものは、原則として開発許可を受けなければならない。（→ 誤り）"},
{c:"hou",lv:2,a:false,fig:"kaihatsu",
 q:"線引きされていない都市計画区域（非線引き都市計画区域）で2,000㎡の土地を開発するときは、開発許可が必要である。",
 exp:`<p>非線引き都市計画区域で開発許可が必要なのは、<mark>3,000㎡以上</mark>です。2,000㎡なら許可はいりません。</p><p>表の数字をもう一度確認しましょう。<br>市街化区域 1,000㎡ ／ 調整区域 広さ問わず ／ 非線引き 3,000㎡ ／ 区域外 1ha</p>`,
 pt:"非線引き都市計画区域・準都市計画区域は3,000㎡以上で許可",
 hon:"区域区分が定められていない都市計画区域内において行う開発行為で、その規模が2,000㎡であるものは、開発許可を受けなければならない。（→ 誤り）"},
{c:"hou",lv:2,a:false,fig:"setsudo",
 q:"建物を建てる敷地は、幅3mの道路に3m接していれば、接道義務を満たしている。",
 exp:`<p>接道義務の「道路」は、原則として<mark>幅4m以上</mark>のものです。</p><p>幅3mの道は、特定行政庁が指定した<b>2項道路</b>でなければ、建築基準法の道路になりません。いくら長く接していても、条件を満たさないのです。</p><p>「4m以上の道路」に「2m以上接する」の2つがそろって、はじめてOKです。</p>`,
 pt:"接道義務：幅4m以上の道路に2m以上（どちらも必要）",
 hon:"建築物の敷地は、幅員3mの道に3m以上接していれば、接道義務を満たす。（→ 誤り）"},
{c:"hou",lv:2,a:false,fig:"nouchi",
 q:"農地を農地のまま売るときの農地法3条の許可は、都道府県知事が行う。",
 exp:`<p>3条（農地のまま売る・貸す）の許可は、<mark>農業委員会</mark>が行います。</p><p>4条・5条（転用する）の許可が<b>都道府県知事等</b>です。</p><p>「農地のままなら地元の農業委員会、宅地などに変えるなら知事」と覚えましょう。</p>`,
 pt:"3条は農業委員会、4条・5条は都道府県知事等",
 hon:"農地を農地のまま売買する場合の農地法第3条の許可権者は、都道府県知事である。（→ 誤り）"},
{c:"hou",lv:2,a:false,fig:"kokudo",
 q:"国土利用計画法の事後届出は、土地の売買契約をした日から1か月以内にすればよい。",
 exp:`<p>事後届出の期限は、<mark>契約した日から2週間以内</mark>です。</p><p>宅建の試験には「2週間」がたくさん出てきます。営業保証金の不足や保証協会の分担金なども2週間でした。</p>`,
 pt:"事後届出は契約締結日から2週間以内",
 hon:"事後届出は、土地売買等の契約を締結した日から起算して1月以内に行わなければならない。（→ 誤り）"},
{c:"hou",lv:2,a:false,fig:"kokudo",
 q:"市街化調整区域にある3,000㎡の土地を買った場合、国土利用計画法の事後届出が必要である。",
 exp:`<p>市街化調整区域は、市街化区域「以外」の都市計画区域なので、届出が必要なのは<mark>5,000㎡以上</mark>です。</p><p>3,000㎡なら届出はいりません。</p><p>「市街化区域だけ2,000㎡、ほかの都市計画区域は5,000㎡、区域外は10,000㎡」です。</p>`,
 pt:"市街化調整区域・非線引きは5,000㎡以上で事後届出",
 hon:"市街化調整区域内の3,000㎡の土地について売買契約を締結した場合、権利取得者は事後届出を行わなければならない。（→ 誤り）"},
{c:"hou",lv:3,a:false,
 q:"第一種低層住居専用地域では、建物の高さは原則15mまでに制限される。",
 exp:`<p>第一種・第二種低層住居専用地域と田園住居地域では、建物の高さが<mark>10mまたは12m</mark>（都市計画で決める）までに制限されます。これを<b>絶対高さ制限</b>といいます。</p><p>15mではありません。低い家の静かな街並みを守るためのルールです。</p>`,
 pt:"低層住居専用地域・田園住居地域の高さは10mか12mまで",
 hon:"第一種低層住居専用地域内においては、建築物の高さは、原則として15mを超えてはならない。（→ 誤り）"},
{c:"hou",lv:3,a:false,fig:"dorosha",
 q:"2項道路のセットバック部分（道路とみなされる部分）も、敷地面積に入れて建ぺい率や容積率を計算できる。",
 exp:`<p>セットバック部分は、法律上は<b>道路</b>として扱われます。</p><p>そのため、<mark>敷地面積には入れられません</mark>。その分、建ぺい率や容積率で計算できる建物の大きさは小さくなります。</p><p>古い家を買うとき、思ったより小さい家しか建てられない…ということがあるので、重要事項の説明でも大切なポイントです。</p>`,
 pt:"セットバック部分は敷地面積に算入しない",
 hon:"建築基準法第42条第2項の規定により道路の境界線とみなされる線と道との間の部分の敷地は、敷地面積に算入される。（→ 誤り）"},
{c:"hou",lv:3,a:false,fig:"kanchi",
 q:"土地区画整理事業で仮換地が指定されたら、もとの土地を売ることはできなくなる。",
 exp:`<p>仮換地が指定されると、もとの土地は<b>使えなく</b>なります。でも、<mark>持ち主であることは変わらない</mark>ので、もとの土地を売ったり、抵当権をつけたりできます。</p><p>買った人は、仮換地を使うことになります。登記も、もとの土地について行います。</p>`,
 pt:"仮換地指定後も、もとの土地の売買・抵当権設定はできる",
 hon:"仮換地の指定があった場合、従前の宅地の所有者は、当該従前の宅地を売却することができない。（→ 誤り）"},
/* ---- 税・その他 ---- */
{c:"zei",lv:1,a:false,fig:"zei",
 q:"不動産取得税は、国にはらう税金である。",
 exp:`<p>不動産取得税は<mark>都道府県</mark>の税金です。</p><p>国の税金は、<b>登録免許税</b>と<b>印紙税</b>。市町村の税金は<b>固定資産税</b>です。表でもう一度確認しましょう。</p>`,
 pt:"不動産取得税は都道府県の税",
 hon:"不動産取得税は、国税である。（→ 誤り）"},
{c:"zei",lv:2,a:false,
 q:"7月に家を売った場合、その年の固定資産税は、売った日から後の分は買主が市町村に納める義務を負う。",
 exp:`<p>固定資産税をはらう義務がある人は、<mark>1月1日時点の所有者</mark>です。年の途中で売っても、その年の分は<b>売主が全額</b>納める義務を負います。</p><p>実際の取引では、売主と買主が日割りで計算してお金をやりとり（清算）することが多いですが、それは当事者どうしの約束です。市町村に対する義務は売主にあります。</p>`,
 pt:"年の途中で売っても、その年度の納税義務者は1月1日の所有者",
 hon:"年度の途中において土地の売買があった場合、当該年度の固定資産税は、売主と買主がその所有の月数に応じて納付する義務を負う。（→ 誤り）"},
{c:"zei",lv:2,a:false,
 q:"固定資産税の免税点は、土地の課税標準の合計が10万円未満の場合である。",
 exp:`<p>固定資産税の免税点は、<mark>土地30万円・家屋20万円</mark>です。</p><p>「10万円」は、<b>不動産取得税</b>の土地の免税点です。</p><p>・固定資産税：土地<b>30万</b>／家屋<b>20万</b><br>・不動産取得税：土地<b>10万</b>／家屋（建築）<b>23万</b>・（その他）<b>12万</b></p>`,
 pt:"固定資産税の免税点は土地30万円（10万円は不動産取得税）",

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

}

      ${fig?`<figure class="fig" style="margin:0">${fig.html()}<figcaption class="cap">${fig.cap}</figcaption></figure>`:""}
      <div class="point">${q.pt}</div>
      ${q.goro?`<div class="goro"><span class="lbl">${q.goro.t}</span><span class="g">${q.goro.g}</span>${q.goro.n?`<br><small>${q.goro.n}</small>`:""}</div>`:""}
      <div class="hon"><span class="lbl">本番の試験では、こんな書き方で出ます</span>「${q.hon.replace(/（→ 誤り）$/,"")}」<br><b>→ ${/（→ 誤り）$/.test(q.hon)?"誤り":"正しい"}</b></div>
      ${q.w?`<div><h4>ことばメモ</h4><dl class="words">${q.w.map(w=>`<div><dt><ruby>${w[0]}<rt>${w[1]}</rt></ruby></dt><dd>${w[2]}</dd></div>`).join("")}</dl></div>`:""}
    </div>
    <div class="qnav"><button class="btn" data-act="next" id="nextBtn">${S.i+1<S.list.length?"次の問題へ":"結果を見る"}</button></div>
  </article>`;
  app.innerHTML=out;
}

function end(){
  const n=S.results.length,ok=S.results.filter(r=>r.ok).length;
  const miss=S.results.filter(r=>!r.ok);
  const rate=n?ok/n:0;
  const msg=ok===n?"全問正解！ この調子で次へ進みましょう。":rate>=.8?"合格ラインの力がついています。まちがえた所だけ、もう一度見ておきましょう。":rate>=.6?"あと少し。解説を読んでからやり直すと、ぐっと伸びます。":"だいじょうぶ。解説を読んで、もう一度チャレンジすれば必ず覚えられます。";
  let nextBtn="";
  if(S.from&&S.from.lv<3){const nl=S.from.lv+1;nextBtn=`<button class="btn${miss.length?" sub":""}" data-act="lv" data-c="${S.from.c}" data-lv="${nl}">次は「${LV[nl].name}」へ</button>`}
  app.innerHTML=header()+`<section class="end">
    <span class="qhead">${S.label} の結果</span>
    <div class="score">${ok}<small> / ${n}問</small></div>
    <p style="margin:0">${msg}</p>
    ${miss.length?`<div class="miss"><b style="font-size:14px">まちがえた問題</b>${miss.map(r=>{const q=Q.find(x=>x.id===r.id);return `<button data-act="one" data-id="${q.id}"><b>×</b>${q.q}</button>`}).join("")}</div>`:""}
    <div class="row">${miss.length?`<button class="btn" data-act="retry">まちがえた${miss.length}問をやり直す</button>`:""}${nextBtn}<button class="btn sub" data-act="home">ホームへ</button></div>
  </section>`;
}

function render(){S.view==="home"?home():S.view==="quiz"?quiz():end()}

function pick(v){
  if(S.picked!==null)return;
  const q=Q.find(x=>x.id===S.list[S.i]);S.picked=v;
  const ok=v===q.a;const r=store.res[q.id]||{n:0};
  store.res[q.id]={ok,n:r.n+1};S.results.push({id:q.id,ok});saveSes();save();
  render();
  const v2=document.querySelector(".verdict");if(v2)v2.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function next(){if(S.i+1<S.list.length){S.i++;S.picked=null;saveSes();render();window.scrollTo(0,0)}else{dropSes(S.key);S.view="end";render();window.scrollTo(0,0)}}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="home"){S.view="home";render();window.scrollTo(0,0)}
  else if(a==="lv"){const c=b.dataset.c,l=+b.dataset.lv;resumeOr(c+":"+l,()=>setOf(c,l).map(q=>q.id),FIELDS[c].name+"・"+LV[l].name,{c,lv:l})}
  else if(a==="mock"){resumeOr("mock",mock,"本番の配分で50問")}
  else if(a==="all"){resumeOr("all",()=>shuffle(Q.map(q=>q.id)),"全問シャッフル")}
  else if(a==="wrong"){if(validSes("wrong")||wrongIds().length)resumeOr("wrong",wrongIds,"まちがえた問題")}
  else if(a==="resume"){const k=b.dataset.k,v=store.ses[k];if(v)resumeOr(k,()=>v.list,v.label,v.from)}
  else if(a==="drop"){dropSes(b.dataset.k);render()}
  else if(a==="restart"){restart()}
  else if(a==="retry"){start(S.results.filter(r=>!r.ok).map(r=>r.id),"やり直し")}
  else if(a==="one"){start([b.dataset.id],"1問だけ")}
  else if(a==="pick"){pick(b.dataset.v==="1")}
  else if(a==="next"){next()}
  else if(a==="reset"){
    if(b.dataset.sure){store={res:{},ses:{}};save();render()}
    else{b.dataset.sure="1";b.textContent="本当に消す？（もう一度押す）"}
  }
});
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(S.picked===null){if(k==="o"||k==="1")pick(true);else if(k==="x"||k==="2")pick(false)}
  else if(k==="enter"||k==="n"||k===" "){if(document.activeElement&&document.activeElement.id!=="nextBtn"){e.preventDefault();next()}}
});
render();
</script>
