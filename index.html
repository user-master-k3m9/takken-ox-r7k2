 hon:"宅地建物取引業者は、宅地建物取引業者でない相手方に対して、契約が成立するまでの間に、営業保証金を供託した主たる事務所の最寄りの供託所及びその所在地について説明をするようにしなければならない。"},
{c:"gyo",lv:3,a:false,
 q:"供託所などの説明は、重要事項の説明と同じく、宅建士が書面を渡して行わなければならない。",
 exp:`<p>供託所などの説明は、<mark>宅建士がしなくてもよく、書面を渡す必要もありません</mark>（口頭でもOK）。</p><p>重要事項説明書に書いて一緒に説明する方法もよく使われますが、それは法律で決められたことではありません。</p>`,
 pt:"供託所等の説明は宅建士でなくてよく、書面も不要",
 hon:"供託所等に関する説明は、宅地建物取引士が、書面を交付して行わなければならない。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"住むための部屋を貸すときの重要事項の説明では、台所・浴室・トイレなどの設備がどうなっているかを説明しなければならない。",
 exp:`<p>重要事項の説明は、<b>売買</b>と<b>貸し借り</b>で、説明することが少しちがいます。</p><p>建物を<b>借りる</b>人にとっては、毎日使う<mark>台所・浴室・トイレなどの設備の状況</mark>がとても大事です。だから、建物の貸借では説明が必要です。</p><p>ほかにも、<b>契約の期間と更新</b>、<b>敷金などの精算の方法</b>、<b>用途などの使い方の制限</b>も、貸借で説明する事項です。</p>`,
 pt:"建物の貸借の重要事項：台所・浴室・便所などの設備の整備状況",
 hon:"建物の貸借の媒介を行う場合、台所、浴室、便所その他の当該建物の設備の整備の状況について、重要事項として説明しなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"部屋を貸すときの重要事項の説明では、契約が終わったときの敷金の精算のしかたを説明しなければならない。",
 exp:`<p>退去のときに「敷金がいくら返ってくるか」は、トラブルが多い所です。</p><p>そこで、貸借の重要事項として、<mark>敷金など、契約終了時に精算するお金の精算に関する事項</mark>を説明します。</p><p>ほかに、<b>契約期間と更新に関する事項</b>、<b>管理を委託している場合はその委託先</b>なども、貸借の説明事項です。</p>`,
 pt:"貸借の重要事項：敷金等の精算・契約期間と更新・管理の委託先",
 hon:"宅地又は建物の貸借の媒介を行う場合、敷金その他いかなる名義をもって授受されるかを問わず、契約終了時において精算することとされている金銭の精算に関する事項を説明しなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"マンションを売るときの重要事項の説明では、修繕積立金について、規約で決めた額と、すでに積み立てられている額を説明しなければならない。",
 exp:`<p>マンション（区分所有建物）の売買では、マンションならではの説明事項があります。</p><p>・<b>敷地</b>の権利の種類と内容<br>・<b>共用部分</b>に関する規約<br>・<b>専有部分の使い方の制限</b>（ペット禁止など）<br>・<mark>修繕積立金・管理費の額と、滞納があればその額</mark><br>・<b>管理の委託先</b>の名前と住所</p><p>修繕積立金がちゃんと積み立てられていないと、将来大きな負担になるので、大事な説明事項です。</p>`,
 pt:"マンション売買：修繕積立金・管理費（滞納額も）・管理委託先などを説明",
 hon:"区分所有建物の売買の媒介を行う場合、一棟の建物の計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられている額について説明しなければならない。"},
{c:"gyo",lv:2,a:false,
 q:"重要事項の説明は、必ず宅建業者の事務所で行わなければならない。",
 exp:`<p>重要事項の説明を<mark>どこでするかは決められていません</mark>。お客さんの自宅や喫茶店、オンラインでもかまいません。</p><p>決められているのは、「<b>契約が成立する前</b>に」「<b>宅建士</b>が」「<b>宅建士証を見せて</b>」「<b>書面を渡して</b>」説明する、ということです。</p>`,
 pt:"重要事項の説明をする場所に決まりはない",
 hon:"重要事項の説明は、宅地建物取引業者の事務所において行わなければならない。（→ 誤り）"},
{c:"gyo",lv:2,a:false,
 q:"重要事項の説明は、その事務所の専任の宅建士でなければすることができない。",
 exp:`<p>重要事項の説明は、<mark>宅建士であればよく、専任である必要はありません</mark>。パートで働く宅建士でも説明できます。</p><p>35条書面や37条書面への記名も、専任でない宅建士がしてかまいません。</p>`,
 pt:"説明・記名は宅建士なら誰でもよい（専任でなくてよい）",
 hon:"重要事項の説明は、専任の宅地建物取引士でなければ、行うことができない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"重要事項説明書に記名した宅建士と、37条書面に記名する宅建士は、別の人でもかまわない。",
 exp:`<p>35条書面と37条書面は、それぞれ<b>宅建士が記名</b>します。</p><p>でも、<mark>同じ宅建士である必要はありません</mark>。それぞれの書面に、どの宅建士が記名してもよいのです。</p><p>また、37条書面を<b>お客さんに渡す</b>のは、宅建士でない従業員でもかまいません。</p>`,
 pt:"35条と37条の記名は別の宅建士でもよい。37条書面の交付は宅建士でなくてよい",
 hon:"37条書面に記名する宅地建物取引士は、35条書面に記名した宅地建物取引士と同一の者である必要はない。"},
{c:"gyo",lv:3,a:false,
 q:"部屋の貸し借りの37条書面には、所有権の移転登記をする時期を必ず書かなければならない。",
 exp:`<p>貸し借りでは、持ち主は変わらないので、<mark>移転登記の時期は書く必要がありません</mark>。</p><p>貸借の37条書面に必ず書くのは、<br>・当事者の氏名・住所<br>・物件<br>・<b>借賃の額・支払いの時期と方法</b><br>・<b>引渡しの時期</b><br>です。</p><p>売買にしかない事項（移転登記の時期、契約不適合責任、税金の負担など）と区別しましょう。</p>`,
 pt:"貸借の37条書面に「移転登記の時期」は不要",
 hon:"宅地建物取引業者が建物の貸借の媒介をした場合、37条書面には、移転登記の申請の時期を記載しなければならない。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"東京都知事の免許を持つ業者が、新しく大阪府にも事務所を作るときは、国土交通大臣に免許換えの申請をしなければならない。",
 exp:`<p>事務所が1つの都道府県だけ → 知事、2つ以上の都道府県 → 大臣、でしたね。</p><p>事務所の場所が変わって、免許をくれる人が変わることになったら、<mark>新しく免許をくれる人に、直接「免許換え」の申請</mark>をします。</p><p>免許換えで新しくもらった免許の有効期間は、そこから新しく<b>5年</b>です。</p>`,
 pt:"免許権者が変わる → 新しい免許権者に直接、免許換えを申請（新たに5年）",
 hon:"甲県知事の免許を受けている宅地建物取引業者が、乙県内にも事務所を設置することとなった場合、国土交通大臣に免許換えの申請をしなければならない。"},
{c:"gyo",lv:2,a:false,
 q:"免許の申請中であれば、「免許申請中」と広告に書けば、宅建業の広告を出してもよい。",
 exp:`<p>免許をまだ受けていない人は、宅建業を営んではいけません。<mark>「免許申請中」と書いても、広告を出すことは禁止</mark>です。</p><p>免許がおりるかどうか分からないのに広告を出すと、お客さんが混乱するからです。</p>`,
 pt:"免許を受けるまでは、「申請中」と書いても広告できない",
 hon:"免許の申請中である者は、免許申請中である旨を表示すれば、宅地建物取引業を営む旨の広告をすることができる。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"個人の宅建業者が亡くなっても、相続人は、亡くなった人が結んでいた契約の取引を終わらせるために必要な範囲では、宅建業者とみなされる。",
 exp:`<p>業者が亡くなると免許は効力を失います。でも、途中の取引がそのままだと、お客さんが困ってしまいます。</p><p>そこで<mark>相続人は、亡くなった人がすでに結んでいた契約の取引を終わらせる範囲で、宅建業者とみなされます</mark>。</p><p>新しい契約を結ぶことはできません。会社が合併で消えたり、廃業したりした場合も同じ考え方です。</p>`,
 pt:"死亡・廃業などの後も、締結済みの取引を結了する範囲では宅建業者とみなされる",
 hon:"宅地建物取引業者が死亡した場合、その相続人は、当該宅地建物取引業者が締結した契約に基づく取引を結了する目的の範囲内においては、なお宅地建物取引業者とみなされる。"},
{c:"gyo",lv:3,a:true,
 q:"東京都知事の免許を持つ業者が大阪府で悪いことをした場合、大阪府知事も、その業者に業務停止を命じることができる。",
 exp:`<p>宅建業者への処分は、だれが出せるかが決まっています。</p><p>・<b>指示処分・業務停止処分</b> → 免許権者に加えて、<mark>悪いことをした場所の都道府県知事</mark>も出せる<br>・<b>免許取消処分</b> → <mark>免許権者だけ</mark>が出せる</p><p>免許を取り消せるのは、免許を出した人だけ、と覚えましょう。</p>`,
 pt:"指示・業務停止は業務地の知事もできる。免許取消は免許権者だけ",
 hon:"国土交通大臣又は都道府県知事は、その管轄区域内において業務を行う他の都道府県知事の免許を受けた宅地建物取引業者に対しても、業務の停止を命ずることができる。"},
{c:"gyo",lv:3,a:false,
 q:"大阪府知事は、大阪府で悪いことをした東京都知事免許の業者の免許を取り消すことができる。",
 exp:`<p>免許を取り消せるのは、<mark>その免許を出した免許権者だけ</mark>です。この例では東京都知事です。</p><p>大阪府知事ができるのは、<b>指示処分</b>と<b>業務停止処分</b>までです。</p>`,
 pt:"免許取消は免許権者だけ",
 hon:"都道府県知事は、その管轄区域内で業務を行う他の都道府県知事の免許を受けた宅地建物取引業者の免許を取り消すことができる。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"宅建業者に業務停止処分や免許取消処分をしたときは、処分をした国土交通大臣や知事は、そのことを公告しなければならない。",
 exp:`<p><b>業務停止処分</b>と<b>免許取消処分</b>は、多くのお客さんに関係する重い処分なので、<mark>公告</mark>（世の中に広く知らせること）をします。</p><p>一番軽い<b>指示処分</b>は、公告しません。</p>`,
 pt:"業務停止・免許取消は公告する。指示処分は公告しない",
 hon:"国土交通大臣又は都道府県知事は、宅地建物取引業者に対して業務の停止の処分又は免許の取消しの処分をしたときは、その旨を公告しなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"宅建業を営むことについて大人と同じことができると認められていない未成年者は、宅建士の登録を受けることができない。",
 exp:`<p>未成年者は、ふつうは宅建士の登録を受けられません。</p><p>ただし、親から<mark>宅建業の営業を許可されて、大人と同じように商売ができる未成年者</mark>なら、登録を受けられます。</p><p>試験は年齢に関係なく、だれでも受けられます。</p>`,
 pt:"宅建業の営業について成年者と同一の行為能力がない未成年者は登録不可",
 hon:"宅地建物取引業に係る営業に関し成年者と同一の行為能力を有しない未成年者は、宅地建物取引士の登録を受けることができない。"},
{c:"gyo",lv:3,a:false,
 q:"宅建士が引っ越して住所が変わったときは、30日以内に変更の登録を申請すればよい。",
 exp:`<p>宅建士の登録簿に書いてあること（氏名・住所・本籍・勤めている業者の名前や免許番号など）が変わったら、<mark>遅滞なく（すぐに）</mark>変更の登録を申請します。</p><p>「30日以内」は、<b>宅建業者</b>の変更の届出の期限です。宅建士は「遅滞なく」なので、ちがいに注意しましょう。</p><p>住所や氏名が変わったときは、宅建士証の<b>書換え</b>の申請も一緒にします。</p>`,
 pt:"宅建士の変更の登録は「遅滞なく」（業者の変更の届出は30日以内）",
 hon:"宅地建物取引士は、住所を変更したときは、30日以内に変更の登録を申請しなければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"宅建士証を新しくもらうときは、原則として、申請の前6か月以内に行われる都道府県知事指定の講習を受けなければならない。",
 exp:`<p>宅建士証の有効期間（5年）が切れる前に、新しい宅建士証をもらうときや、はじめてもらうときは、<mark>申請前6か月以内に行われる知事指定の講習（法定講習）</mark>を受けます。</p><p>ただし、<b>試験に合格してから1年以内</b>に宅建士証をもらう場合は、講習を受けなくてかまいません。</p>`,
 pt:"宅建士証の交付・更新：申請前6か月以内の法定講習（合格後1年以内は免除）",
 hon:"宅地建物取引士証の交付を受けようとする者は、登録をしている都道府県知事が指定する講習で交付の申請前6月以内に行われるものを受講しなければならない。ただし、試験に合格した日から1年以内に交付を受けようとする者等は、この限りでない。"},
{c:"gyo",lv:3,a:false,
 q:"事務禁止処分を受けている宅建士でも、登録の移転を申請することはできる。",
 exp:`<p>事務禁止処分を受けている間は、<mark>登録の移転はできません</mark>。</p><p>処分を受けている人が、別の都道府県に登録を移して処分から逃げることを防ぐためです。</p>`,
 pt:"事務禁止期間中は登録の移転ができない",
 hon:"事務禁止の処分を受け、その禁止の期間が満了していない宅地建物取引士は、登録の移転の申請をすることができる。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"契約を結ばない（申込みも受けない）案内所であっても、宅建業者は、その案内所に標識を掲げなければならない。",
 exp:`<p>案内所には、決まりがいろいろあります。</p><p>・<b>標識</b> → <mark>すべての案内所に必要</mark>（契約しない案内所も）<br>・<b>専任の宅建士</b> → 契約や申込みを受ける案内所だけ<br>・<b>案内所の届出</b> → 契約や申込みを受ける案内所だけ</p><p>標識は「ここはどの業者の案内所か」をお客さんに示すものなので、どこでも必要です。</p>`,
 pt:"標識はすべての案内所に必要。専任宅建士・届出は契約等を行う案内所のみ",
 hon:"宅地建物取引業者は、契約の締結又は申込みの受付を行わない案内所についても、標識を掲げなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"お店などに使う建物の貸し借りの媒介で、返ってこない権利金を受け取る場合は、その権利金を売買代金とみなして報酬を計算することもできる。",
 exp:`<p>貸し借りの報酬は、ふつうは家賃1か月分が上限です。</p><p>でも、<b>居住用以外</b>（お店や事務所）の貸し借りで、<b>返ってこない権利金</b>をやりとりする場合は、<mark>その権利金を売買代金だと考えて</mark>、売買の計算式で報酬を出すこともできます。</p><p><b>住むための建物</b>には、この方法は使えません。</p>`,
 pt:"居住用以外の貸借で返還されない権利金 → 売買代金とみなして計算してもよい",
 hon:"宅地又は居住用以外の建物の賃貸借で、権利金（返還されないもの）の授受があるものの媒介に関して受ける報酬の額は、当該権利金の額を売買に係る代金の額とみなして算出することができる。"},
{c:"gyo",lv:3,a:true,
 q:"建物の代金に消費税が含まれているときは、消費税を除いた金額をもとにして、報酬を計算する。",
 exp:`<p>報酬の計算のもとになる「代金」は、<mark>消費税を含まない金額</mark>です。</p><p>なお、<b>土地</b>の売買には、もともと消費税がかかりません。建物だけが消費税の対象です。</p><p>たとえば、土地2,000万円＋建物1,100万円（消費税込み）なら、建物は1,000万円として、合計3,000万円をもとに計算します。</p>`,
 pt:"報酬の計算は税抜の代金で。土地には消費税がかからない",
 hon:"宅地建物取引業者が受領する報酬の額の計算の基礎となる売買代金には、建物に係る消費税相当額を含まないものとする。"},
{c:"gyo",lv:3,a:true,
 q:"新築住宅を売った宅建業者は、毎年3月31日（基準日）ごとに、その日から3週間以内に、保証金や保険の状況を免許権者に届け出なければならない。",
 exp:`<p>住宅瑕疵担保履行法では、新築住宅を売った業者が、ちゃんと保証金を預けたり保険に入ったりしているかをチェックします。</p><p>業者は、<mark>基準日（毎年3月31日）から3週間以内</mark>に、その状況を免許権者に届け出ます。</p><p>届け出なかったら、基準日の翌日から<b>50日</b>たった後は、新しく新築住宅を売る契約ができなくなります。</p>`,
 pt:"資力確保措置の届出：基準日（3/31）から3週間以内。怠ると50日後から新規契約禁止",
 hon:"新築住宅を引き渡した宅地建物取引業者は、基準日ごとに、当該基準日から3週間以内に、住宅販売瑕疵担保保証金の供託及び住宅販売瑕疵担保責任保険契約の締結の状況について、免許権者に届け出なければならない。"},
{c:"gyo",lv:3,a:false,
 q:"住宅瑕疵担保履行法で保証金や保険が必要になるのは、新築住宅のすべての欠陥についてである。",
 exp:`<p>対象になるのは、新築住宅の<mark>「構造耐力上主要な部分」（柱・はり・基礎など）と「雨水の浸入を防止する部分」（屋根・外壁など）</mark>の欠陥です。</p><p>すべての欠陥ではありません。壁紙のはがれなどは対象外です。</p><p>責任を負う期間は、引渡しから<b>10年間</b>です。</p>`,
 pt:"対象は構造耐力上主要な部分と雨水の浸入を防止する部分（10年間）",
 hon:"住宅販売瑕疵担保保証金の供託等の対象となるのは、新築住宅のすべての瑕疵である。（→ 誤り）"},
{c:"gyo",lv:2,a:false,
 q:"建築確認を受ける前のマンションでも、貸し借りのなかだちなら、広告を出してよい。",
 exp:`<p>工事が完了する前の物件は、<b>建築確認などの許可が出るまで、広告を出してはいけません</b>。</p><p>この広告の制限は、<mark>売買だけでなく、貸し借りのなかだちにも適用</mark>されます。</p><p>一方、<b>契約</b>の制限（建築確認前は契約しない）は、売買・交換だけで、<b>貸し借りには適用されません</b>。広告と契約のちがいがよくねらわれます。</p>`,
 pt:"広告開始時期の制限は貸借にもある。契約締結時期の制限は貸借にはない",
 hon:"宅地建物取引業者は、建築確認を受ける前の建物について、貸借の媒介をする場合であれば、その広告をすることができる。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"建築確認を受ける前の建物でも、貸し借りの媒介なら、賃貸借の契約を結ばせることはできる。",
 exp:`<p>工事完了前の物件で、建築確認などを受ける前の<b>契約</b>が禁止されるのは、<mark>売買と交換だけ</mark>です。</p><p>貸し借りの契約は、禁止されていません。（ただし、広告はできません）</p>`,
 pt:"契約締結時期の制限は売買・交換だけ（貸借はOK）",
 hon:"宅地建物取引業者は、工事の完了前において、建築確認を受ける前の建物について、貸借の媒介により賃貸借契約を成立させることができる。"},
{c:"gyo",lv:2,a:true,
 q:"媒介を頼まれた家の値段について意見を言うときは、宅建業者は、その根拠を明らかにしなければならない。",
 exp:`<p>売りたい人に「この家なら3,000万円で売れますよ」と言うとき、その値段の<mark>根拠を示す</mark>必要があります。</p><p>根拠のない高い値段を言って、媒介の契約を取ろうとする業者がいるからです。</p><p>根拠の示し方は、<b>口頭でも書面でも</b>かまいません。根拠を示すのに料金をもらうことはできません。</p>`,
 pt:"価額に意見を述べるときは根拠を明らかに（口頭でも可、報酬は請求不可）",
 hon:"宅地建物取引業者は、媒介契約の目的物である宅地又は建物の価額について意見を述べるときは、その根拠を明らかにしなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"媒介契約を結んだ宅建業者は、その物件を買いたいという申込みがあったら、一般媒介でも、遅れずに依頼者に報告しなければならない。",
 exp:`<p>買いたいという<b>申込み</b>があったことは、売主にとって大事な情報です。</p><p>だから<mark>どの種類の媒介契約でも</mark>、申込みがあったら遅れずに依頼者に報告します。</p><p>また、レインズに登録したら、<b>登録を証明する書面</b>を遅れずに依頼者に渡します。</p>`,
 pt:"申込みがあったら、媒介の種類に関係なく遅滞なく報告",
 hon:"宅地建物取引業者は、媒介契約の目的物である宅地又は建物の売買又は交換の申込みがあったときは、遅滞なく、その旨を依頼者に報告しなければならない。"},
{c:"gyo",lv:3,a:false,
 q:"土地を交換する媒介をしたときの報酬は、交換する2つの土地のうち、安いほうの値段をもとに計算する。",
 exp:`<p>交換の媒介の報酬は、<mark>2つの物件のうち、高いほうの値段</mark>をもとに計算します。</p><p>たとえば、3,000万円の土地と2,800万円の土地を交換するなら、3,000万円をもとにします。</p>`,
 pt:"交換の報酬は高いほうの価額で計算",
 hon:"宅地の交換の媒介に関する報酬の額は、交換する宅地の価額のうちいずれか低いほうの価額をもとに計算する。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"宅建士は、宅建士としての信用や品位を傷つけるようなことをしてはいけない。",
 exp:`<p>宅建士には、仕事をするうえでの心がまえが法律で決まっています。</p><p>・お客さんの利益を守り、公正に仕事をする<br>・<mark>宅建士の信用や品位を傷つけることをしない</mark>（仕事以外の私生活でも）<br>・知識や能力を高めるように努める</p><p>私生活で大きな問題を起こすことも、信用を傷つける行為にあたることがあります。</p>`,
 pt:"信用失墜行為の禁止（業務外の行為も含む）",
 hon:"宅地建物取引士は、宅地建物取引士の信用又は品位を害するような行為をしてはならない。"}
);

/* 第5版：重要事項説明（35条）の項目 */
FIGS.j35={lead:"重要事項として説明すること（主なもの）は、売買と貸し借りで少しちがう",cap:"○＝説明する　×＝説明しなくてよい",
  html:()=>tblL(["説明すること","売買","建物の貸し借り"],[
    ["登記された権利（抵当権など）",Y,Y],["法令上の制限（建築の制限など）",Y,`<small>一部だけ</small>`],
    ["私道の負担",Y,N],["水道・電気・ガス・排水の設備",Y,Y],
    ["土砂災害警戒区域・津波災害警戒区域・造成宅地防災区域か",Y,Y],["水害ハザードマップでの位置",Y,Y],
    ["石綿の調査の記録があるときは、その内容",Y,Y],["耐震診断の結果（1981年5月31日以前に着工した建物）",Y,Y],
    ["代金・借賃以外のお金、解除、損害賠償の予定",Y,Y],["ローンのあっせんの内容",Y,N],
    ["住宅性能評価を受けた新築住宅であること",Y,N],["台所・浴室などの設備、契約期間と更新、敷金の精算",N,Y]],
    "どの項目も、調査を新しくする義務まではない（記録や結果があるときに、その内容を説明する）")};
Q.push(
{c:"gyo",lv:3,a:true,fig:"j35",
 q:"建物の貸し借りの媒介をするときは、私道の負担について、重要事項として説明しなくてよい。",
 exp:`<p><b>私道の負担</b>とは、敷地の一部が私道になっていて、その分を自由に使えないことです。</p><p>土地を買う人や借りる人には大事ですが、<mark>建物を借りる人には直接関係がない</mark>ので、建物の貸借では説明しなくてかまいません。</p><p>土地の貸借や、売買では説明が必要です。</p>`,
 pt:"私道負担は建物の貸借では説明不要",
 hon:"建物の貸借の媒介を行う場合、私道に関する負担に関する事項を説明する必要はない。"},
{c:"gyo",lv:2,a:true,fig:"j35",
 q:"重要事項の説明では、水道・電気・ガス・排水の設備がどうなっているか、整っていなければいつごろ整うかを説明しなければならない。",
 exp:`<p>水道や電気などがなければ、そこで生活できません。</p><p>そこで、<mark>飲用水・電気・ガスの供給と排水のための施設の整備の状況</mark>を説明します。まだ整っていなければ、<b>整備の見通し</b>と、<b>費用の負担</b>についても説明します。</p><p>これは売買でも貸借でも必要です。</p>`,
 pt:"飲用水・電気・ガス・排水の整備状況（未整備なら見通し・負担）は全取引で説明",
 hon:"飲用水、電気及びガスの供給並びに排水のための施設の整備の状況（これらの施設が整備されていない場合においては、その整備の見通し及びその整備についての特別の負担に関する事項）を説明しなければならない。"},
{c:"gyo",lv:2,a:true,fig:"j35",
 q:"物件が土砂災害警戒区域の中にあるときは、売買でも貸し借りでも、そのことを重要事項として説明しなければならない。",
 exp:`<p>災害の危険がある場所かどうかは、住む人の命に関わります。</p><p>そこで、<mark>土砂災害警戒区域・津波災害警戒区域・造成宅地防災区域</mark>の中にあるかどうかは、<b>売買でも貸借でも</b>説明します。</p><p>水害ハザードマップでの位置も同じです。</p>`,
 pt:"土砂災害・津波災害警戒区域、造成宅地防災区域は全取引で説明",
 hon:"宅地建物取引業者は、建物の貸借の媒介を行う場合、当該建物が土砂災害警戒区域内にあるときは、その旨を説明しなければならない。"},
{c:"gyo",lv:3,a:false,fig:"j35",
 q:"建物の売買の媒介では、石綿（アスベスト）が使われているかどうかの調査の記録がないとき、宅建業者は自分で調査をして、その結果を説明しなければならない。",
 exp:`<p>石綿については、<mark>調査の結果が記録されているときに、その内容を説明</mark>すればよいのです。</p><p>記録がないときに、<b>宅建業者が自分で調査をする義務はありません</b>。</p><p>耐震診断も同じで、診断をしていれば内容を説明しますが、業者が診断をする義務はありません。</p>`,
 pt:"石綿・耐震診断は「記録・結果があれば」説明。調査・診断の義務はない",
 hon:"建物の売買の媒介を行う場合、石綿の使用の有無の調査の結果が記録されていないときは、宅地建物取引業者は自ら石綿の使用の有無の調査を実施し、その結果を説明しなければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,fig:"j35",
 q:"1981年（昭和56年）6月1日以降に新築の工事を始めた建物については、耐震診断の結果を説明しなくてよい。",
 exp:`<p>1981年6月1日から、建物の耐震の基準が厳しくなりました（<b>新耐震基準</b>）。</p><p>そのため、耐震診断の説明が必要なのは、<mark>それより前（1981年5月31日以前）に工事を始めた古い建物</mark>だけです。</p><p>それも、耐震診断を受けている場合に、その内容を説明します。</p>`,
 pt:"耐震診断の説明は1981年5月31日以前着工の建物で、診断を受けているもの",
 hon:"昭和56年6月1日以降に新築の工事に着手した建物については、耐震診断の内容を説明する必要はない。"},
{c:"gyo",lv:3,a:false,fig:"j35",
 q:"部屋の貸し借りの媒介でも、宅建業者が家賃のローンをあっせんするなら、その内容を重要事項として説明しなければならない。",
 exp:`<p><b>ローンのあっせん</b>の内容と、ローンが組めなかったときの対応（契約をなかったことにできるかなど）は、<mark>売買・交換</mark>の重要事項です。</p><p>貸し借りの重要事項には入っていません。</p>`,
 pt:"ローンのあっせんの説明は売買・交換だけ",
 hon:"建物の貸借の媒介を行う場合、代金に関する金銭の貸借のあっせんの内容及び当該あっせんに係る金銭の貸借が成立しないときの措置について説明しなければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,fig:"j35",
 q:"重要事項の説明では、宅建業者が預かるお金（支払金・預り金）について、保全措置をとるかどうか、とるならその内容を説明しなければならない。",
 exp:`<p>手付金とは別に、業者がお客さんからお金を預かることがあります（<b>支払金・預り金</b>）。</p><p>そのお金について、<mark>保全措置を講じるかどうか、講じる場合はその概要</mark>を説明します。保全措置を講じる「義務」はありませんが、どうするかは説明しなければなりません。</p><p>なお、<b>50万円未満</b>のものなどは、ここでいう支払金・預り金にあたりません。</p>`,
 pt:"支払金・預り金：保全措置を講じるかどうか（講じるならその概要）を説明",
 hon:"支払金又は預り金を受領しようとする場合において、保全措置を講ずるかどうか、及びその措置を講ずる場合におけるその措置の概要を説明しなければならない。"},
{c:"gyo",lv:3,a:false,fig:"j35",
 q:"新築住宅の貸し借りの媒介では、住宅性能評価を受けた住宅であることを、重要事項として説明しなければならない。",
 exp:`<p>住宅性能評価（耐震性や省エネなどの評価）を受けた新築住宅であることは、<mark>建物の売買・交換</mark>のときの説明事項です。</p><p>貸し借りのときは、説明しなくてかまいません。</p>`,
 pt:"住宅性能評価の説明は新築住宅の売買・交換だけ",
 hon:"新築住宅の貸借の媒介を行う場合、当該建物が住宅性能評価を受けた新築住宅である旨を説明しなければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,fig:"j35",
 q:"更新のない定期建物賃貸借の媒介をするときは、そのことを重要事項として説明しなければならない。",
 exp:`<p>借りる人にとって、<b>更新があるかどうか</b>はとても大事です。</p><p>だから、<mark>定期建物賃貸借や定期借地権</mark>など、更新のない契約であるときは、その旨を重要事項として説明します。</p><p>（大家さんが借地借家法にもとづいて行う事前の説明とは別に、宅建業者が説明します）</p>`,
 pt:"定期借家・定期借地であることは貸借の重要事項",
 hon:"建物の貸借の媒介を行う場合、当該建物の賃貸借が定期建物賃貸借であるときは、その旨を説明しなければならない。"},
{c:"gyo",lv:3,a:true,fig:"j35",
 q:"売買の重要事項の説明では、契約不適合責任を果たすための保証保険などの措置をとるかどうか、とるならその内容を説明しなければならない。",
 exp:`<p>売主が契約不適合の責任を負うとき、ちゃんと直してもらえるように、<b>保証保険契約</b>などに入ることがあります。</p><p>重要事項の説明では、<mark>そうした措置を講じるかどうか、講じるならその概要</mark>を説明します。売買・交換の説明事項です。</p>`,
 pt:"契約不適合責任の履行に関する措置（保証保険等）の有無と概要を説明",
 hon:"宅地又は建物の売買の媒介を行う場合、当該宅地又は建物が種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任の履行に関し保証保険契約の締結その他の措置を講ずるかどうか、及びその措置を講ずる場合におけるその措置の概要を説明しなければならない。"}
);

/* 第5版：権利関係の範囲の補充 */
Q.push(
{c:"ken",lv:2,a:true,
 q:"重い認知症などで、自分のしていることが分からない状態（意思能力がない状態）で結んだ契約は、無効である。",
 exp:`<p>自分のしていることの意味が分からない状態を、<b>意思能力がない</b>といいます。</p><p>その状態で結んだ契約は、<mark>はじめから無効</mark>です。取り消す必要もありません。</p><p>成年被後見人などの「取り消せる」とのちがいに注意しましょう。</p>`,
 pt:"意思能力のない人がした契約は無効",
 hon:"法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は、無効とする。"},
{c:"ken",lv:2,a:true,
 q:"他人の土地を売る契約も、民法上は有効である。売主は、その土地を手に入れて買主に渡す義務を負う。",
 exp:`<p>他人のものを売る契約を<b>他人物売買</b>といいます。民法では、<mark>この契約も有効</mark>です。</p><p>売主は、持ち主からその土地を手に入れて、買主に渡さなければなりません。渡せなければ、契約違反（債務不履行）の責任を負います。</p><p>一方、<b>宅建業者が売主でふつうの人が買主</b>のときは、宅建業法の8種制限で原則禁止されていました。民法と宅建業法のちがいに注意しましょう。</p>`,
 pt:"他人物売買は民法上有効（売主に取得して移転する義務）",
 hon:"他人の権利を目的とする売買契約も有効であり、売主はその権利を取得して買主に移転する義務を負う。"},
{c:"ken",lv:3,a:false,
 q:"本人から頼まれた代理人（任意代理人）は、いつでも自由に、別の人を代理人（復代理人）に選ぶことができる。",
 exp:`<p>本人は、「この人なら」と信用して代理人を選んでいます。勝手に別の人にまかされたら困りますよね。</p><p>だから<b>任意代理人</b>が復代理人を選べるのは、<mark>本人の許しがあるとき</mark>か、<mark>やむを得ない事情があるとき</mark>だけです。</p><p>一方、親などの<b>法定代理人</b>は、自分の責任でいつでも復代理人を選べます。</p>`,
 pt:"任意代理人の復代理人選任は、本人の許諾かやむを得ない事由が必要",
 hon:"委任による代理人は、本人の許諾を得たとき、又はやむを得ない事由があるときでなければ、復代理人を選任することができない。"},
{c:"ken",lv:3,a:true,
 q:"同じ人が、売主と買主の両方の代理人になって契約すること（双方代理）は、原則として、代理権のない人がしたこと（無権代理）とみなされる。",
 exp:`<p>1人で売主と買主の両方の代理人になると、どちらか一方に有利にしてしまうおそれがあります。自分が相手方になる<b>自己契約</b>も同じです。</p><p>そこで、<mark>自己契約・双方代理は、原則として無権代理とみなされます</mark>。</p><p>ただし、<b>本人があらかじめ許した場合</b>や、登記の申請のように<b>決まったことを実行するだけの場合</b>は、例外としてOKです。</p>`,
 pt:"自己契約・双方代理は原則無権代理（本人の事前の許諾・債務の履行は例外）",
 hon:"同一の法律行為について、相手方の代理人として、又は当事者双方の代理人としてした行為は、債務の履行及び本人があらかじめ許諾した行為を除き、代理権を有しない者がした行為とみなす。"},
{c:"ken",lv:3,a:true,
 q:"本人が亡くなると、本人から頼まれていた代理人の代理権はなくなる。",
 exp:`<p>代理権がなくなる（消滅する）のは、主に次のときです。</p><p>・<b>本人</b>が<mark>死亡</mark>したとき<br>・<b>代理人</b>が<mark>死亡</mark>したとき、<mark>破産</mark>したとき、<mark>後見開始の審判</mark>を受けたとき</p><p>本人が<b>破産</b>したときは、頼まれた代理（任意代理）だけがなくなります。</p>`,
 pt:"代理権の消滅：本人の死亡／代理人の死亡・破産・後見開始",
 hon:"代理権は、本人の死亡によって消滅する。"},
{c:"ken",lv:3,a:true,
 q:"親が亡くなり兄弟2人で土地を相続したのに、兄が勝手に自分1人の名前で登記して他人に売った。弟は、登記がなくても、その他人に自分の持分（半分）を主張できる。",
 exp:`<p>兄の名義になっていても、兄が持っているのは<b>自分の持分（半分）だけ</b>です。弟の持分については、兄は何の権利もない人（無権利者）です。</p><p>何の権利もない人から買っても、その部分の権利は手に入りません。だから<mark>弟は、登記がなくても、自分の持分を主張できます</mark>。</p>`,
 pt:"共同相続人は、自分の法定相続分を登記なしで第三者に主張できる",
 hon:"共同相続人の一人が単独所有の登記をして第三者に譲渡した場合、他の共同相続人は、自己の法定相続分について、登記なくして当該第三者に対抗することができる。"},
{c:"ken",lv:3,a:true,
 q:"Aが土地を時効で手に入れたあとに、もとの持ち主BがCにその土地を売った場合、AとCのどちらが勝つかは、先に登記をしたほうで決まる。",
 exp:`<p>時効と第三者の問題も、<b>時効が完成した「前」か「後」か</b>で考え方が変わります。</p><p>・時効完成<b>前</b>にCが買った → Aは<b>登記なしでCに勝てる</b>（Cは当事者と同じ扱い）<br>・時効完成<b>後</b>にCが買った → <mark>登記を先にしたほうが勝ち</mark>（二重譲渡と同じ）</p><p>時効が完成した後なら、Aは登記ができたはず。だから登記で決めるのです。</p>`,
 pt:"時効完成「後」の第三者とは登記の先後。完成「前」の第三者には登記なしで勝てる",
 hon:"時効により不動産の所有権を取得した者は、時効完成後に当該不動産を譲り受けて登記をした第三者に対して、登記なくして所有権の取得を対抗することができない。"},
{c:"ken",lv:2,a:true,
 q:"1つの土地に2つの抵当権がついている場合、先に登記をした抵当権のほうが、先にお金を回収できる。",
 exp:`<p>1つの不動産に、いくつも抵当権をつけることができます。</p><p>そのとき、どの抵当権が先にお金を回収できるかは、<mark>登記をした順番</mark>で決まります。先に登記したほうを<b>1番抵当権</b>、次を<b>2番抵当権</b>と呼びます。</p><p>競売で得たお金は、1番抵当権の人から順番に受け取ります。</p>`,
 pt:"抵当権の順位は登記の前後で決まる",
 hon:"同一の不動産について数個の抵当権が設定されたときは、その抵当権の順位は、登記の前後による。"},
{c:"ken",lv:3,a:true,
 q:"抵当権のついた土地を買った人は、抵当権を持つ銀行に「この金額を払うから抵当権を消して」と請求できる（抵当権消滅請求）。",
 exp:`<p>抵当権のついた不動産を買った人（<b>第三取得者</b>）は、いつ競売にかけられるか分からず不安です。</p><p>そこで、<mark>自分で決めた金額を抵当権者に示して、抵当権を消すよう請求</mark>できます。これを<b>抵当権消滅請求</b>といいます。</p><p>抵当権者がそれを受け入れれば抵当権は消え、受け入れないなら、抵当権者は競売を申し立てます。なお、借りた本人（債務者）や保証人は、この請求はできません。</p>`,
 pt:"抵当権消滅請求ができるのは第三取得者（債務者・保証人は不可）",
 hon:"抵当不動産の第三取得者は、抵当権消滅請求をすることができる。"},
{c:"ken",lv:3,a:true,
 q:"根抵当権は、決めた上限の金額（極度額）までなら、何度も借りたり返したりするお金をまとめて担保できる。",
 exp:`<p>お店などは、銀行からくり返しお金を借りたり返したりします。そのたびに抵当権をつけ直すのは大変です。</p><p>そこで、<mark>極度額という上限を決めて、その範囲のお金をまとめて担保する</mark>のが<b>根抵当権</b>です。</p><p>ふつうの抵当権は、借金を全部返せば消えますが、根抵当権は、元本が確定するまでは、借金がゼロになっても消えません。</p>`,
 pt:"根抵当権：極度額の範囲で、不特定の債権をまとめて担保",
 hon:"根抵当権者は、確定した元本並びに利息その他の定期金及び債務の不履行によって生じた損害の賠償の全部について、極度額を限度として、その根抵当権を行使することができる。"},
{c:"ken",lv:3,a:false,
 q:"個人が、上限の金額を決めずに「この人のこれからの借金をすべて保証する」という契約（個人根保証）をしても、有効である。",
 exp:`<p>これからの借金を全部保証する<b>根保証</b>は、保証人がいくら払うことになるか分からない、とても危険な契約です。</p><p>そこで、個人が根保証をする場合は、<mark>上限の金額（極度額）を書面で決めなければ無効</mark>になります。</p><p>家を借りるときの連帯保証人も、多くはこの個人根保証にあたるので、極度額を決めます。</p>`,
 pt:"個人根保証は極度額を定めなければ無効",
 hon:"個人根保証契約は、極度額を定めなくても、その効力を生ずる。（→ 誤り）"},
{c:"ken",lv:2,a:true,
 q:"お金を借りた本人の借金がなくなれば、保証人の保証の義務もなくなる。",
 exp:`<p>保証は、本人（主たる債務者）の借金を支えるためのものです。</p><p>だから、<mark>本人の借金がなくなれば、保証もなくなります</mark>。これを<b>付従性（ふじゅうせい）</b>といいます。</p><p>反対に、保証人が払ったとき、保証人は本人に「代わりに払った分を返して」と言えます（<b>求償</b>）。</p>`,
 pt:"主たる債務が消えれば保証債務も消える（付従性）",
 hon:"主たる債務者の債務が弁済により消滅したときは、保証債務も消滅する。"},
{c:"ken",lv:2,a:true,
 q:"AとBが連帯して1,000万円を借りた（連帯債務）場合、貸した人は、Aだけに1,000万円全部を請求することができる。",
 exp:`<p><b>連帯債務</b>では、借りた人それぞれが、<mark>全額を払う義務</mark>を負います。</p><p>貸した人は、だれにでも、全額でも一部でも請求できます。ただし、全部で受け取れるのは1,000万円までです。</p><p>Aが全額払ったら、AはBに、Bの負担分を返してもらえます（求償）。</p>`,
 pt:"連帯債務：債権者は1人に全額を請求できる",
 hon:"債権者は、連帯債務者の一人に対し、又は同時に若しくは順次に全ての連帯債務者に対し、全部又は一部の履行を請求することができる。"},
{c:"ken",lv:3,a:false,
 q:"連帯債務者の1人に請求すれば、ほかの連帯債務者にも請求したことになる。",
 exp:`<p>連帯債務者の1人に起きたことは、原則として、<mark>ほかの人には影響しません</mark>（相対的効力）。請求も、1人にしただけでは、ほかの人には効きません。</p><p>例外として、ほかの人にも効くのは、<b>弁済</b>（払った）、<b>相殺</b>、<b>更改</b>、<b>混同</b>です。</p>`,
 pt:"連帯債務者の1人への請求は、原則ほかの人に効力なし",
 hon:"連帯債務者の一人に対する履行の請求は、他の連帯債務者に対しても、その効力を生ずる。（→ 誤り）"},
{c:"ken",lv:2,a:false,
 q:"お金を返してもらう権利（債権）を人にゆずったとき、ゆずり受けた人が借りている人に「私がゆずり受けました」と知らせれば、借りている人に主張できる。",
 exp:`<p>債権をゆずること（<b>債権譲渡</b>）を、借りている人（債務者）に主張するには、</p><p>・<mark>ゆずった人（譲渡人）からの通知</mark><br>・または、<mark>債務者の承諾</mark></p><p>が必要です。ゆずり受けた人が自分で知らせても、ウソかもしれないので、認められません。</p>`,
 pt:"債権譲渡の通知は「譲渡人」から（譲受人からの通知は不可）",
 hon:"債権の譲渡は、譲受人が債務者に通知をすれば、債務者に対抗することができる。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"同じ債権が2人にゆずられた場合、どちらが勝つかは、確定日付のある通知が借りている人に届いた順番で決まる。",
 exp:`<p>債権の二重譲渡では、日付をごまかせない<b>確定日付のある証書</b>（内容証明郵便など）による通知や承諾が必要です。</p><p>どちらも確定日付のある通知なら、<mark>通知が債務者に届いた（到達した）日時が早いほう</mark>が勝ちます。</p><p>通知に書いてある日付の早い遅いではありません。</p>`,
 pt:"債権の二重譲渡：確定日付ある通知の「到達」の先後で決まる",
 hon:"債権が二重に譲渡され、いずれも確定日付のある証書による通知がされた場合、譲受人相互間の優劣は、通知が債務者に到達した日時の先後によって決する。"},
{c:"ken",lv:3,a:true,
 q:"「この債権は人にゆずってはいけない」という約束（譲渡制限の特約）があっても、債権をゆずること自体は有効である。",
 exp:`<p>2020年の民法改正で、<mark>譲渡制限の特約があっても、債権の譲渡は有効</mark>とされました。</p><p>ただし、ゆずり受けた人がその特約を<b>知っていた、または重い過失で知らなかった</b>場合は、債務者は支払いを断れます。</p>`,
 pt:"譲渡制限特約があっても債権譲渡は有効",
 hon:"当事者が債権の譲渡を禁止し、又は制限する旨の意思表示をしたときであっても、債権の譲渡は、その効力を妨げられない。"},
{c:"ken",lv:3,a:true,
 q:"AとBがお互いにお金を返してもらう権利を持っているとき、一定の条件を満たせば、Aは「お互いの分を差し引きして終わりにする」と一方的に言える（相殺）。",
 exp:`<p>お互いにお金の貸し借りがあるとき、<mark>同じ額だけ差し引きしてなくす</mark>ことを<b>相殺（そうさい）</b>といいます。相手の同意はいりません。</p><p>条件は、①お互いに同じ種類の債権（お金とお金など）であること、②相殺する側の債権の<b>支払い期限が来ていること</b>などです。</p><p>ただし、<b>わざと人を傷つけて生じた賠償金</b>などを、加害者の側から相殺することはできません。</p>`,
 pt:"相殺：同種の債権・自働債権が弁済期。悪意の不法行為の加害者からは相殺不可",
 hon:"2人が互いに同種の目的を有する債務を負担する場合において、双方の債務が弁済期にあるときは、各債務者は、その対当額について相殺によってその債務を免れることができる。"},
{c:"ken",lv:3,a:true,
 q:"借りた本人以外の人（第三者）も、借金を代わりに返すことができる。ただし、返すことに正当な利益がない人は、本人が反対しているときは返せない。",
 exp:`<p>借金は、原則として<b>本人以外の人</b>が返してもかまいません（<b>第三者弁済</b>）。</p><p>ただし、<mark>正当な利益のない第三者（ただの友人など）は、本人の意思に反して返すことはできません</mark>。</p><p>抵当権のついた土地を買った人（物上保証人や第三取得者）など、返すことに正当な利益がある人は、本人が反対していても返せます。</p>`,
 pt:"正当な利益のない第三者は、債務者の意思に反して弁済できない",
 hon:"弁済をするについて正当な利益を有する者でない第三者は、債務者の意思に反して弁済をすることができない。"},
{c:"ken",lv:3,a:true,
 q:"預金通帳と印鑑を持ってきた人を本人だと信じ、そう信じたことに落ち度がなければ、本人でない人に払っても、その支払いは有効になる。",
 exp:`<p>本当は受け取る権利がないのに、権利がありそうに見える人を<b>受領権者としての外観を有する者</b>といいます。</p><p>その人に払った場合でも、<mark>払った人が善意・無過失なら、支払いは有効</mark>です。</p><p>払った人は、本当の権利者にもう一度払う必要はありません。</p>`,
 pt:"受領権者らしく見える者への弁済は、善意無過失なら有効",
 hon:"受領権者以外の者であって取引上の社会通念に照らして受領権者としての外観を有するものに対してした弁済は、その弁済をした者が善意であり、かつ、過失がなかったときに限り、その効力を有する。"},
{c:"ken",lv:3,a:true,
 q:"家の売買契約のあと、引渡しの前に、だれのせいでもない地震で家がこわれた場合、買主は代金の支払いを断ることができる。",
 exp:`<p>売主にも買主にも責任がない理由で、物件を引き渡せなくなった場合の問題を<b>危険負担</b>といいます。</p><p>この場合、<mark>買主は代金の支払いを拒むことができます</mark>。また、買主は契約を解除することもできます。</p><p>ただし、<b>引渡しを受けた後</b>に壊れた場合は、買主は代金を払わなければなりません。</p>`,
 pt:"引渡し前に双方の責任なく滅失 → 買主は代金の支払いを拒める",
 hon:"当事者双方の責めに帰することができない事由によって債務を履行することができなくなったときは、債権者は、反対給付の履行を拒むことができる。"},
{c:"ken",lv:3,a:true,
 q:"たのんで建ててもらった家（請負）に、契約と合わない欠陥があった場合、注文した人は、直してもらうことや、契約の解除を求めることができる。",
 exp:`<p>建物を建ててもらう契約を<b>請負（うけおい）</b>といいます。</p><p>完成した建物に<b>契約不適合</b>があったら、注文者は、売買と同じように、<mark>修補（直してもらう）・代金の減額・損害賠償・解除</mark>を求めることができます。</p><p>昔は「建物は解除できない」というルールがありましたが、今は建物でも解除できます。</p>`,
 pt:"請負の契約不適合：修補・減額・損害賠償・解除（建物でも解除可）",
 hon:"請負人が種類又は品質に関して契約の内容に適合しない仕事の目的物を注文者に引き渡したときは、注文者は、売買の規定を準用して、履行の追完の請求、報酬の減額の請求、損害賠償の請求及び契約の解除をすることができる。"},
{c:"ken",lv:3,a:false,
 q:"お金の支払いが遅れた場合でも、大地震などの防ぎようのない理由（不可抗力）なら、遅れた分の損害賠償を払わなくてよい。",
 exp:`<p>お金を払う義務（<b>金銭債務</b>）には、特別なルールがあります。</p><p><mark>不可抗力で遅れても、遅れた責任は免れません</mark>。お金は、どこかから用意できると考えられるからです。</p><p>また、貸した人は、損害があったことを証明しなくても、決まった利率の遅延損害金を請求できます。</p>`,
 pt:"金銭債務の遅れは、不可抗力でも免責されない",
 hon:"金銭の給付を目的とする債務の不履行については、債務者は、不可抗力をもって抗弁とすることができる。（→ 誤り）"},
{c:"ken",lv:3,a:false,
 q:"建物の賃貸借の期間は、最長でも20年までしか決められない。",
 exp:`<p>民法の賃貸借の期間の上限は、<mark>50年</mark>です（2020年の改正で20年から50年に延びました）。</p><p>なお、建物の賃貸借（借家）には借地借家法が適用され、民法の上限の規定は適用されません（借家は上限なし）。</p>`,
 pt:"民法の賃貸借の上限は50年（借家は上限なし）",
 hon:"賃貸借の存続期間は、20年を超えることができない。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"大家さんと借主が話し合って賃貸借をやめる（合意解除）場合、大家さんは、そのことを又借りしている人（転借人）に主張できない。",
 exp:`<p>大家さんの承諾を得て又貸し（転貸）していた場合、大家さんと借主が話し合って契約をやめても、<mark>転借人を追い出すことはできません</mark>。転借人は何も悪くないからです。</p><p>一方、借主が家賃を払わないなど<b>契約違反（債務不履行）</b>で解除した場合は、大家さんは転借人に出て行くよう主張できます。</p>`,
 pt:"合意解除は転借人に対抗できない。債務不履行解除は対抗できる",
 hon:"賃借人が適法に賃借物を転貸した場合には、賃貸人は、賃借人との間の賃貸借を合意により解除したことをもって転借人に対抗することができない。"},
{c:"ken",lv:3,a:true,
 q:"借地の上の建物を人に売るとき、地主が借地権をゆずることを認めてくれない場合、借地権者は、裁判所に地主の承諾の代わりになる許可を求めることができる。",
 exp:`<p>借地権を人にゆずるには、ふつうは<b>地主の承諾</b>が必要です。</p><p>でも、地主にとって困ることがないのに承諾してくれないと、建物を売れずに困ってしまいます。</p><p>そこで、<mark>裁判所が、地主の承諾の代わりに許可</mark>を出すことができます。</p>`,
 pt:"借地権の譲渡を地主が承諾しない → 裁判所の代諾許可",
 hon:"借地権者が賃借権の目的である土地の上の建物を第三者に譲渡しようとする場合において、借地権設定者に不利となるおそれがないにもかかわらず、借地権設定者が賃借権の譲渡を承諾しないときは、裁判所は、借地権者の申立てにより、借地権設定者の承諾に代わる許可を与えることができる。"},
{c:"ken",lv:3,a:true,
 q:"借地の上の建物が火事でなくなっても、決まったことを書いた看板を土地に立てておけば、2年間は、土地の新しい持ち主に借地権を主張できる。",
 exp:`<p>借地権は、土地の上の建物の登記で主張できるのでした。でも、建物が<b>なくなる（滅失）</b>と、登記も意味がなくなります。</p><p>そこで、<mark>建物を特定する事項や、新しく建てる予定などを、土地の見やすい場所に掲示</mark>すれば、建物がなくなってから<b>2年間</b>は、借地権を主張できます。</p>`,
 pt:"建物滅失後も、掲示をすれば2年間は借地権を対抗できる",
 hon:"借地上の建物の滅失があっても、借地権者が、その建物を特定するために必要な事項等を土地の上の見やすい場所に掲示するときは、借地権は、なお対抗力を有する。ただし、建物の滅失があった日から2年を経過した後は、その前に建物を新たに築造し、かつ、その建物につき登記した場合に限る。"},
{c:"ken",lv:3,a:true,
 q:"住むための定期建物賃貸借（床面積200㎡未満）で、借主が転勤などでどうしても住めなくなった場合、借主は途中で解約を申し入れることができ、1か月たつと契約は終わる。",
 exp:`<p>定期借家は、期間の途中でやめることが原則できません。</p><p>でも、<b>住むための建物</b>で、<b>床面積200㎡未満</b>なら、<mark>転勤・療養・親の介護など、やむを得ない事情</mark>があるとき、借主は途中で解約を申し入れられます。</p><p>申し入れから<b>1か月</b>たつと、契約は終わります。</p>`,
 pt:"居住用・200㎡未満の定期借家：やむを得ない事情で中途解約、1か月で終了",
 hon:"居住の用に供する建物の定期建物賃貸借（床面積200㎡未満）において、転勤、療養、親族の介護その他のやむを得ない事情により、建物の賃借人が建物を自己の生活の本拠として使用することが困難となったときは、建物の賃借人は、解約の申入れをすることができ、申入れの日から1月を経過することによって終了する。"},
{c:"ken",lv:3,a:true,
 q:"住むための建物を借りていた人が、相続人がいないまま亡くなった場合、一緒に住んでいた事実上の夫婦（内縁の妻など）は、そのまま借り続けることができる。",
 exp:`<p>籍を入れていない夫婦（内縁）は、相続人になりません。</p><p>でも、借主が亡くなったとたんに追い出されたら、住む所を失ってしまいます。</p><p>そこで、<mark>相続人がいない</mark>場合に限り、<b>同居していた事実上の夫婦や親子</b>が、借主の立場を引きつげます。</p>`,
 pt:"相続人なしで借家人が死亡 → 同居の事実上の夫婦・養親子が承継",
 hon:"居住の用に供する建物の賃借人が相続人なしに死亡した場合、その当時婚姻又は縁組の届出をしていないが、建物の賃借人と事実上夫婦又は養親子と同様の関係にあった同居者は、建物の賃借人の権利義務を承継する。"},
{c:"ken",lv:3,a:true,
 q:"相続人が、亡くなった人の財産の一部を売ってしまった場合、相続をそのまま受け入れた（単純承認した）ものとみなされる。",
 exp:`<p>相続には、3つの選び方があります。</p><p>・<b>単純承認</b>：プラスもマイナスも全部受けつぐ<br>・<b>限定承認</b>：プラスの財産の範囲でだけ、借金を引き受ける（<mark>相続人全員で</mark>しなければならない）<br>・<b>相続放棄</b>：全部受けつがない（1人でできる）</p><p>相続財産を売るなどすると、<mark>単純承認したとみなされ</mark>、あとで放棄できなくなります。3か月以内に何もしなかった場合も単純承認です。</p>`,
 pt:"相続財産の処分・3か月経過 → 単純承認とみなす。限定承認は全員共同",
 hon:"相続人が相続財産の全部又は一部を処分したときは、相続人は、単純承認をしたものとみなす。"},
{c:"ken",lv:3,a:false,
 q:"限定承認は、相続人のうちの1人だけでもすることができる。",
 exp:`<p><b>限定承認</b>は、<mark>相続人全員が一緒に</mark>しなければなりません。1人だけではできません。</p><p>反対に、<b>相続放棄</b>は、1人だけでできます。</p>`,
 pt:"限定承認は全員共同、相続放棄は単独",
 hon:"相続人が数人あるときは、限定承認は、各相続人が単独ですることができる。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"公証人に作ってもらう遺言（公正証書遺言）は、亡くなったあと、家庭裁判所での検認の手続きがいらない。",
 exp:`<p><b>検認（けんにん）</b>は、遺言書が書きかえられていないかを、家庭裁判所で確認する手続きです。</p><p>・<b>自筆証書遺言</b> → 原則として検認が必要（法務局に預けていたものは不要）<br>・<b>公正証書遺言</b> → <mark>検認は不要</mark>（公証人が作り、原本を保管しているため）</p>`,
 pt:"公正証書遺言・法務局保管の自筆証書遺言は検認不要",
 hon:"公正証書による遺言については、家庭裁判所の検認を要しない。"},
{c:"ken",lv:3,a:true,
 q:"マンションの管理者は、少なくとも毎年1回、集会を開かなければならない。",
 exp:`<p>マンションのことを話し合って決める場が<b>集会</b>です。</p><p>管理者（管理組合の理事長など）は、<mark>少なくとも毎年1回</mark>、集会を開いて、自分のした仕事を報告しなければなりません。</p><p>集会の開き方の細かいルール（通知の期限や決め方）は、2026年4月施行の区分所有法の改正で変わった部分があるので、受験する年のテキストで確認しましょう。</p>`,
 pt:"管理者は少なくとも毎年1回集会を招集し、事務を報告する",
 hon:"管理者は、少なくとも毎年1回集会を招集しなければならない。"},
{c:"ken",lv:3,a:false,
 q:"マンションの部屋を借りて住んでいる人は、集会で決をとるとき、区分所有者と同じように投票（議決権の行使）ができる。",
 exp:`<p>部屋を借りている人（<b>占有者</b>）は、区分所有者ではないので、<mark>議決権はありません</mark>。</p><p>ただし、ペットの禁止など、<b>自分にも関係がある議題</b>のときは、集会に出て<b>意見を述べる</b>ことができます。また、決まった規約や集会の決議には、占有者も従わなければなりません。</p>`,
 pt:"占有者は議決権なし。利害関係がある議題なら意見を述べられる",
 hon:"区分所有者の承諾を得て専有部分を占有する者は、会議の目的たる事項につき利害関係を有する場合には、集会において議決権を行使することができる。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"仮登記をしておけば、あとで本登記をしたとき、その順位は仮登記をしたときの順位になる。",
 exp:`<p>書類がそろわないなどで、すぐに本当の登記（本登記）ができないとき、とりあえず<b>仮登記</b>をして順番を確保できます。</p><p>あとで本登記をすると、<mark>本登記の順位は、仮登記の順位</mark>になります。</p><p>ただし、仮登記のままでは、第三者に権利を主張する力（対抗力）はありません。</p>`,
 pt:"本登記の順位は仮登記の順位による（仮登記だけでは対抗力なし）",
 hon:"仮登記に基づいて本登記をした場合は、当該本登記の順位は、当該仮登記の順位による。"},
{c:"ken",lv:2,a:true,
 q:"だれでも、手数料を払えば、法務局で、どの土地や建物の登記事項証明書でももらうことができる。",
 exp:`<p>登記は、だれが持ち主かなどを、<b>みんなに知らせる（公示する）</b>ためのものです。</p><p>だから<mark>利害関係がなくても、だれでも</mark>、手数料を払えば登記事項証明書（登記の内容を証明する書類）をもらえます。</p><p>オンラインで請求することもできます。</p>`,
 pt:"登記事項証明書は誰でも請求できる",
 hon:"何人も、登記官に対し、手数料を納付して、登記記録に記録されている事項の全部又は一部を証明した書面の交付を請求することができる。"},
{c:"ken",lv:3,a:true,
 q:"となりの家の木の根が自分の土地に入ってきたら、自分でその根を切ってよい。",
 exp:`<p>となりの土地との関係のルールを<b>相隣関係</b>といいます。</p><p>・<b>根</b>が入ってきた → <mark>自分で切ってよい</mark><br>・<b>枝</b>が入ってきた → 原則は、木の持ち主に切ってもらう。ただし、頼んでも相当の期間内に切ってくれないとき、持ち主が分からないとき、急ぐときは、自分で切れる（2023年4月から）</p>`,
 pt:"越境した根は自分で切れる。枝は原則所有者に切らせる（一定の場合は自分で）",
 hon:"隣地の竹木の根が境界線を越えるときは、その根を切り取ることができる。"},
{c:"ken",lv:3,a:true,
 q:"へいがこわれて通行人がけがをした場合、へいを借りて使っている人に落ち度がなければ、へいの持ち主は、自分に落ち度がなくても賠償しなければならない。",
 exp:`<p>建物やへいなど（<b>土地の工作物</b>）に欠陥があって人に損害を与えた場合の責任を<b>工作物責任</b>といいます。</p><p>まず、使っている人（<b>占有者</b>）が責任を負います。でも占有者が、損害を防ぐ注意をしていたことを証明すれば、責任を免れます。</p><p>そのときは、<mark>持ち主（所有者）が、落ち度がなくても責任を負います</mark>（無過失責任）。</p>`,
 pt:"工作物責任：占有者が免責されたら所有者が無過失責任",
 hon:"土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、その工作物の占有者は、被害者に対してその損害を賠償する責任を負う。ただし、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。"},
{c:"ken",lv:2,a:true,
 q:"民法では、買主が売主に手付を渡したときは、特に決めていなければ、その手付は「解約手付」と考えられる。",
 exp:`<p>手付には、いくつかの種類がありますが、民法では、特に決めていなければ<mark>解約手付と推定</mark>されます。</p><p>解約手付なら、相手が契約の実行に取りかかるまでは、<b>買主は手付を放棄</b>、<b>売主は手付の倍の額を現実に差し出して</b>、契約をやめられます。</p>`,
 pt:"手付は特約がなければ解約手付と推定される",
 hon:"買主が売主に手付を交付したときは、その手付は、解約手付と推定される。"}
);

/* 第5版：法令上の制限の範囲の補充 */
Q.push(
{c:"hou",lv:2,a:true,
 q:"市街化区域と市街化調整区域の線引き（区域区分）は都道府県が決め、地区計画は市町村が決める。",
 exp:`<p>都市計画は、内容によって<b>決める人</b>がちがいます。</p><p>・<b>都道府県</b>：広い範囲に関わるもの（<mark>区域区分</mark>、都市計画区域の整備・開発・保全の方針など）<br>・<b>市町村</b>：身近なもの（<mark>用途地域、地区計画</mark>など）</p><p>2つがぶつかったときは、<b>都道府県</b>の都市計画が優先します。</p>`,
 pt:"区域区分は都道府県、用途地域・地区計画は市町村が決める",
 hon:"区域区分に関する都市計画は都道府県が定め、地区計画に関する都市計画は市町村が定める。"},
{c:"hou",lv:3,a:true,
 q:"地区計画の区域（地区整備計画が決められた所）で建物を建てるときは、工事を始める30日前までに、市町村長に届け出なければならない。",
 exp:`<p><b>地区計画</b>は、街区ぐらいの小さな範囲で、建物の形や色、道路の配置などを細かく決める計画です。</p><p>その区域で建物を建てたり、土地の形を変えたりするときは、<mark>工事を始める30日前までに、市町村長に届出</mark>をします。許可ではなく<b>届出</b>です。</p><p>計画に合わないときは、市町村長は設計を変えるよう<b>勧告</b>できます。</p>`,
 pt:"地区計画の区域内の建築等：着手の30日前までに市町村長へ届出",
 hon:"地区計画の区域（地区整備計画が定められている区域に限る。）内において、建築物の建築等を行おうとする者は、当該行為に着手する日の30日前までに、一定の事項を市町村長に届け出なければならない。"},
{c:"hou",lv:3,a:false,
 q:"高度地区は、建物の容積率の最高限度と最低限度を決める地区である。",
 exp:`<p>名前が似ている2つの地区に注意しましょう。</p><p>・<b>高度地区</b>：<mark>建物の高さ</mark>の最高限度または最低限度を決める<br>・<b>高度利用地区</b>：土地を高度に使うため、<mark>容積率</mark>の最高・最低限度、建ぺい率の最高限度、建築面積の最低限度などを決める</p><p>「高度」は高さ、「高度利用」は容積率、と覚えましょう。</p>`,
 pt:"高度地区＝高さの限度／高度利用地区＝容積率などの限度",
 hon:"高度地区は、用途地域内において市街地の環境を維持し、又は土地利用の増進を図るため、建築物の容積率の最高限度及び最低限度を定める地区である。（→ 誤り）"},
{c:"hou",lv:3,a:true,
 q:"都市計画事業の認可の告示があった後に、その事業地内で建物を建てるときは、都道府県知事などの許可が必要である。",
 exp:`<p>道路や公園を作る都市計画事業が、いよいよ実行される段階になったら（<b>事業認可の告示</b>の後）、事業のじゃまになる行為はさらに厳しく制限されます。</p><p>その事業地内で<mark>建物を建てる・土地の形を変える・重い物を置く</mark>などをするには、<b>知事等の許可</b>が必要です（都市計画法65条）。</p><p>53条の許可（計画段階）とちがい、軽い建物でも許可が必要です。</p>`,
 pt:"事業認可の告示後の事業地内の建築等 → 知事等の許可（65条）",
 hon:"都市計画事業の認可の告示があった後においては、当該事業地内において、都市計画事業の施行の障害となるおそれがある建築物の建築等を行おうとする者は、都道府県知事等の許可を受けなければならない。"},
{c:"hou",lv:2,a:true,fig:"kaihatsu",
 q:"都市計画区域の外で開発許可が必要になるのは、1ヘクタール（10,000㎡）以上の開発をするときである。",
 exp:`<p>都市計画区域の外は、街づくりのルールがゆるい場所です。</p><p>それでも、<mark>1ha（10,000㎡）以上</mark>の大きな開発をするときは、開発許可が必要です。</p><p>表で、場所ごとの広さをもう一度確認しましょう。</p>`,
 pt:"都市計画区域外・準都市計画区域外は1ha以上で開発許可",
 hon:"都市計画区域及び準都市計画区域外の区域内において行う開発行為で、その規模が1ha以上のものは、原則として開発許可を受けなければならない。"},
{c:"hou",lv:3,a:true,fig:"kaihatsu",
 q:"土地区画整理事業として行う開発行為は、開発許可を受けなくてよい。",
 exp:`<p>土地区画整理事業や都市計画事業などは、それぞれの法律で、すでにきちんとチェックを受けています。</p><p>だから、<mark>それらの事業として行う開発行為は、開発許可が不要</mark>です。</p><p>ほかにも、非常災害の応急措置や、公有水面埋立法の免許を受けた埋立地での開発なども許可不要です。</p>`,
 pt:"都市計画事業・区画整理事業などの施行として行う開発行為は許可不要",
 hon:"土地区画整理事業の施行として行う開発行為は、開発許可を受ける必要がない。"},
{c:"hou",lv:3,a:true,
 q:"市街化調整区域で、開発許可を受けた区域の外で建物を建てるときは、原則として都道府県知事などの許可が必要である。",
 exp:`<p>市街化調整区域では、開発（土地の造成）をしないで、すでにある宅地に建物を建てる場合も、<mark>原則として知事等の許可</mark>が必要です（都市計画法43条）。</p><p>造成をしなければ自由に建てられる、となると、市街化をおさえる意味がなくなるからです。</p><p>農林漁業用の建物などは、例外として許可がいりません。</p>`,
 pt:"市街化調整区域の開発区域外での建築 → 原則知事等の許可（43条）",
 hon:"市街化調整区域のうち開発許可を受けた開発区域以外の区域内においては、原則として、都道府県知事等の許可を受けなければ、建築物の新築をしてはならない。"},
{c:"hou",lv:3,a:true,fig:"youto",
 q:"第一種中高層住居専用地域には、ホテルや旅館を建てることはできない。",
 exp:`<p><b>ホテル・旅館</b>を建てられるのは、<mark>第一種住居地域（3,000㎡以下）から上</mark>の地域です。第一種・第二種中高層住居専用地域、低層住居専用地域、田園住居地域には建てられません。</p><p>また、工業地域・工業専用地域にも建てられません。</p><p>覚え方：「<b>住居専用</b>」と名前に付く地域には、ホテルは建てられない。</p>`,
 pt:"ホテル・旅館は「住居専用」の付く地域・工業・工業専用地域は×",
 hon:"第一種中高層住居専用地域内においては、ホテル又は旅館を建築することができない。"},
{c:"hou",lv:3,a:true,
 q:"第一種低層住居専用地域でも、お店の部分が50㎡以下で、建物全体の半分より小さいなどの条件を満たす「店舗兼用住宅」なら建てることができる。",
 exp:`<p>第一種低層住居専用地域には、ふつうのお店は建てられません。</p><p>でも、<mark>住宅の一部をお店にする「店舗兼用住宅」</mark>で、お店の部分が<b>50㎡以下</b>、かつ<b>延べ面積の半分未満</b>などの条件を満たせば、建てられます。</p><p>街の小さなパン屋さんや美容院などを想像するとよいでしょう。</p>`,
 pt:"第一種低層：店舗部分50㎡以下・延べ面積の1/2未満の兼用住宅はOK",
 hon:"第一種低層住居専用地域内においては、店舗部分の床面積が50㎡以下で延べ面積の2分の1未満である一定の兼用住宅は、建築することができる。"},
{c:"hou",lv:3,a:false,
 q:"北側の家の日当たりを守る「北側斜線制限」は、商業地域にも適用される。",
 exp:`<p><b>北側斜線制限</b>は、北側にある家の日当たりを守るためのルールです。</p><p>適用されるのは、<mark>第一種・第二種低層住居専用地域、田園住居地域、第一種・第二種中高層住居専用地域</mark>だけです。商業地域には適用されません。</p><p>なお、道路の日当たりや風通しを守る<b>道路斜線制限</b>は、すべての地域に適用されます。</p>`,
 pt:"北側斜線は低層・田園・中高層の住居専用地域だけ",
 hon:"北側斜線制限は、商業地域内の建築物にも適用される。（→ 誤り）"},
{c:"hou",lv:3,a:true,
 q:"第一種低層住居専用地域などでは、都市計画で、建物の外壁を敷地の境界から1mまたは1.5m以上離すよう決めることができる。",
 exp:`<p>低層住居専用地域と田園住居地域では、ゆったりした街並みを作るためのルールがあります。</p><p>その1つが<mark>外壁の後退距離</mark>で、都市計画で決める場合は<b>1mまたは1.5m</b>です。</p><p>ほかに、<b>絶対高さ制限</b>（10mまたは12m）もあります。</p>`,
 pt:"低層住居専用・田園住居地域：外壁後退1m or 1.5m、高さ10m or 12m",
 hon:"第一種低層住居専用地域内においては、外壁の後退距離の限度を定める場合においては、その限度は、1.5m又は1mとする。"},
{c:"hou",lv:3,a:true,
 q:"用途地域では、都市計画で、敷地面積の最低限度を決めることができる。その最低限度は200㎡をこえてはならない。",
 exp:`<p>小さな土地に分けて家がぎっしり建つと、住みにくい街になります。</p><p>そこで用途地域では、<mark>敷地面積の最低限度</mark>（これより小さい敷地には建てられない）を決められます。</p><p>ただし、厳しすぎると家を建てられなくなるので、最低限度は<b>200㎡以下</b>で決めます。</p>`,
 pt:"敷地面積の最低限度は200㎡をこえない範囲",
 hon:"建築物の敷地面積の最低限度を定める場合においては、その最低限度は、200㎡を超えてはならない。"},
{c:"hou",lv:3,a:true,
 q:"住民どうしで建物のルールを決める「建築協定」を結ぶには、原則として土地の所有者などの全員の合意と、特定行政庁の認可が必要である。",
 exp:`<p><b>建築協定</b>は、住民が自分たちで「この街では3階建てまで」などのルールを決めるしくみです。</p><p>協定を結ぶ（締結）・変更するには、<mark>土地の所有者と借地権者の全員の合意</mark>と、<b>特定行政庁の認可</b>が必要です。</p><p>やめる（廃止）ときは、<b>過半数</b>の合意で足ります。</p>`,
 pt:"建築協定：締結・変更は全員合意＋認可、廃止は過半数＋認可",
 hon:"建築協定を締結しようとする土地の所有者等は、その全員の合意により建築協定書を作成し、特定行政庁の認可を受けなければならない。"},
{c:"hou",lv:3,a:true,
 q:"高さ20mをこえる建物には、原則として、かみなりから守る設備（避雷設備）をつけなければならない。",
 exp:`<p>建物そのものの安全のためのルール（<b>単体規定</b>）には、数字が出てくるものがあります。</p><p>・高さ<mark>20m超</mark> → <b>避雷設備</b><br>・高さ<mark>31m超</mark> → <b>非常用の昇降機（エレベーター）</b><br>・居室の換気のための窓 → 床面積の<b>1/20以上</b><br>・<b>石綿（アスベスト）</b>を使う建材は禁止</p>`,
 pt:"20m超→避雷設備、31m超→非常用昇降機、換気窓は床面積の1/20以上",
 hon:"高さ20mを超える建築物には、原則として、有効に避雷設備を設けなければならない。"},
{c:"hou",lv:3,a:false,
 q:"高さ20mをこえる建物には、非常用のエレベーター（非常用の昇降機）をつけなければならない。",
 exp:`<p>非常用の昇降機が必要なのは、<mark>高さ31m超</mark>の建物です。</p><p>20m超で必要なのは、<b>避雷設備</b>です。数字と設備の組み合わせがよくねらわれます。</p>`,
 pt:"非常用昇降機は31m超（20m超は避雷設備）",
 hon:"高さ20mを超える建築物には、非常用の昇降機を設けなければならない。（→ 誤り）"},
{c:"hou",lv:3,a:true,
 q:"住宅を、床面積が200㎡をこえる飲食店に用途変更するときは、建築確認が必要である。",
 exp:`<p>建築確認は、新しく建てるときだけでなく、<mark>用途を変えて、200㎡をこえる「特殊建築物」にする</mark>ときにも必要です。</p><p><b>特殊建築物</b>とは、学校・病院・ホテル・飲食店・共同住宅など、多くの人が使う建物のことです。安全の基準が厳しいので、改めてチェックします。</p>`,
 pt:"200㎡超の特殊建築物への用途変更 → 建築確認が必要",
 hon:"建築物の用途を変更して、その用途に供する部分の床面積の合計が200㎡を超える特殊建築物とする場合には、建築確認を受けなければならない。"},
{c:"hou",lv:3,a:true,
 q:"建築確認を受けた工事が終わったら、建築主は、工事が終わった日から4日以内に、完了検査を申請しなければならない。",
 exp:`<p>工事が終わったら、設計どおりにできているかを確かめる<b>完了検査</b>を受けます。</p><p>申請の期限は、<mark>工事完了の日から4日以内</mark>です（建築主事に申請する場合）。</p><p>検査に合格すると<b>検査済証</b>がもらえます。</p>`,
 pt:"完了検査の申請は工事完了から4日以内",
 hon:"建築主は、建築確認を受けた工事を完了したときは、工事が完了した日から4日以内に到達するように、建築主事等の検査を申請しなければならない。"},
{c:"hou",lv:3,a:false,
 q:"土地区画整理組合は、土地の所有者などが2人以上集まれば、だれの認可もなく設立できる。",
 exp:`<p>土地区画整理事業は、組合でも行えます。組合を作るには、</p><p>・宅地の所有者や借地権者が<mark>7人以上</mark>共同して<br>・定款と事業計画を決め<br>・<mark>都道府県知事の認可</mark>を受ける</p><p>必要があります。組合ができると、区域内の宅地の所有者・借地権者は<b>全員が組合員</b>になります。</p>`,
 pt:"区画整理組合：7人以上で、知事の認可。区域内の所有者・借地権者は全員組合員",
 hon:"土地区画整理組合を設立しようとする者は、7人以上共同して、定款及び事業計画を定め、その組合の設立について都道府県知事の認可を受けなければならない。"},
{c:"hou",lv:3,a:true,fig:"kanchi",
 q:"土地区画整理事業では、事業の費用にあてるため、換地として持ち主に返さない土地（保留地）を決めることができる。",
 exp:`<p>区画整理では、道路や公園を作るため、みんなの土地を少しずつ出し合います（<b>減歩</b>）。</p><p>さらに、事業の費用にあてるために、<mark>換地として返さずに残しておく土地</mark>を作ることがあります。これを<b>保留地</b>といい、売って費用にあてます。</p><p>換地処分の公告の翌日に、保留地は<b>施行者</b>のものになります。</p>`,
 pt:"保留地：事業費にあてるため換地に定めない土地（公告の翌日に施行者が取得）",
 hon:"土地区画整理事業の施行者は、換地計画において、土地区画整理事業の施行の費用に充てるため、一定の土地を換地として定めないで、その土地を保留地として定めることができる。"},
{c:"hou",lv:3,a:true,fig:"nouchi",
 q:"競売（けいばい）で農地を買う場合も、農地法3条の許可が必要である。",
 exp:`<p>農地法の許可は、<b>売買などの契約</b>だけでなく、<mark>競売で取得する場合にも必要</mark>です。</p><p>だれが農地を手に入れるのかをチェックする目的は同じだからです。</p><p>一方、<b>相続</b>や<b>遺産分割</b>、<b>時効</b>で取得する場合は、許可はいりません（相続などは農業委員会への届出が必要）。</p>`,
 pt:"競売による取得も許可が必要。相続・遺産分割・時効は許可不要",
 hon:"競売により農地を取得する場合にも、農地法第3条第1項の許可を受ける必要がある。"},
{c:"hou",lv:3,a:true,fig:"nouchi",
 q:"自分の農地を、2アール（200㎡）未満の農業用施設（農機具をしまう小屋など）にする場合は、農地法4条の許可はいらない。",
 exp:`<p>自分の農地を農業のための施設に変える場合で、<mark>その広さが2アール（200㎡）未満</mark>なら、4条の許可はいりません。</p><p>農業を続けるための小さな施設まで許可を求める必要はないからです。</p><p>2アール以上なら、農業用施設でも許可が必要です。</p>`,
 pt:"自己の農地を2a未満の農業用施設にする → 4条許可不要",
 hon:"農業者が自己所有の農地に2a未満の農業用施設を設置する場合には、農地法第4条第1項の許可を受ける必要はない。"},
{c:"hou",lv:3,a:true,fig:"kokudo",
 q:"土地の売買の予約をした場合も、広さの条件を満たせば、国土利用計画法の事後届出が必要である。",
 exp:`<p>事後届出の対象になる「<b>土地売買等の契約</b>」には、ふつうの売買だけでなく、</p><p>・<mark>売買の予約</mark><br>・<b>交換</b><br>・権利金などの対価がある<b>地上権・賃借権の設定</b></p><p>なども含まれます。どれも、お金などの対価を払って土地の権利が移るからです。</p>`,
 pt:"予約・交換・権利金のある地上権/賃借権の設定も事後届出の対象",
 hon:"土地の売買の予約を締結した場合も、事後届出の対象となる土地売買等の契約に該当する。"},
{c:"hou",lv:3,a:true,
 q:"特定盛土等規制区域で、一定の盛土や切土をするときは、原則として工事を始める30日前までに、都道府県知事に届け出なければならない。",
 exp:`<p>盛土規制法では、2つの区域があります。</p><p>・<b>宅地造成等工事規制区域</b>（市街地や集落など）→ 一定の工事は<b>許可</b><br>・<b>特定盛土等規制区域</b>（市街地から離れた所など）→ 一定の工事は<mark>着手の30日前までに届出</mark>（とても大きな工事は許可）</p><p>人が住む所ほど厳しい（許可）、と覚えましょう。</p>`,
 pt:"特定盛土等規制区域：一定の工事は着手30日前までに届出（大規模なら許可）",
 hon:"特定盛土等規制区域内において行われる特定盛土等又は土石の堆積に関する工事については、工事主は、当該工事に着手する日の30日前までに、一定の事項を都道府県知事に届け出なければならない。"},
{c:"hou",lv:2,a:false,fig:"youto",
 q:"用途地域は、市街化調整区域にも必ず定めなければならない。",
 exp:`<p>用途地域は、<b>市街化区域</b>には必ず定めますが、<mark>市街化調整区域には原則として定めません</mark>。</p><p>市街化調整区域は街になるのをおさえる所なので、建物の種類ごとのルールを決める必要がないからです。</p>`,
 pt:"市街化区域には用途地域を必ず定め、調整区域には原則定めない",
 hon:"市街化調整区域については、少なくとも用途地域を定めるものとする。（→ 誤り）"},
{c:"hou",lv:3,a:false,
 q:"特定行政庁が指定した角地なら、容積率も10%ゆるくなる。",
 exp:`<p>角地で10%ゆるくなるのは、<mark>建ぺい率</mark>です。容積率はゆるくなりません。</p><p>建ぺい率は火事の広がりや日当たりに関係するので、2方向が道路に面した角地はゆるめてよい、という考え方です。</p>`,
 pt:"角地の緩和は建ぺい率だけ（容積率は緩和されない）",
 hon:"街区の角にある敷地で特定行政庁が指定するものの内にある建築物については、容積率の限度に10分の1を加えたものとする。（→ 誤り）"}
);

/* 第5版：税・その他の範囲の補充 */
Q.push(
{c:"zei",lv:3,a:true,
 q:"家を新築したが、6か月たってもだれも住まず、売れてもいない場合は、6か月たった日に、その家の持ち主が不動産取得税の対象として家を手に入れたものとみなされる。",
 exp:`<p>不動産取得税は、ふつう<b>最初に住んだ時</b>か<b>最初に売った時</b>に、住んだ人や買った人にかかります。</p><p>でも、だれも住まず売れもしないと、いつまでも税金がかかりません。そこで、<mark>新築から6か月たったら、その時の持ち主が取得したとみなして</mark>課税します。</p><p>（宅建業者などが売る新築住宅には、この期間を延ばす特例があります）</p>`,
 pt:"新築家屋が6か月使われず売れない → 6か月経過日に所有者が取得したとみなす",
 hon:"家屋が新築された日から6月を経過して、なお、当該家屋について最初の使用又は譲渡が行われない場合においては、当該家屋が新築された日から6月を経過した日において家屋の取得がなされたものとみなし、当該家屋の所有者を取得者とみなして、不動産取得税を課する。"},
{c:"zei",lv:3,a:true,
 q:"会社の合併で不動産を手に入れた場合は、不動産取得税はかからない。",
 exp:`<p>不動産取得税がかからない（非課税）取得は、主に次のものです。</p><p>・<b>相続</b>による取得<br>・<mark>法人の合併</mark>による取得<br>・国や地方公共団体の取得</p><p>一方、<b>贈与</b>や<b>交換</b>、<b>売買</b>による取得には課税されます。</p>`,
 pt:"不動産取得税の非課税：相続・法人の合併・国等の取得",
 hon:"法人の合併による不動産の取得に対しては、不動産取得税は課されない。"},
{c:"zei",lv:3,a:true,
 q:"固定資産税の評価額は、原則として3年ごとに見直される（評価替え）。",
 exp:`<p>固定資産税は、市町村の<b>固定資産課税台帳</b>に登録された価格をもとに計算します。</p><p>この価格は、毎年調べ直すのではなく、<mark>原則として3年ごとに評価替え</mark>をします。</p><p>登録された価格に不満がある人は、<b>固定資産評価審査委員会</b>に審査の申出ができます。</p>`,
 pt:"固定資産税評価額は3年ごとに評価替え。不服は固定資産評価審査委員会へ",
 hon:"固定資産税の課税標準となる土地及び家屋の価格は、原則として、基準年度に評価替えを行い、3年度間据え置かれる。"},
{c:"zei",lv:3,a:true,
 q:"土地や家の価格に不満がある固定資産税の納税者は、固定資産評価審査委員会に審査の申出をすることができる。",
 exp:`<p>固定資産課税台帳に登録された<b>価格</b>に納得できないときは、<mark>固定資産評価審査委員会</mark>に審査の申出ができます。</p><p>また、自分の土地や家の価格を、近くのほかの土地や家の価格とくらべられるように、毎年一定期間、<b>縦覧（じゅうらん）</b>の制度もあります。</p>`,
 pt:"価格の不服 → 固定資産評価審査委員会に審査の申出",
 hon:"固定資産税の納税者は、その納付すべき当該年度の固定資産課税に係る固定資産について固定資産課税台帳に登録された価格について不服がある場合においては、一定の期間内に、文書をもって、固定資産評価審査委員会に審査の申出をすることができる。"},
{c:"zei",lv:3,a:false,
 q:"抵当権の設定の登記をするときの登録免許税は、その不動産の価格をもとに計算する。",
 exp:`<p>登録免許税の計算のもとになる金額（課税標準）は、登記の種類でちがいます。</p><p>・所有権の保存・移転の登記 → <b>不動産の価額</b>（固定資産課税台帳の価格）<br>・<mark>抵当権の設定の登記 → 債権の金額（借りたお金の額）</mark></p><p>抵当権は、借りたお金を守るための権利なので、借りたお金の額をもとにします。</p>`,
 pt:"抵当権設定登記の課税標準は債権金額（所有権の登記は不動産の価額）",
 hon:"抵当権の設定登記の登録免許税の課税標準は、当該不動産の価額である。（→ 誤り）"},
{c:"zei",lv:3,a:true,
 q:"契約書に、消費税の額が代金とはっきり分けて書いてあるときは、消費税の分は、印紙税の記載金額に含めない。",
 exp:`<p>印紙税は、契約書に書いてある<b>記載金額</b>によって税額が決まります。</p><p>代金と<mark>消費税額が分けて書いてあれば、消費税の分は記載金額に入れません</mark>。</p><p>「税込み1,100万円」とだけ書いてあると、1,100万円が記載金額になります。</p>`,
 pt:"消費税額が区分記載されていれば、記載金額に含めない",
 hon:"不動産の譲渡に関する契約書において、消費税額等が区分記載されている場合には、当該消費税額等は記載金額に含めない。"},
{c:"zei",lv:3,a:false,
 q:"すでに結んだ売買契約の代金を減らすための「変更契約書」では、減らした金額が印紙税の記載金額になる。",
 exp:`<p>変更契約書の記載金額は、次のように決まります。</p><p>・代金を<b>増やす</b>変更 → <mark>増えた金額</mark>が記載金額<br>・代金を<b>減らす</b>変更 → <mark>記載金額のない契約書</mark>として扱う（200円）</p><p>減らす場合は、新しく税金を取る理由がないので、記載金額がないものとして扱います。</p>`,
 pt:"増額の変更契約書は増加額、減額の変更契約書は記載金額なし（200円）",
 hon:"契約金額を減額する変更契約書は、その減少額を記載金額として印紙税が課される。（→ 誤り）"},
{c:"zei",lv:3,a:true,
 q:"正式な契約書を作る前に作った「仮契約書」にも、印紙税がかかる。",
 exp:`<p>印紙税は、文書の名前ではなく、<b>内容</b>で判断します。</p><p>仮契約書でも、売買の約束の内容が書いてあれば、<mark>課税文書</mark>になります。</p><p>同じように、「覚書」や「念書」という名前でも、内容が契約なら課税されます。</p>`,
 pt:"印紙税は名前ではなく内容で判断（仮契約書・覚書も課税）",
 hon:"後日、正式文書を作成することとなる場合において、一時的に作成する仮契約書であっても、印紙税の課税文書に該当する。"},
{c:"zei",lv:3,a:false,
 q:"住んでいた家を自分の子どもに売った場合でも、居住用財産の3,000万円特別控除を使える。",
 exp:`<p>3,000万円特別控除は、<mark>配偶者、直系血族（親・子・孫など）、生計を一にする親族</mark>などに売った場合は、使えません。</p><p>身内どうしで売り買いして、税金を減らすことを防ぐためです。</p>`,
 pt:"配偶者・直系血族などへの譲渡には3,000万円控除は使えない",
 hon:"居住用財産を譲渡した場合の3,000万円特別控除は、当該個人の直系血族に譲渡した場合にも適用される。（→ 誤り）"},
{c:"zei",lv:3,a:true,
 q:"相続時精算課税を選ぶと、親などからもらった財産のうち、合計2,500万円までは贈与税がかからない。",
 exp:`<p><b>相続時精算課税</b>は、60歳以上の親や祖父母から、18歳以上の子や孫が財産をもらうときに選べる制度です。</p><p>もらった財産の<mark>合計2,500万円まで（特別控除）</mark>は贈与税がかからず、こえた部分には一律20%の贈与税がかかります。</p><p>そのかわり、親などが亡くなったとき、もらった財産を相続財産に足して、相続税を計算し直します（精算）。2024年からは、毎年110万円までの基礎控除も加わりました。</p>`,
 pt:"相続時精算課税：特別控除は累計2,500万円（超えた部分は20%）",
 hon:"相続時精算課税の適用を受ける贈与財産については、特別控除額2,500万円を控除した残額に20%の税率を乗じて贈与税額を計算する。"},
{c:"zei",lv:3,a:true,
 q:"不動産の鑑定評価では、その不動産を一番よい使い方（最有効使用）をした場合を前提にして、値段を考える。",
 exp:`<p>不動産の値段は、<b>どう使うか</b>で大きく変わります。</p><p>鑑定評価では、<mark>その不動産の効用が最も高く発揮される使い方（最有効使用）</mark>を前提に、値段を判断します。これを<b>最有効使用の原則</b>といいます。</p><p>今の使い方が最有効使用とは限らない点に注意します。</p>`,
 pt:"鑑定評価は最有効使用を前提に判断する",
 hon:"不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用（最有効使用）を前提として把握される価格を標準として形成される。"},
{c:"zei",lv:3,a:true,
 q:"取引事例比較法では、集めた取引事例に特別な事情（急いで売ったなど）があれば補正し、取引の時点と今の値段の変化も修正する。",
 exp:`<p>取引事例比較法は、近くの似た物件の取引とくらべる方法です。</p><p>でも、そのまま使うと正しくくらべられないので、</p><p>・<mark>事情補正</mark>：急いで売った、親せきに安く売ったなどの特別な事情を直す<br>・<mark>時点修正</mark>：取引した時と今との値段の変化を直す<br>・<b>地域要因・個別要因の比較</b>：場所や土地の形のちがいを直す</p><p>をします。投機的な取引の事例は、使うのに向きません。</p>`,
 pt:"取引事例比較法：事情補正・時点修正・地域要因と個別要因の比較",
 hon:"取引事例比較法においては、取引事例に係る取引が特殊な事情を含み、これが当該取引事例に係る価格等に影響を及ぼしている場合には適切に補正し、取引事例に係る取引の時点が価格時点と異なる場合には時点修正を行う。"},
{c:"zei",lv:3,a:true,
 q:"住宅金融支援機構は、住宅ローンを借りた人が亡くなったときに、保険金でローンを返す「団体信用生命保険」の業務を行っている。",
 exp:`<p>住宅ローンを借りた人が亡くなったり、重い障害を負ったりしたとき、<mark>保険金で残りのローンを返す</mark>しくみが<b>団体信用生命保険</b>です。</p><p>住宅金融支援機構は、この業務を行っています。家族が住む家を失わないようにするためです。</p>`,
 pt:"機構は団体信用生命保険の業務を行う",
 hon:"独立行政法人住宅金融支援機構は、貸付けを受けた者が死亡した場合等に支払われる生命保険の保険金等を当該貸付けに係る債務の弁済に充当する団体信用生命保険業務を行っている。"},
{c:"zei",lv:3,a:false,
 q:"住宅金融支援機構の証券化支援の対象は、新築住宅を買うためのローンだけで、中古住宅を買うためのローンは対象にならない。",
 exp:`<p>証券化支援（フラット35など）の対象は、<mark>新築住宅の建設・購入のローンだけでなく、中古住宅の購入のローンも含まれます</mark>。</p><p>また、住宅を建てるための<b>土地の取得</b>のお金も、住宅の建設とあわせて借りるなら対象になります。</p>`,
 pt:"証券化支援の対象には中古住宅の購入資金も含まれる",
 hon:"証券化支援事業（買取型）において、機構による譲受けの対象となる貸付債権には、中古住宅を購入するための貸付債権は含まれない。（→ 誤り）"},
{c:"zei",lv:3,a:true,
 q:"不動産の広告で、物件の名前に近くの公園の名前を使えるのは、原則として、物件からその公園までが直線距離で300m以内の場合である。",
 exp:`<p>物件の名前に「〇〇公園」などと付けると、すぐ近くにあるように見えます。</p><p>そこで、広告のルール（表示規約）では、公園・庭園・旧跡などの名前は、<mark>物件から直線距離で300m以内</mark>にある場合に使えることになっています。</p><p>駅の名前や地名は、また別のルールがあります。</p>`,
 pt:"物件名に公園等の名称を使えるのは直線距離300m以内",
 hon:"物件の名称として、当該物件から直線距離で300m以内に所在している公園、庭園、旧跡その他の施設の名称を用いることができる。"},
{c:"zei",lv:2,a:true,
 q:"地図の等高線の間隔がせまい所は、土地のかたむきが急である。",
 exp:`<p>等高線は、同じ高さの所を結んだ線です。</p><p>線と線の<mark>間隔がせまい所は、少し進むだけで高さが大きく変わる＝急な斜面</mark>です。間隔が広い所は、ゆるやかな斜面です。</p><p>急な斜面は、がけ崩れなどに注意が必要です。</p>`,
 pt:"等高線の間隔が密 → 急傾斜、疎 → 緩傾斜",
 hon:"地形図において、等高線の間隔が密な所は傾斜が急であり、間隔が疎な所は傾斜が緩やかである。"},
{c:"zei",lv:3,a:true,
 q:"山のふもとにある扇状地は、大雨のときに土石流が起きるおそれがある。",
 exp:`<p><b>扇状地</b>は、川が山から平地に出る所に、土砂が扇の形に積もってできた土地です。</p><p>水はけがよく、ふつうは比較的宅地に向いていますが、<mark>谷の出口に近い所は、大雨のときの土石流</mark>に注意が必要です。</p><p>一方、海や湖を埋めた<b>埋立地</b>や、水を抜いて作った<b>干拓地</b>は、地盤が弱く、液状化や浸水に注意が必要です（干拓地は海面より低いことも多く、埋立地より災害に弱い）。</p>`,
 pt:"扇状地は土石流に注意。干拓地は埋立地より災害に弱いことが多い",
 hon:"扇状地については、山地から出る河川の出口付近において、土石流による災害の危険性がある。"},
{c:"zei",lv:2,a:true,
 q:"木造の建物では、柱と柱の間にななめに入れる「筋かい」が、地震や風の横からの力に強くする役目をする。",
 exp:`<p>建物は、地震や強い風で<b>横から押される力</b>に弱いものです。</p><p>木造の建物では、柱の間にななめに入れる<mark>筋かい</mark>や、合板の壁（耐力壁）で、横からの力に耐えます。</p><p>筋かいなどを、建物全体にバランスよく配置することが大切です。</p>`,
 pt:"筋かい・耐力壁が地震や風の水平力に抵抗する",
 hon:"木造建築物の耐震性を高めるには、筋かいや耐力壁をつり合いよく配置することが重要である。"},
{c:"zei",lv:3,a:true,
 q:"免震構造は、建物と基礎の間にゴムなどの装置を入れて、地震のゆれを建物に伝わりにくくする構造である。",
 exp:`<p>地震に対する建物の作り方は、3種類あります。</p><p>・<b>耐震構造</b>：建物をがっしり作って、ゆれに耐える<br>・<b>制震構造</b>：建物の中にダンパーなどを入れて、ゆれを吸収する<br>・<mark>免震構造</mark>：建物と基礎の間に積層ゴムなどを入れて、<b>ゆれを伝わりにくくする</b></p>`,
 pt:"耐震＝耐える、制震＝吸収する、免震＝伝えない",
 hon:"免震構造は、建物の下部構造と上部構造との間に積層ゴムなどを設置し、揺れを減らす構造である。"},
{c:"zei",lv:1,a:true,
 q:"試験に毎年1問出る「統計」の問題は、地価公示や新設住宅着工戸数などの最新の数字から出るので、試験の直前に最新のデータを確認する必要がある。",
 exp:`<p>税・その他の分野では、毎年<b>統計</b>の問題が1問出ます（登録講習を修了した人は免除される5問の1つ）。</p><p>出るのは、<mark>地価公示（地価が上がったか下がったか）、新設住宅着工戸数、法人企業統計、土地白書</mark>などの<b>最新の数字</b>です。</p><p>数字は毎年変わるので、このアプリには入れていません。<b>試験の直前</b>に、予備校のまとめや最新の発表で確認するのが効率的です。</p>`,
 pt:"統計は毎年変わる最新の数字。直前期にまとめて確認する",
 hon:"統計問題は、地価公示、建築着工統計、法人企業統計、土地白書等の最新の数値から出題される。"}
);

/* 第7版：権利関係の補充（区分所有法の2026年4月改正・相隣関係・共有・不法行為・売買・賃貸借・請負・相続など） */
Q.push(
/* ---- 区分所有法（2026年4月1日施行の改正後） ---- */
{c:"ken",lv:2,a:false,
 q:"マンションの集会のふつうの決議（普通決議）は、集会に出席しなかった人も含めた、区分所有者全員の過半数の賛成がなければ成立しない（2026年4月以降）。",
 exp:`<p>2026年4月1日から、区分所有法が大きく変わりました。</p><p>集会に来ない（関心のない）人が多いと、何も決められなくなります。そこで、ふつうの決議は<mark>集会に出席した区分所有者とその議決権の、各過半数</mark>で決めることになりました。</p><p>「出席」には、書面で投票した人や、委任状・代理人で投票した人も含まれます。</p>`,
 pt:"2026年4月から、普通決議は「出席者」の各過半数",
 hon:"集会の議事は、区分所有法又は規約に別段の定めがない限り、区分所有者及び議決権の各過半数で決する。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"規約の設定・変更・廃止の決議は、区分所有者と議決権の各過半数が出席した集会で、出席者とその議決権の各4分の3以上の賛成で決める（2026年4月以降）。",
 exp:`<p>規約を変えるような大事な決議（特別決議）も、2026年4月から<b>出席者</b>の多数決になりました。</p><p>ただし、出席者が少なすぎると困るので、<mark>区分所有者と議決権の各過半数の出席</mark>（定足数）が必要です。</p><p>そのうえで、<mark>出席者の各4分の3以上</mark>の賛成で決めます。</p>`,
 pt:"特別決議：定足数（各過半数の出席）＋出席者の各3/4以上",
 hon:"規約の設定、変更又は廃止は、区分所有者及び議決権の各過半数を有する者が出席した集会において、出席した区分所有者及びその議決権の各4分の3以上の多数による集会の決議によってする。"},
{c:"ken",lv:3,a:false,
 q:"建替え決議も、2026年4月以降は、集会に出席した区分所有者とその議決権の各5分の4以上の賛成で成立する。",
 exp:`<p>建替えは、区分所有者の財産を失わせる重大な決議です。そのため、出席者の多数決には<b>なりませんでした</b>。</p><p>建替え決議は、<mark>区分所有者全員（裁判所が認めた所在等不明の人を除く）と議決権の、各5分の4以上</mark>が必要です。</p><p>ただし、耐震性不足などの客観的な理由があれば、<b>各4分の3以上</b>に下がります。</p>`,
 pt:"建替え決議は出席者ベースではない：全員の各4/5（客観的事由があれば3/4）",
 hon:"建替え決議は、集会に出席した区分所有者及びその議決権の各5分の4以上の多数で行うことができる。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"マンションに耐震性の不足や外壁がはがれ落ちるおそれなどの客観的な理由がある場合、建替え決議に必要な賛成は、各5分の4以上から各4分の3以上に下がる。",
 exp:`<p>危ないマンションを早く建て替えられるように、2026年4月から、<b>客観的な理由</b>がある場合の要件が下がりました。</p><p>理由は5つ：①耐震性の不足 ②火災に対する安全性の不足 ③外壁などがはがれ落ちて周りに危害を与えるおそれ ④給排水管の腐食などで衛生上有害となるおそれ ⑤バリアフリー基準に合わない。</p><p>この場合、<mark>各4分の3以上</mark>で建替えを決められます。一棟まるごとのリノベーションや建物・敷地の一括売却、取壊しも、同じ要件で決議できるようになりました。</p>`,
 pt:"客観的事由（耐震・防火・外壁・配管・バリアフリー）があれば建替えは3/4",
 hon:"区分所有建物が耐震性を欠く場合など一定の客観的事由があるときは、建替え決議は、区分所有者及び議決権の各4分の3以上の多数ですることができる。"},
{c:"ken",lv:3,a:true,
 q:"どれだけ調べても所在がわからない区分所有者がいるとき、裁判所の決定を受ければ、その人を集会のすべての決議の母数（分母）から外すことができる。",
 exp:`<p>連絡がつかない人も分母に入っていると、その人は「反対」と同じ扱いになり、決議が通りにくくなります。</p><p>そこで2026年4月から、<mark>裁判所が認めた所在等不明区分所有者</mark>を、すべての決議の母数から除く制度ができました。建替え決議も対象です。</p>`,
 pt:"所在等不明の区分所有者は、裁判所の決定で全決議の母数から除外できる",
 hon:"裁判所は、必要な調査を尽くしても所在等が知れない区分所有者があるときは、その区分所有者以外の者による集会の決議ができる旨の裁判をすることができる。"},
{c:"ken",lv:2,a:false,
 q:"マンションの集会の招集通知は、規約で定めておけば、会日の3日前に出してもよい（2026年4月以降）。",
 exp:`<p>招集通知は、<mark>会日の少なくとも1週間前</mark>に出さなければなりません。</p><p>以前は規約で短くできましたが、2026年4月からは<b>規約で1週間より短くすることはできなく</b>なりました。また、すべての集会の通知に「議案の要領」を書く必要があります。</p>`,
 pt:"招集通知は1週間前まで（規約で短縮できない）",
 hon:"集会の招集の通知は、規約で定めれば、会日より少なくとも3日前に発すれば足りる。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"共用部分の変更（形や働きが大きく変わるもの）は、原則として出席者の各4分の3以上の賛成が必要だが、外壁がはがれ落ちるおそれがある場合やバリアフリー化のために必要な場合は、各3分の2以上で決められる。",
 exp:`<p>エレベーターの設置や、危ない立体駐車場の取り壊しなど、必要な工事をしやすくするための改正です。</p><p>原則：出席者の各<b>4分の3</b>以上。<br>共用部分の欠陥で人の権利を傷つけるおそれがあるとき、バリアフリー化に必要なとき：各<mark>3分の2</mark>以上。</p>`,
 pt:"共用部分の変更：原則3/4、危険・バリアフリーなら2/3",
 hon:"共用部分の設置又は保存に瑕疵があることにより他人の権利が侵害されるおそれがあるときは、共用部分の変更の決議は、出席した区分所有者及びその議決権の各3分の2以上の多数でできる。"},
{c:"ken",lv:2,a:true,
 q:"マンションの部屋を借りて住んでいる人（占有者）は、集会の議題に利害関係がある場合には、集会に出て意見を述べることができる。",
 exp:`<p>部屋を借りている人は、区分所有者ではないので<b>投票（議決権）はできません</b>。</p><p>でも、ペットのルールなど、自分の暮らしに関係する議題なら、<mark>集会に出て意見を言うことはできます</mark>。そのため、集会の日時などは建物内の見やすい場所に掲示されます。</p>`,
 pt:"占有者：議決権なし、利害関係があれば意見を述べられる",
 hon:"区分所有者の承諾を得て専有部分を占有する者は、会議の目的たる事項につき利害関係を有する場合には、集会に出席して意見を述べることができる。"},

/* ---- 相隣関係・共有（2023年4月施行の改正） ---- */
{c:"ken",lv:3,a:true,
 q:"となりの家の木の枝が自分の土地にはみ出してきた。木の持ち主に切るように頼んだのに、ちょうどよい期間がたっても切ってくれないときは、自分で枝を切ってよい。",
 exp:`<p>枝は、原則として<b>木の持ち主に切ってもらう</b>ものです。</p><p>でも2023年4月から、次の場合は<mark>自分で切れる</mark>ようになりました。<br>①切るように頼んだのに、相当の期間内に切らない<br>②木の持ち主がわからない・どこにいるかわからない<br>③急いで切る必要がある</p><p>なお、<b>根</b>は、はじめから自分で切ってかまいません。</p>`,
 pt:"越境した枝：催告して切らない等なら自分で切れる。根はいつでも切れる",
 hon:"土地の所有者は、隣地の竹木の枝が境界線を越える場合において、竹木の所有者に枝を切除するよう催告したにもかかわらず、相当の期間内に切除しないときは、その枝を切り取ることができる。"},
{c:"ken",lv:2,a:true,
 q:"境界の近くで自分の家を修理するために必要なときは、その範囲で、となりの土地を使わせてもらうことができる。",
 exp:`<p>家の外壁を塗り直すときなど、となりの土地に足場を置く必要がありますね。</p><p>そのような場合、<mark>必要な範囲で、となりの土地を使うことができます</mark>（となりの人の損害が最も少ない方法で、あらかじめ通知する）。</p><p>ただし、となりの<b>住んでいる家</b>の中に入るには、住んでいる人の承諾が必要です。</p>`,
 pt:"建物の修繕などで、必要な範囲で隣地を使用できる（住家は承諾が必要）",
 hon:"土地の所有者は、境界又はその付近における建物の修繕のため必要な範囲内で、隣地を使用することができる。ただし、住家については、その居住者の承諾がなければ、立ち入ることはできない。"},
{c:"ken",lv:3,a:false,
 q:"まわりを他人の土地に囲まれて道路に出られない土地の持ち主は、自分にとって最も便利な場所を、お金を払わずに通ることができる。",
 exp:`<p>道路に出られない土地の持ち主は、まわりの土地を通ることができます。でも、通る場所は<mark>まわりの土地にとって損害が最も少ない場所・方法</mark>でなければなりません。</p><p>また、原則として、通る土地の持ち主に<b>償金（つぐないのお金）</b>を払います。</p><p>ただし、土地を分けたり一部を売ったりして道路に出られなくなった場合は、分けた相手の土地だけを、<b>お金を払わずに</b>通れます。</p>`,
 pt:"囲繞地通行：損害が最も少ない場所・方法で、原則償金が必要",
 hon:"他の土地に囲まれて公道に通じない土地の所有者は、自己にとって最も便利な場所を、償金を支払うことなく通行することができる。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"共有している建物の形や働きを大きく変えない小さな変更（軽い変更）は、持分の価格の過半数で決めることができる。",
 exp:`<p>共有物の変更は、原則として<b>共有者全員の同意</b>が必要です。</p><p>でも2023年4月から、<mark>形や働きを大きく変えない「軽い変更」</mark>（砂利道をアスファルトにする、など）は、持分の<b>過半数</b>で決められるようになりました（管理と同じ扱い）。</p>`,
 pt:"共有物の軽微な変更は、持分の過半数で決められる",
 hon:"共有物に変更（その形状又は効用の著しい変更を伴わないものを除く。）を加えるには、他の共有者の同意を得なければならない。"},
{c:"ken",lv:3,a:true,
 q:"共有者の中に、どこにいるかわからない人がいるときは、裁判所の決定を受ければ、その人以外の共有者全員の同意で、共有物を変更できる。",
 exp:`<p>変更には共有者全員の同意が必要ですが、所在がわからない人がいると、いつまでも同意がそろいません。</p><p>そこで、<mark>裁判所の決定</mark>があれば、所在等不明の共有者を除いた全員の同意で変更できるようになりました（2023年4月から）。</p>`,
 pt:"所在等不明の共有者がいても、裁判所の決定で他の全員の同意により変更できる",
 hon:"共有者が他の共有者の所在を知ることができないときは、裁判所は、共有者の請求により、当該他の共有者以外の他の共有者の同意を得て共有物に変更を加えることができる旨の裁判をすることができる。"},
{c:"ken",lv:2,a:true,
 q:"共有者の1人が自分の持分を放棄したときは、その持分は、ほかの共有者のものになる。",
 exp:`<p>共有者の1人が持分を放棄したときや、<b>相続人がいないまま亡くなった</b>とき（特別縁故者への分与もない場合）は、その持分は<mark>ほかの共有者に、持分の割合に応じて</mark>移ります。国のものにはなりません。</p>`,
 pt:"持分の放棄・相続人なしの死亡 → 他の共有者に帰属",
 hon:"共有者の一人が、その持分を放棄したときは、その持分は、他の共有者に帰属する。"},

/* ---- 不法行為・請負・委任・贈与 ---- */
{c:"ken",lv:2,a:true,
 q:"人にけがをさせた人（不法行為をした人）の損害賠償は、請求されなくても、けがをさせたその時から支払いが遅れている（遅延損害金がつく）扱いになる。",
 exp:`<p>契約の代金なら、期限が来るまで遅れにはなりません。でも、<b>不法行為</b>による損害賠償は、<mark>不法行為のときから当然に遅滞</mark>（支払いが遅れている状態）になります。</p><p>被害者を手厚く守るためです。</p>`,
 pt:"不法行為の損害賠償債務は、不法行為の時から遅滞",
 hon:"不法行為に基づく損害賠償債務は、損害の発生と同時に、何らの催告を要することなく、遅滞に陥る。"},
{c:"ken",lv:3,a:false,
 q:"交通事故で、けがをした被害者にも不注意（過失）があった場合でも、裁判所は損害賠償の金額を減らすことはできない。",
 exp:`<p>被害者にも過失があったときは、裁判所は、それを考えて<mark>損害賠償の額を減らすことができます</mark>（<b>過失相殺</b>）。</p><p>たとえば、信号を無視して道路を渡った人がはねられたときなどです。</p>`,
 pt:"被害者に過失があれば、過失相殺で賠償額を減らせる",
 hon:"被害者に過失があったときであっても、裁判所は、これを考慮して損害賠償の額を定めることはできない。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"工事を頼まれた業者（請負人）が工事中に通行人にけがをさせた場合、工事を頼んだ人（注文者）は、頼み方や指示に落ち度がなければ、損害賠償の責任を負わない。",
 exp:`<p>請負人は、注文者の部下ではなく、自分の判断で仕事をします。だから、請負人が人に損害を与えても、<mark>注文者は原則として責任を負いません</mark>。</p><p>ただし、注文や指図に落ち度（過失）があったときは、注文者も責任を負います。会社と従業員の関係（使用者責任）とのちがいに注意しましょう。</p>`,
 pt:"注文者は請負人の不法行為に原則責任なし（注文・指図に過失があれば責任）",
 hon:"注文者は、請負人がその仕事について第三者に加えた損害を賠償する責任を負わない。ただし、注文又は指図についてその注文者に過失があったときは、この限りでない。"},
{c:"ken",lv:3,a:true,
 q:"不法行為による損害賠償の請求権は、被害者が損害と加害者を知らなくても、不法行為のときから20年がたつと、時効で消える。",
 exp:`<p>不法行為の損害賠償請求権の時効は2本立てです。</p><p>①損害と加害者を<b>知った時から3年</b>（人の命や体を傷つけた場合は<b>5年</b>）<br>②<mark>不法行為の時から20年</mark></p><p>どちらか早い方で消えます。</p>`,
 pt:"不法行為：知ってから3年（生命・身体は5年）、行為から20年",
 hon:"不法行為による損害賠償の請求権は、不法行為の時から20年間行使しないときは、時効によって消滅する。"},
{c:"ken",lv:3,a:true,
 q:"家を建てる請負契約で、家がまだ完成していない間は、注文者は、請負人の損害を賠償すれば、いつでも契約を解除できる。",
 exp:`<p>注文者の事情が変わって、家がいらなくなることもあります。</p><p>そこで、<mark>仕事が完成するまでは、注文者は損害を賠償して、いつでも解除</mark>できます。請負人は損害を払ってもらえるので困りません。</p>`,
 pt:"請負：完成前なら、注文者は損害賠償していつでも解除できる",
 hon:"請負人が仕事を完成しない間は、注文者は、いつでも損害を賠償して契約の解除をすることができる。"},
{c:"ken",lv:3,a:false,
 q:"報酬をもらわずに仕事をまかされた人（無償の受任者）は、自分の物を扱うのと同じ程度の注意で仕事をすればよい。",
 exp:`<p>委任を受けた人は、報酬があってもなくても、<mark>善良な管理者の注意（善管注意義務）</mark>で仕事をしなければなりません。プロとして期待される注意です。</p><p>「自分の物と同じ程度の注意」でよいのは、タダで物を預かる人（無償の寄託）などです。</p>`,
 pt:"受任者は無償でも善管注意義務",
 hon:"受任者は、無償で委任を受けた場合には、自己の財産に対するのと同一の注意をもって委任事務を処理すれば足りる。（→ 誤り）"},
{c:"ken",lv:2,a:true,
 q:"書面を作らずに「この土地をあげる」と口約束した贈与は、まだ土地を引き渡していなければ、あげる人ももらう人も解除できる。",
 exp:`<p>口約束だけの贈与は、軽はずみにされることもあるので、<mark>まだ実行していない部分は、どちらからでも解除</mark>できます。</p><p>ただし、すでに<b>引き渡した部分</b>（不動産なら引渡しか登記をした部分）は解除できません。<b>書面</b>で贈与したときは、解除できません。</p>`,
 pt:"書面によらない贈与は、履行が終わっていない部分を解除できる",
 hon:"書面によらない贈与は、各当事者が解除をすることができる。ただし、履行の終わった部分については、この限りでない。"},
{c:"ken",lv:2,a:true,
 q:"仕事をまかせた人（委任者）か、まかされた人（受任者）のどちらかが亡くなると、委任契約は終わる。",
 exp:`<p>委任は、おたがいの信頼で成り立つ契約です。だから、<mark>委任者・受任者のどちらが亡くなっても終わります</mark>。受任者が破産手続開始の決定や後見開始の審判を受けたときも終わります。</p>`,
 pt:"委任は、委任者・受任者の死亡で終了",
 hon:"委任は、委任者又は受任者の死亡によって終了する。"},

/* ---- 売買（契約不適合）・債権 ---- */
{c:"ken",lv:2,a:true,
 q:"買った家に契約と合わない欠陥（契約不適合）があったとき、買主は、売主に直してもらうこと（追完）を求めることができる。",
 exp:`<p>契約の内容に合わないものを渡されたとき、買主はまず<mark>追完</mark>を求められます。追完とは、①修理する、②代わりの物を渡す、③足りない分を渡す、のことです。</p><p>そのほか、代金を減らすこと（代金減額）、損害賠償、契約の解除も求められます。</p>`,
 pt:"契約不適合：追完・代金減額・損害賠償・解除",
 hon:"引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないものであるときは、買主は、売主に対し、目的物の修補による履行の追完を請求することができる。"},
{c:"ken",lv:3,a:true,
 q:"買主が「〇日までに直してください」と期間を決めて頼んだのに、売主がその期間内に直さないときは、買主は、不適合の程度に応じて代金を減らすよう請求できる。",
 exp:`<p>代金減額を求めるには、原則として、<mark>まず期間を決めて追完を求め（催告）、それでも直さないこと</mark>が必要です。</p><p>ただし、直すことが不可能なときや、売主がはっきり「直さない」と言ったときなどは、催告しなくても、すぐに代金減額を求められます。</p>`,
 pt:"代金減額請求は、原則として追完の催告が先",
 hon:"買主が相当の期間を定めて履行の追完の催告をし、その期間内に履行の追完がないときは、買主は、その不適合の程度に応じて代金の減額を請求することができる。"},
{c:"ken",lv:3,a:false,
 q:"契約不適合が、買主の責任（落ち度）で起きたものであっても、買主は売主に修理（追完）を求めることができる。",
 exp:`<p>不適合が<mark>買主の責めに帰すべき事由</mark>によるものなら、自分で招いたことなので、買主は<b>追完も代金減額も求められません</b>。解除もできません。</p>`,
 pt:"買主の責めによる不適合 → 追完・減額・解除はできない",
 hon:"目的物の不適合が買主の責めに帰すべき事由によるものであっても、買主は、履行の追完の請求をすることができる。（→ 誤り）"},
{c:"ken",lv:3,a:false,
 q:"買った土地の面積が契約より足りなかった（数量の不適合）場合も、買主は、不足を知った時から1年以内に売主に知らせなければ、責任を追及できなくなる。",
 exp:`<p>「知った時から1年以内に通知」という制限は、<mark>種類・品質の不適合だけ</mark>のルールです。</p><p>種類や品質の欠陥は、時間がたつと原因がわかりにくくなるためです。<b>数量</b>の不足や、<b>権利</b>の不適合は、はっきりわかるので、この制限はありません（ふつうの時効のルールになります）。</p>`,
 pt:"1年以内の通知が必要なのは「種類・品質」の不適合だけ",
 hon:"売主が数量に関して契約の内容に適合しない目的物を引き渡した場合において、買主がその不適合を知った時から1年以内にその旨を売主に通知しないときは、買主は、その不適合を理由として責任を追及することができない。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"売主が、家を引き渡すときに雨もりがあることを知っていた場合は、買主が知ってから1年以内に通知しなくても、買主は売主の責任を追及できる。",
 exp:`<p>1年以内の通知の制限は、売主を守るためのルールです。でも、<mark>売主が知っていた（または重大な過失で知らなかった）</mark>のに黙っていたなら、守る必要はありません。</p><p>だから、この場合は1年の制限がかかりません。</p>`,
 pt:"売主が悪意・重過失なら、1年の通知期間の制限はない",
 hon:"売主が引渡しの時にその不適合を知り、又は重大な過失によって知らなかったときは、買主は、不適合を知った時から1年以内に通知しなくても、その責任を追及することができる。"},

/* ---- 賃貸借・借地借家 ---- */
{c:"ken",lv:3,a:true,
 q:"借りている部屋の一部が、借主の責任ではない理由で使えなくなった場合、家賃は、使えなくなった部分の割合に応じて、当然に減額される。",
 exp:`<p>使えない部分の家賃まで払うのはおかしいですよね。</p><p>借主の責任でない理由で一部が使えなくなったときは、<mark>請求しなくても当然に</mark>、その割合に応じて家賃が減ります。残りの部分だけでは借りた目的を果たせないときは、借主は契約を解除できます。</p>`,
 pt:"一部が使えなくなれば、賃料は当然に減額",
 hon:"賃借物の一部が滅失その他の事由により使用及び収益をすることができなくなった場合において、それが賃借人の責めに帰することができない事由によるものであるときは、賃料は、その割合に応じて、減額される。"},
{c:"ken",lv:3,a:false,
 q:"借りている家の修理が必要になり、借主が大家さんに知らせたのに、大家さんがちょうどよい期間内に修理しない場合でも、借主が自分で修理することはできない。",
 exp:`<p>修理は大家さんの仕事ですが、次の場合は<mark>借主が自分で修理できます</mark>。</p><p>①修理が必要だと大家さんに知らせた（または大家さんが知っていた）のに、相当の期間内に修理しないとき<br>②急いで直す必要があるとき</p><p>かかった費用（必要費）は、すぐに大家さんに請求できます。</p>`,
 pt:"大家が修繕しない・急迫の事情 → 借主が自分で修繕できる",
 hon:"賃借人が賃貸人に修繕が必要である旨を通知したにもかかわらず、賃貸人が相当の期間内に必要な修繕をしないときであっても、賃借人は、その修繕をすることができない。（→ 誤り）"},
{c:"ken",lv:2,a:true,
 q:"土地や建物を借りる権利（賃借権）を登記しておけば、そのあとに土地や建物を買った人にも、借りる権利を主張できる。",
 exp:`<p>不動産の賃借権も、<mark>登記</mark>をすれば、あとから持ち主になった人に対抗できます（「借りる権利があります」と言えます）。</p><p>ただ、大家さんは登記に協力する義務がないので、実際には借地借家法で、<b>借地は借地上の建物の登記</b>、<b>借家は建物の引渡し</b>で対抗できるようにしています。</p>`,
 pt:"賃借権は登記で対抗できる（借地は建物登記、借家は引渡しでも可）",
 hon:"不動産の賃貸借は、これを登記したときは、その不動産について物権を取得した者その他の第三者に対抗することができる。"},
{c:"ken",lv:3,a:false,
 q:"期間の決まっていないふつうの建物の賃貸借で、大家さんが正当な理由をそなえて解約を申し入れた場合、申入れの日から3か月で契約は終わる。",
 exp:`<p>借地借家法では、大家さんから解約を申し入れたときは、<mark>申入れの日から6か月</mark>たって終わります（正当事由が必要）。</p><p>民法の原則（3か月）より長くして、借主を守っています。借主から申し入れたときは、民法どおり3か月です。</p>`,
 pt:"借家：大家からの解約申入れは6か月（正当事由が必要）、借主からは3か月",
 hon:"建物の賃貸人が賃貸借の解約の申入れをした場合においては、建物の賃貸借は、解約の申入れの日から3月を経過することによって終了する。（→ 誤り）"},
{c:"ken",lv:3,a:true,
 q:"期間1年以上の定期建物賃貸借では、大家さんは、期間が終わる1年前から6か月前までの間に、借主に「期間が終わります」と通知しなければ、期間の終了を借主に主張できない。",
 exp:`<p>定期借家は更新がありませんが、借主が引っ越しの準備をできるように、<mark>1年前から6か月前まで</mark>に終了の通知をする必要があります。</p><p>通知が遅れたときは、通知の日から<b>6か月</b>たてば、終了を主張できます。</p>`,
 pt:"定期借家（1年以上）：満了の1年前〜6か月前に終了の通知",
 hon:"期間が1年以上である定期建物賃貸借においては、建物の賃貸人は、期間の満了の1年前から6月前までの間に建物の賃借人に対し期間の満了により建物の賃貸借が終了する旨の通知をしなければ、その終了を建物の賃借人に対抗することができない。"},

/* ---- 相続 ---- */
{c:"ken",lv:3,a:true,
 q:"遺産分割の前でも、相続人は、亡くなった人の預金の一部を、ほかの相続人の同意なしに、ひとりで引き出すことができる。",
 exp:`<p>葬儀費用や生活費が急に必要になることがあります。そこで、遺産分割の前でも、<mark>一定額までなら各相続人がひとりで引き出せます</mark>。</p><p>金額は「相続開始の時の預金額 × 3分の1 × その相続人の法定相続分」（1つの金融機関で150万円まで）です。</p>`,
 pt:"遺産分割前の預貯金の払戻し：預金額×1/3×法定相続分（1金融機関150万円まで）",
 hon:"各共同相続人は、遺産に属する預貯金債権のうち、相続開始の時の債権額の3分の1に当該共同相続人の法定相続分を乗じた額については、単独でその権利を行使することができる。"},
{c:"ken",lv:3,a:true,
 q:"亡くなった人を殺して刑に処せられた人は、相続人になることができない。",
 exp:`<p>これを<b>相続欠格</b>といいます。被相続人を殺したり、遺言書を偽造・破棄したりした人は、<mark>手続きなしに当然に</mark>相続人ではなくなります。</p><p>なお、欠格になった人の子は、<b>代襲相続</b>できます（相続放棄の場合は代襲相続しない点とのちがいに注意）。</p>`,
 pt:"相続欠格は当然に相続権を失う。欠格者の子は代襲相続できる",
 hon:"故意に被相続人を死亡するに至らせたために刑に処せられた者は、相続人となることができない。"},
{c:"ken",lv:3,a:true,
 q:"前に書いた遺言と内容がくい違う新しい遺言を書いた場合、くい違う部分については、前の遺言を取り消した（撤回した）ものとみなされる。",
 exp:`<p>遺言は、<mark>いつでも、遺言の方式で撤回</mark>できます。</p><p>新しい遺言が前の遺言とくい違うときは、くい違う部分は前の遺言を撤回したとみなされ、<b>新しい方が優先</b>します。公正証書遺言を、あとの自筆証書遺言で撤回することもできます。</p>`,
 pt:"遺言はいつでも撤回できる。くい違えば後の遺言が優先",
 hon:"前の遺言が後の遺言と抵触するときは、その抵触する部分については、後の遺言で前の遺言を撤回したものとみなす。"},
{c:"ken",lv:3,a:true,
 q:"相続が始まってから10年を過ぎて遺産分割をする場合は、原則として、生前にもらった援助（特別受益）や介護などの貢献（寄与分）を考えずに、法定相続分で分ける。",
 exp:`<p>遺産分割が何十年も放っておかれると、所有者がわからない土地が増えてしまいます。</p><p>そこで2023年4月から、<mark>相続開始から10年を過ぎると、原則として特別受益や寄与分を主張できなく</mark>なり、法定相続分（遺言で指定があれば指定相続分）で分けることになりました。早く分けるよう促すためです。</p>`,
 pt:"相続開始から10年経過後の遺産分割は、原則として法定相続分で",
 hon:"相続開始の時から10年を経過した後にする遺産の分割については、原則として、特別受益及び寄与分の規定を適用しない。"},
{c:"ken",lv:3,a:true,
 q:"夫が亡くなったとき、夫の家にタダで住んでいた妻は、遺産分割で家の持ち主が決まるまで（少なくとも夫が亡くなってから6か月間）は、タダで住み続けられる。",
 exp:`<p>これを<b>配偶者短期居住権</b>といいます。遺言や遺産分割で決める「配偶者居住権」とちがい、<mark>条件を満たせば当然に</mark>生まれます。</p><p>期間は、遺産分割で家の持ち主が決まる日か、相続開始から<b>6か月</b>を過ぎる日の、遅い方までです。</p>`,
 pt:"配偶者短期居住権：当然に発生、少なくとも相続開始から6か月",
 hon:"配偶者は、被相続人の財産に属した建物に相続開始の時に無償で居住していた場合には、遺産の分割により建物の帰属が確定した日又は相続開始の時から6箇月を経過する日のいずれか遅い日までの間、その建物を無償で使用する権利を有する。"},

/* ---- 物権・抵当権・登記 ---- */
{c:"ken",lv:3,a:true,
 q:"相続した土地のうち、自分の法定相続分の部分については、登記をしていなくても、ほかの人に「自分のものだ」と主張できる。",
 exp:`<p>相続で手に入れた権利のうち、<mark>法定相続分までの部分</mark>は、登記がなくても第三者に対抗できます。</p><p>一方、遺言や遺産分割で<b>法定相続分を超えて</b>もらった部分は、<b>登記をしないと</b>第三者に対抗できません。</p>`,
 pt:"相続：法定相続分までは登記なしで対抗できる、超える部分は登記が必要",
 hon:"相続による権利の承継は、法定相続分を超える部分については、登記を備えなければ、第三者に対抗することができない。"},
{c:"ken",lv:3,a:true,
 q:"抵当権を持っている銀行は、抵当権のついた建物の家賃にも、支払われる前に差し押さえれば、抵当権の効力を及ぼすことができる（物上代位）。",
 exp:`<p>抵当権は、抵当に入れた物が形を変えたもの（売った代金、貸した家賃、火災保険金など）にも効力が及びます。これを<b>物上代位</b>といいます。</p><p>ただし、<mark>お金が支払われる前に差し押さえる</mark>必要があります。</p>`,
 pt:"抵当権は賃料にも物上代位できる（払渡し前に差押え）",
 hon:"抵当権者は、抵当不動産の賃料債権に対しても、その払渡し前に差押えをして、物上代位権を行使することができる。"},
{c:"ken",lv:2,a:true,
 q:"となりの土地を通るための権利（通行地役権）は、自分の土地（要役地）を売ると、買った人に一緒に移る。",
 exp:`<p>地役権は、自分の土地を便利にするため、他人の土地を使う権利です。</p><p>地役権は土地にくっついた権利なので、<mark>要役地の所有権と一緒に移ります</mark>。地役権だけを切り離して売ることはできません。</p>`,
 pt:"地役権は要役地の所有権とともに移転する",
 hon:"地役権は、要役地の所有権に従たるものとして、その所有権とともに移転する。"}
);

/* 第7版：宅建業法・法令上の制限・税その他の補充と、統計（2026年度試験用） */
Q.push(
/* ================= 宅建業法 ================= */
{c:"gyo",lv:2,a:true,
 q:"宅建業の免許の有効期間は5年で、更新するときは、有効期間が終わる日の90日前から30日前までに申請する。",
 exp:`<p>免許の有効期間は<mark>5年</mark>です。続けて仕事をしたいときは、<mark>満了の90日前から30日前まで</mark>に更新を申請します。</p><p>宅建士証の有効期間も5年ですが、こちらは更新の申請期間の決まりがなく、法定講習を受けるのがポイントです。</p>`,
 pt:"免許：有効期間5年、更新は満了の90日前〜30日前",
 hon:"免許の更新を受けようとする者は、免許の有効期間満了の日の90日前から30日前までの間に免許申請書を提出しなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"免許の更新を期間内に申請したのに、有効期間が終わる日までに許可・不許可が決まらないときは、決まるまでの間、古い免許はまだ有効である。",
 exp:`<p>役所の事情で処分が遅れたのに、業者が仕事をできなくなるのは困ります。</p><p>そこで、<mark>処分があるまで、古い免許が効力をもちます</mark>。更新された場合、新しい免許の有効期間は、古い免許の満了日の翌日から5年です。</p>`,
 pt:"更新の処分が遅れても、処分まで旧免許は有効",
 hon:"免許の更新の申請があった場合において、有効期間の満了の日までにその申請について処分がなされないときは、従前の免許は、有効期間の満了後もその処分がなされるまでの間は、なお効力を有する。"},
{c:"gyo",lv:2,a:false,
 q:"個人の宅建業者が亡くなった場合、その相続人は、亡くなった日から30日以内に、免許権者に届け出なければならない。",
 exp:`<p>家族が亡くなったことを、すぐに知るとは限りません。そのため、届出の期限は<mark>死亡を知った日から30日以内</mark>です。</p><p>ほかの廃業などの届出（破産・合併・解散・廃業）は、その日から30日以内です。死亡だけ「知った日から」と覚えましょう。</p>`,
 pt:"業者の死亡の届出：相続人が、死亡を知った日から30日以内",
 hon:"個人である宅地建物取引業者が死亡した場合、その相続人は、死亡の日から30日以内に、その旨を免許権者に届け出なければならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"法人の宅建業者が合併で消えた場合は、消えた法人の代表役員だった人が、合併の日から30日以内に届け出る。",
 exp:`<p>合併で消えた会社には、もう届け出る人がいません。そこで、<mark>消えた法人の代表役員だった人</mark>が届け出ます。</p><p>ちなみに、破産は破産管財人、解散（合併・破産以外）は清算人、廃業は法人の代表役員が届け出ます。</p>`,
 pt:"合併で消滅：消滅した法人の代表役員だった者が30日以内に届出",
 hon:"宅地建物取引業者である法人が合併により消滅した場合には、その法人を代表する役員であった者が、その日から30日以内に、その旨を免許権者に届け出なければならない。"},
{c:"gyo",lv:2,a:true,
 q:"宅建業者は、事務所ごとに、宅建業の仕事をする人5人に1人以上の割合で、成年者である専任の宅建士を置かなければならない。",
 exp:`<p>お客さんに大事な説明ができるように、<mark>事務所には「5人に1人以上」</mark>の専任の宅建士が必要です。</p><p>モデルルームなど、契約を結ぶ案内所には<b>1人以上</b>でかまいません。</p>`,
 pt:"専任の宅建士：事務所は5人に1人以上、案内所等は1人以上",
 hon:"宅地建物取引業者は、その事務所ごとに、その業務に従事する者の数に対し5分の1以上の割合で、成年者である専任の宅地建物取引士を置かなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"専任の宅建士が退職して人数が足りなくなったときは、宅建業者は2週間以内に、新しい人を置くなどの必要な措置をとらなければならない。",
 exp:`<p>専任の宅建士が足りなくなったら、<mark>2週間以内</mark>に補充などをしなければなりません。</p><p>「2週間」の期限は、ほかに、保証協会に加入したあとの追加の分担金の納付などにも出てきます。</p>`,
 pt:"専任の宅建士の不足：2週間以内に補充",
 hon:"宅地建物取引業者は、既存の事務所等が専任の宅地建物取引士の設置要件を欠くこととなったときは、2週間以内に、必要な措置を執らなければならない。"},
{c:"gyo",lv:2,a:true,
 q:"宅建士証を更新するには、申請前6か月以内に行われる、都道府県知事が指定する講習（法定講習）を受けなければならない。",
 exp:`<p>宅建士証の有効期間は<mark>5年</mark>です。新しく交付・更新を受けるときは、原則として<mark>申請前6か月以内の法定講習</mark>を受けます。</p><p>ただし、試験に合格してから1年以内に交付を受ける場合は、講習は不要です。</p>`,
 pt:"宅建士証：5年、交付・更新は申請前6か月以内の法定講習（合格後1年以内は不要）",
 hon:"宅地建物取引士証の交付を受けようとする者は、試験合格後1年以内に交付を受ける場合を除き、登録をしている都道府県知事が指定する講習で交付の申請前6月以内に行われるものを受講しなければならない。"},
{c:"gyo",lv:3,a:false,
 q:"宅建士は、重要事項の説明のときには宅建士証を見せなければならないが、それ以外の場面で取引の関係者から見せるように頼まれても、見せる義務はない。",
 exp:`<p>宅建士証を見せる場面は2つあります。</p><p>①<b>重要事項の説明のとき</b>：頼まれなくても、必ず見せる。<br>②<mark>取引の関係者から頼まれたとき</mark>：見せなければならない。</p><p>見せなかったときの罰は、①は10万円以下の過料、②は罰則なし（指示処分などはありうる）です。</p>`,
 pt:"宅建士証の提示：重説時は必ず、取引関係者から請求があれば必ず",
 hon:"宅地建物取引士は、取引の関係者から請求があったときであっても、宅地建物取引士証を提示する必要はない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"宅建士が、登録している都道府県とは別の都道府県にある事務所で働くことになった場合、登録の移転を申請することができるが、しなければならないわけではない。",
 exp:`<p>登録の移転は<mark>「できる」であって、義務ではありません</mark>。</p><p>移転すると、古い宅建士証は効力を失い、新しい知事から交付される宅建士証の有効期間は、<b>古い宅建士証の残りの期間</b>になります。なお、事務禁止処分を受けている間は、移転できません。</p>`,
 pt:"登録の移転は任意。新しい宅建士証の有効期間は残存期間",
 hon:"宅地建物取引士は、登録をしている都道府県知事の管轄する都道府県以外の都道府県に所在する事務所の業務に従事し、又は従事しようとするときは、登録の移転の申請をすることができる。"},
{c:"gyo",lv:2,a:false,
 q:"まだ完成していない建物でも、建築確認を申請中であれば、宅建業者は売り出しの広告を出すことができる。",
 exp:`<p>未完成の物件の広告は、<mark>建築確認（開発許可など）を受けた後</mark>でなければ出せません。</p><p>申請中は、確認が下りるかわからないからです。<b>契約</b>（売買）も同じく、確認を受けた後でなければ結べません。ただし、<b>貸借の代理・媒介の契約</b>は、確認前でも結べます。</p>`,
 pt:"未完成物件の広告は、建築確認・開発許可などの後",
 hon:"宅地建物取引業者は、建築確認の申請中の建物について、その売買の広告をすることができる。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"宅建業者は、広告を出すときに、自分が売主なのか、代理なのか、媒介（仲介）なのか（取引態様の別）をはっきり示さなければならない。注文を受けたときも、すぐに示す必要がある。",
 exp:`<p>取引態様によって、報酬（仲介手数料）がかかるかどうかが変わるので、お客さんにとって大事な情報です。</p><p>そのため、<mark>広告のとき</mark>と、<mark>注文を受けたとき</mark>の両方で明示します。広告で示していても、注文のときに改めて示す必要があります。</p>`,
 pt:"取引態様の明示：広告時と注文時の両方",
 hon:"宅地建物取引業者は、宅地又は建物の売買に関する注文を受けたときは、遅滞なく、その注文をした者に対し、取引態様の別を明らかにしなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"実際よりもかなり有利だと誤解させる広告（誇大広告）は、だまされた人が1人もいなくても、広告を出しただけで宅建業法違反になる。",
 exp:`<p>誇大広告は、<mark>広告を出した時点で違反</mark>です。実際に契約した人や損をした人がいなくても関係ありません。</p><p>売るつもりのない物件で客を集める「おとり広告」も、誇大広告として禁止されています。</p>`,
 pt:"誇大広告は、表示しただけで違反（被害がなくても）",
 hon:"誇大広告等の禁止に違反する広告は、これによって実際に誤認した者や損害を受けた者がいなければ、宅地建物取引業法違反とはならない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"重要事項の説明は、相手の承諾があれば、テレビ会議のような、おたがいの顔と画面を見ながらやりとりできる方法（IT重説）で行うことができる。",
 exp:`<p>IT重説では、①映像と音声で双方向にやりとりできること、②重要事項説明書をあらかじめ相手に渡しておくこと（電磁的方法も可）、③宅建士証を画面で見せること、などが必要です。</p><p>売買・貸借どちらでも<mark>行えます</mark>。</p>`,
 pt:"IT重説：双方向の映像、書面は事前に交付、宅建士証を画面で提示",
 hon:"重要事項の説明は、テレビ会議等のITを活用し、相手方が宅地建物取引士証を画面上で視認できたことを確認するなどの要件を満たせば、対面でなくても行うことができる。"},
{c:"gyo",lv:3,a:false,
 q:"宅建業者どうしの取引（買主も宅建業者）でも、重要事項の説明を省略することはできない。",
 exp:`<p>買主（借主）がプロの<b>宅建業者</b>のときは、<mark>重要事項の説明は不要</mark>です。</p><p>ただし、<b>重要事項説明書（35条書面）の交付は必要</b>です（宅建士の記名も必要）。説明はいらない、書面はいる、と覚えましょう。</p>`,
 pt:"相手が宅建業者：35条の説明は不要、書面の交付は必要",
 hon:"宅地建物取引業者は、相手方が宅地建物取引業者である場合であっても、重要事項の説明を省略することはできない。（→ 誤り）"},
{c:"gyo",lv:3,a:true,
 q:"37条書面（契約後に渡す書面）には宅建士の記名が必要だが、宅建士がその内容を説明する必要はない。",
 exp:`<p>37条書面は、契約した内容を確認するための書面です。</p><p><mark>宅建士の記名は必要</mark>ですが、<mark>説明は不要</mark>です（35条の重要事項は、説明も必要）。相手が宅建業者でも、37条書面の交付は省略できません。</p>`,
 pt:"37条書面：宅建士の記名が必要、説明は不要",
 hon:"宅地建物取引業者は、37条書面を交付するに当たり、宅地建物取引士をして、その書面に記名させなければならないが、その内容を説明させる必要はない。"},
{c:"gyo",lv:3,a:true,
 q:"一般媒介契約を結んだときも、宅建業者は、依頼者に媒介契約の内容を書いた書面（電磁的方法も可）を渡さなければならない。",
 exp:`<p>媒介契約書面（34条の2の書面）は、<mark>一般・専任・専属専任のどれでも</mark>交付が必要です（宅地・建物の<b>売買・交換</b>の媒介の場合。貸借は不要）。</p><p>書面には、<b>宅建業者</b>の記名押印が必要です（宅建士ではありません）。</p>`,
 pt:"売買・交換の媒介契約書面：一般媒介でも必要、業者が記名押印",
 hon:"宅地建物取引業者は、宅地の売買の媒介契約を締結したときは、一般媒介契約であっても、遅滞なく、所定の事項を記載した書面を作成して記名押印し、依頼者にこれを交付しなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"代金800万円以下の安い土地・建物の売買の仲介では、宅建業者は、あらかじめ説明して合意を得れば、依頼者から最大30万円（税抜き）まで報酬を受け取れる。",
 exp:`<p>空き家などの安い物件は、ふつうの計算だと報酬が少なく、仲介してもらいにくくなっていました。</p><p>そこで2024年7月から、<mark>代金800万円以下の宅地・建物</mark>の売買・交換の媒介では、現地調査などの費用も含めて、依頼者1人から<mark>30万円（消費税込みで33万円）</mark>まで受け取れるようになりました（事前の説明と合意が必要）。</p>`,
 pt:"低廉な空家等（800万円以下）：依頼者1人から最大30万円（税抜）",
 hon:"代金が800万円以下の宅地又は建物の売買の媒介をする場合、宅地建物取引業者は、あらかじめ依頼者に説明し合意を得れば、依頼者から30万円に消費税等相当額を加えた額まで報酬を受領できる。"},
{c:"gyo",lv:3,a:true,
 q:"住宅の貸借の仲介で、大家さんと借主の両方から報酬をもらう場合、受け取れる報酬の合計は、家賃の1か月分（税抜き）までである。",
 exp:`<p>貸借の媒介の報酬は、<mark>双方から受け取る合計で家賃1か月分</mark>（＋消費税）までです。</p><p>さらに<b>居住用の建物</b>では、依頼者の一方から受け取れるのは、原則として<b>家賃の半月分</b>まで（依頼者の承諾があれば1か月分まで）です。</p>`,
 pt:"貸借の媒介：合計で賃料1か月分。居住用は一方から半月分（承諾で1か月分）",
 hon:"宅地建物取引業者が居住用建物の貸借の媒介に関して依頼者の一方から受けることのできる報酬の額は、依頼者の承諾を得ている場合を除き、借賃の1月分の2分の1に相当する額以内とする。"},
{c:"gyo",lv:2,a:true,
 q:"宅建業者に対する業務停止処分は、最も長くて1年以内である。",
 exp:`<p>監督処分は、軽い順に<b>指示処分</b> → <b>業務停止処分</b>（<mark>1年以内</mark>） → <b>免許取消処分</b>です。</p><p>宅建士への処分は、指示 → <b>事務禁止</b>（1年以内） → 登録消除です。</p>`,
 pt:"業務停止・事務禁止は1年以内",
 hon:"免許権者は、宅地建物取引業者が業務に関し他の法令に違反した場合など一定の場合には、当該宅地建物取引業者に対し、1年以内の期間を定めて、その業務の全部又は一部の停止を命ずることができる。"},
{c:"gyo",lv:3,a:true,
 q:"宅建業の免許を受けてから1年以内に仕事を始めないときは、免許権者は、その免許を取り消さなければならない。",
 exp:`<p>免許を取ったのに仕事をしない、または<b>引き続き1年以上</b>仕事を休んでいるときは、<mark>必ず免許を取り消さなければなりません</mark>（必要的取消し）。</p><p>「取り消すことができる」ではなく「取り消さなければならない」に注意しましょう。</p>`,
 pt:"免許後1年以内に事業を開始しない・1年以上休止 → 必ず取消し",
 hon:"免許権者は、宅地建物取引業者が免許を受けてから1年以内に事業を開始せず、又は引き続いて1年以上事業を休止したときは、当該免許を取り消さなければならない。"},
{c:"gyo",lv:2,a:true,
 q:"新築住宅を売る宅建業者は、買主が宅建業者でなければ、売った住宅の欠陥を直すお金を確保するため、保証金の供託か保険への加入をしなければならない。",
 exp:`<p>これは<b>住宅瑕疵担保履行法</b>のルールです。新築住宅の<b>構造の主要な部分と雨水の浸入を防ぐ部分</b>の欠陥について、10年間の責任を果たせるように、<mark>資力確保措置</mark>（保証金の供託か保険）が必要です。</p><p>買主が<b>宅建業者</b>のときは不要です。</p>`,
 pt:"新築住宅を売る業者：資力確保措置（供託か保険）。買主が業者なら不要",
 hon:"宅地建物取引業者は、自ら売主として新築住宅を宅地建物取引業者でない買主に販売する場合、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結を行わなければならない。"},
{c:"gyo",lv:3,a:true,
 q:"新築住宅を売った宅建業者は、毎年3月31日の基準日の時点の資力確保措置の状況を、基準日から3週間以内に免許権者に届け出なければならない。",
 exp:`<p>基準日は<mark>年1回、3月31日</mark>です。届出は<mark>基準日から3週間以内</mark>です。</p><p>届け出なかったときは、基準日の翌日から<b>50日</b>を過ぎると、新しく新築住宅の売買契約を結べなくなります。</p>`,
 pt:"資力確保措置の届出：基準日（3/31）から3週間以内",
 hon:"新築住宅を引き渡した宅地建物取引業者は、基準日ごとに、当該基準日に係る住宅販売瑕疵担保保証金の供託及び住宅販売瑕疵担保責任保険契約の締結の状況について、基準日から3週間以内に、免許権者に届け出なければならない。"},
{c:"gyo",lv:3,a:false,
 q:"保証金を供託している宅建業者は、供託所の場所などを、新築住宅の売買契約を結んだ後に、買主に説明すればよい。",
 exp:`<p>供託所の所在地などは、<mark>売買契約を結ぶ前まで</mark>に、書面（買主の承諾があれば電磁的方法）を交付して説明しなければなりません。</p>`,
 pt:"供託所の所在地等の説明は、契約締結前まで",
 hon:"住宅販売瑕疵担保保証金の供託をしている宅地建物取引業者は、供託所の所在地等について、売買契約を締結した後、遅滞なく、買主に説明すれば足りる。（→ 誤り）"},
{c:"gyo",lv:2,a:true,
 q:"宅建業者は、従業者に従業者証明書を持たせなければならず、事務所ごとに従業者名簿を置き、最後の記載の日から10年間保存しなければならない。",
 exp:`<p><b>従業者証明書</b>：仕事中は常に携帯させる。取引の関係者から頼まれたら見せる（宅建士証で代えることはできない）。</p><p><b>従業者名簿</b>：事務所ごとに置き、<mark>最終の記載から10年間</mark>保存。</p><p><b>帳簿</b>：事業年度末に閉鎖し、閉鎖後<b>5年間</b>（自ら売主の新築住宅は<b>10年間</b>）保存。</p>`,
 pt:"従業者名簿10年、帳簿5年（自ら売主の新築住宅は10年）",
 hon:"宅地建物取引業者は、その事務所ごとに、従業者名簿を備え、最終の記載をした日から10年間保存しなければならない。"},

/* ================= 法令上の制限 ================= */
{c:"hou",lv:2,a:false,
 q:"市街化調整区域には、原則として用途地域を定める。",
 exp:`<p>市街化調整区域は、<mark>市街化をおさえる区域</mark>です。だから、原則として用途地域は<b>定めません</b>。</p><p>一方、<b>市街化区域</b>には、少なくとも用途地域を<b>定めます</b>。</p>`,
 pt:"市街化区域：用途地域を定める／市街化調整区域：原則定めない",
 hon:"市街化調整区域については、原則として用途地域を定めるものとする。（→ 誤り）"},
{c:"hou",lv:3,a:true,
 q:"地区計画の区域内で、建物を建てたり土地の形を変えたりするときは、原則として、工事を始める30日前までに市町村長に届け出なければならない。",
 exp:`<p>地区計画は、街並みをそろえるための、小さな地区単位の計画です。</p><p>区域内で建築や土地の区画形質の変更をするときは、<mark>着手の30日前までに市町村長に届出</mark>が必要です（許可ではなく届出）。</p>`,
 pt:"地区計画の区域内：着手の30日前までに市町村長に届出",
 hon:"地区計画の区域のうち地区整備計画が定められている区域内において、建築物の建築等を行おうとする者は、原則として、当該行為に着手する日の30日前までに、市町村長に届け出なければならない。"},
{c:"hou",lv:3,a:true,
 q:"市街化区域の中で、農業用の倉庫を建てるために1,000㎡以上の開発行為をするときは、開発許可が必要である。",
 exp:`<p>農林漁業用の建物のための開発行為は、市街化調整区域などでは許可不要の例外があります。</p><p>でも<mark>市街化区域では、農林漁業用の例外はありません</mark>。1,000㎡以上なら許可が必要です。</p>`,
 pt:"市街化区域には農林漁業用の例外がない（1,000㎡以上は許可）",
 hon:"市街化区域内において、農業を営む者の居住の用に供する建築物の建築の用に供する目的で行う開発行為で、その規模が1,000㎡以上のものは、開発許可を受ける必要がある。"},
{c:"hou",lv:3,a:true,
 q:"駅舎や図書館、公民館など、公益上必要な建物を建てるための開発行為は、面積にかかわらず、開発許可が不要である。",
 exp:`<p>駅舎・図書館・公民館・変電所などの<mark>公益上必要な建築物</mark>のための開発行為は、どこでも、どんな広さでも<b>許可不要</b>です。</p><p>ただし、<b>学校・病院・社会福祉施設</b>は、この例外に入りません（許可が必要）。</p>`,
 pt:"駅舎・図書館・公民館などは許可不要。学校・病院・福祉施設は必要",
 hon:"図書館、公民館等の公益上必要な建築物の建築の用に供する目的で行う開発行為については、開発許可は不要である。"},
{c:"hou",lv:3,a:false,
 q:"開発許可を受けた土地では、工事完了の公告がある前でも、自由に建物を建てることができる。",
 exp:`<p>開発許可を受けた土地では、<mark>工事完了の公告があるまでは、原則として建物を建てられません</mark>。</p><p>例外：工事用の仮設の建物、知事が支障がないと認めたもの、開発に同意していない土地の所有者が建てるもの。</p>`,
 pt:"開発許可の土地：完了公告前は原則として建築できない",
 hon:"開発許可を受けた開発区域内の土地においては、工事完了の公告があるまでの間であっても、建築物を自由に建築することができる。（→ 誤り）"},
{c:"hou",lv:2,a:true,
 q:"建物の敷地は、原則として、幅4m以上の道路に2m以上接していなければならない。",
 exp:`<p>火事のときに消防車が入れるように、<mark>幅4m以上の道路に2m以上接する</mark>ことが必要です（接道義務）。</p><p>これは都市計画区域・準都市計画区域の中だけのルールです。</p>`,
 pt:"接道義務：幅4m以上の道路に2m以上接する",
 hon:"建築物の敷地は、原則として、道路に2m以上接しなければならない。"},
{c:"hou",lv:3,a:true,
 q:"第一種低層住居専用地域では、建物の高さは、都市計画で定める10mか12mまでに制限される。",
 exp:`<p>低層の住宅の環境を守るため、<b>第一種・第二種低層住居専用地域</b>と<b>田園住居地域</b>では、建物の高さが<mark>10mか12m</mark>（都市計画で決める）までに制限されます（絶対高さの制限）。</p>`,
 pt:"低層住居専用地域・田園住居地域：高さ10mか12mまで",
 hon:"第一種低層住居専用地域内においては、建築物の高さは、原則として、10m又は12mのうち当該地域に関する都市計画において定められた建築物の高さの限度を超えてはならない。"},
{c:"hou",lv:2,a:false,
 q:"住宅の地下室の床面積は、どんな場合でも、容積率の計算に使う延べ面積に全部入れなければならない。",
 exp:`<p>天井が地盤面から1m以下の高さにある住宅の地下室は、<mark>住宅部分の床面積の3分の1まで</mark>、延べ面積に入れなくてよいことになっています。</p><p>また、共同住宅の<b>共用の廊下・階段</b>や<b>エレベーターの昇降路</b>の床面積も、延べ面積に入れません。</p>`,
 pt:"住宅の地下室は住宅部分の1/3まで不算入。共用廊下・階段・EVも不算入",
 hon:"住宅の地階で一定のものの床面積は、容積率の算定の基礎となる延べ面積に、当該建築物の住宅の用途に供する部分の床面積の合計の3分の1を限度として算入しない。"},
{c:"hou",lv:3,a:true,
 q:"1つの建物が防火地域と準防火地域にまたがっている場合は、原則として、建物全体に防火地域の規制がかかる。",
 exp:`<p>建物が2つの地域にまたがるときは、<mark>厳しい方の地域の規制</mark>が、建物全体にかかります（防火壁で区切られている場合を除く）。</p><p>用途地域がまたがる場合（過半の地域のルール）とのちがいに注意しましょう。</p>`,
 pt:"防火・準防火にまたがる建物 → 全体に厳しい方（防火地域）",
 hon:"建築物が防火地域及び準防火地域にわたる場合においては、原則として、その全部について防火地域内の建築物に関する規定を適用する。"},
{c:"hou",lv:3,a:true,
 q:"2025年4月から、木造2階建ての住宅を大規模に修繕する場合は、都市計画区域の外でも建築確認が必要になった。",
 exp:`<p>2025年4月の建築基準法の改正で、いわゆる「4号特例」が縮小されました。</p><p><b>木造2階建て</b>や、<b>延べ面積200㎡を超える木造平屋</b>は「新2号建築物」となり、<mark>全国どこでも、新築・増改築・大規模の修繕・模様替えに建築確認が必要</mark>です。</p><p>延べ面積200㎡以下の平屋（新3号建築物）は、都市計画区域などの中で新築するときだけ確認が必要です。</p>`,
 pt:"2025年4月〜：木造2階建て・200㎡超の平屋は全国で確認（大規模修繕も）",
 hon:"木造2階建ての住宅について大規模の修繕をしようとする場合、都市計画区域外であっても、建築確認を受ける必要がある。"},
{c:"hou",lv:3,a:true,
 q:"土地区画整理事業で仮換地が指定されると、もとの土地の持ち主は、仮換地を使えるようになり、もとの土地は使えなくなる。",
 exp:`<p>仮換地は、工事の間に「とりあえず使う土地」です。</p><p>指定されると、<mark>仮換地を使用・収益でき</mark>、<b>もとの土地は使用・収益できなく</b>なります。ただし、もとの土地の<b>所有権はそのまま</b>なので、売ったり抵当権をつけたりはできます。</p>`,
 pt:"仮換地：仮換地を使う、従前の宅地は使えない（売買・抵当はできる）",
 hon:"仮換地が指定された場合においては、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地について、従前の宅地と同じ内容の使用又は収益をすることができる。"},
{c:"hou",lv:3,a:true,
 q:"換地処分の公告があった日の翌日から、換地は、もとの土地とみなされる。",
 exp:`<p>換地処分の公告があると、その<mark>翌日</mark>から、新しい土地（換地）はもとの土地と同じものとみなされます。</p><p>公告があった日の<b>終わり</b>に消える権利（もとの土地にあった地役権の一部など）と、<b>翌日</b>に生まれる権利の区別が、試験でよく問われます。</p>`,
 pt:"換地処分の公告の翌日から、換地は従前の宅地とみなされる",
 hon:"換地処分の公告があった場合においては、換地計画において定められた換地は、その公告があった日の翌日から従前の宅地とみなされる。"},
{c:"hou",lv:2,a:false,
 q:"市街化区域の中にある農地を宅地にする場合も、農地法4条の許可が必要である。",
 exp:`<p>市街化区域は、市街化を進める区域です。だから<mark>市街化区域内の農地の転用は、あらかじめ農業委員会に届け出れば、許可はいりません</mark>（4条・5条とも）。</p><p>3条（農地のまま売る）には、この特例はありません。</p>`,
 pt:"市街化区域内の転用（4条・5条）は農業委員会への届出でOK。3条は特例なし",
 hon:"市街化区域内にある農地を、あらかじめ農業委員会に届け出て転用する場合でも、農地法4条の許可を受けなければならない。（→ 誤り）"},
{c:"hou",lv:3,a:true,
 q:"相続で農地を取得した場合は、農地法3条の許可はいらないが、遅れることなく農業委員会に届け出なければならない。",
 exp:`<p>相続は自分の意思ではないので、<mark>3条の許可は不要</mark>です。</p><p>ただし、だれが農地を持っているかを把握するため、<mark>遅滞なく農業委員会に届け出</mark>ます。</p>`,
 pt:"相続による農地の取得：許可不要、農業委員会に届出",
 hon:"相続により農地の所有権を取得した者は、農地法3条の許可を受ける必要はないが、遅滞なく、その旨を農業委員会に届け出なければならない。"},
{c:"hou",lv:3,a:true,
 q:"国土利用計画法の事後届出は、土地を買った人が、契約を結んだ日から2週間以内に、市町村長を通して都道府県知事に届け出る。",
 exp:`<p>事後届出は、<mark>権利を取得した人（買主）</mark>が、<mark>契約の日から2週間以内</mark>に行います。</p><p>届出が必要な広さ：市街化区域は<b>2,000㎡以上</b>、それ以外の都市計画区域は<b>5,000㎡以上</b>、都市計画区域外は<b>1万㎡以上</b>。</p>`,
 pt:"事後届出：買主が契約から2週間以内（2,000・5,000・1万㎡）",
 hon:"土地売買等の契約を締結した場合には、当事者のうち当該契約による権利取得者は、その契約を締結した日から起算して2週間以内に、市町村長を経由して、都道府県知事に届け出なければならない。"},
{c:"hou",lv:3,a:true,
 q:"建物を建てる敷地が、2つの用途地域にまたがっている場合は、敷地の過半（半分より多く）が属する用途地域の建築制限が、敷地全体にかかる。",
 exp:`<p>用途制限（何を建ててよいか）は、<mark>敷地の過半が属する地域のルール</mark>を、敷地全体に当てはめます。</p><p>一方、<b>建ぺい率・容積率</b>は、それぞれの地域の面積の割合で計算して合計します（加重平均）。<b>防火地域</b>は厳しい方。この3つのちがいが大切です。</p>`,
 pt:"用途制限は過半の地域、建ぺい率・容積率は加重平均、防火は厳しい方",
 hon:"建築物の敷地が2以上の用途地域にわたる場合においては、その敷地の過半の属する地域の用途規制に関する規定が適用される。"},

/* ================= 税・その他 ================= */
{c:"zei",lv:2,a:true,
 q:"相続で土地や建物を手に入れた場合には、不動産取得税はかからない。",
 exp:`<p>不動産取得税は、売買・贈与・新築・交換などで不動産を手に入れたときにかかる<b>都道府県の税</b>です。</p><p>でも、<mark>相続（包括遺贈・相続人への特定遺贈を含む）</mark>や法人の合併による取得には、<b>かかりません</b>。</p>`,
 pt:"不動産取得税：相続・合併ではかからない（贈与ではかかる）",
 hon:"相続による不動産の取得に対しては、不動産取得税は課されない。"},
{c:"zei",lv:3,a:true,
 q:"床面積50㎡以上240㎡以下の新築住宅を取得したときは、不動産取得税の計算で、住宅の価格から1,200万円が差し引かれる。",
 exp:`<p>新築住宅の課税標準の特例です。<mark>床面積50㎡以上240㎡以下</mark>（貸家の共同住宅は1戸40㎡以上）なら、<mark>1,200万円</mark>を控除します。</p><p>税率は、住宅と土地が<b>3%</b>（本来は4%）です。</p>`,
 pt:"新築住宅（50〜240㎡）は1,200万円控除、住宅・土地の税率3%",
 hon:"新築住宅で床面積が50㎡以上240㎡以下のものを取得した場合、不動産取得税の課税標準の算定については、一戸につき1,200万円が価格から控除される。"},
{c:"zei",lv:2,a:true,
 q:"年の途中で土地を売っても、その年度の固定資産税を納めるのは、1月1日に固定資産課税台帳に持ち主として登録されていた人である。",
 exp:`<p>固定資産税の<mark>賦課期日は1月1日</mark>です。その日に持ち主として登録されている人が、1年分を納めます。</p><p>実際の取引では、売主と買主で日割りして精算することが多いですが、それは当事者の約束にすぎません。</p>`,
 pt:"固定資産税：1月1日の所有者（台帳に登録された人）が1年分",
 hon:"固定資産税は、賦課期日（1月1日）現在の所有者として固定資産課税台帳に登録されている者に課される。"},
{c:"zei",lv:3,a:true,
 q:"住宅が建っている土地の固定資産税は、200㎡以下の部分は課税標準が6分の1に、200㎡を超える部分は3分の1になる。",
 exp:`<p>住宅用地の課税標準の特例です。</p><p><mark>200㎡以下の部分（小規模住宅用地）＝6分の1</mark><br><mark>200㎡を超える部分＝3分の1</mark>（家屋の床面積の10倍まで）</p><p>新築住宅の家屋の税額の2分の1減額（期限付きの特例）とは別のルールです。</p>`,
 pt:"住宅用地：200㎡以下は1/6、超える部分は1/3",
 hon:"住宅用地のうち、小規模住宅用地（200㎡以下の部分）に対して課する固定資産税の課税標準は、価格の6分の1の額とする。"},
{c:"zei",lv:3,a:false,
 q:"土地を貸す契約書（土地の賃貸借契約書）には、印紙税がかからない。",
 exp:`<p>印紙税がかかるのは<mark>土地の賃貸借（地上権・賃借権の設定）の契約書</mark>です。</p><p>かからないのは<b>建物</b>の賃貸借の契約書です。土地と建物で逆になる点に注意しましょう。</p>`,
 pt:"印紙税：土地の賃貸借契約書は課税、建物の賃貸借契約書は非課税",
 hon:"土地の賃借権の設定に関する契約書には、印紙税は課されない。（→ 誤り）"},
{c:"zei",lv:3,a:true,
 q:"建物の売買契約書に、消費税の額がはっきり分けて書かれている場合、印紙税の計算に使う契約金額は、消費税を除いた金額になる。",
 exp:`<p>契約書に<mark>消費税額が区分して書かれていれば</mark>、税抜きの金額で印紙税を計算します。</p><p>土地には消費税がかからないので、建物部分だけの話です。</p>`,
 pt:"消費税額が区分記載されていれば、税抜金額で印紙税を判定",
 hon:"不動産の譲渡に関する契約書に消費税額が区分記載されている場合には、その消費税額は記載金額に含めない。"},
{c:"zei",lv:3,a:true,
 q:"自分が住んでいた家を、配偶者や子どもなどの親族に売った場合は、居住用財産の3,000万円特別控除を使うことができない。",
 exp:`<p>家族間の売買で税金を安くすることを防ぐため、<mark>配偶者・直系血族（親・子・孫）・生計を一にする親族など</mark>への売却には、3,000万円の特別控除は使えません。</p><p>また、前年・前々年にこの特例などを使っていると、使えません（3年に1回）。</p>`,
 pt:"3,000万円特別控除：配偶者・直系血族などへの譲渡は不可",
 hon:"居住用財産を配偶者や直系血族に譲渡した場合には、居住用財産を譲渡した場合の3,000万円特別控除の適用を受けることはできない。"},
{c:"zei",lv:2,a:true,
 q:"住宅金融支援機構は、銀行などが貸した住宅ローンの債権を買い取り、それをもとに証券を発行する業務（証券化支援業務）を行っている。",
 exp:`<p>住宅金融支援機構は、ふつうの人に直接お金を貸すのではなく、主に<mark>銀行の住宅ローンを買い取る</mark>ことで、長期固定金利の住宅ローン（<b>フラット35</b>）を支えています。</p><p>災害復興の住宅や、子育て世帯向けの賃貸住宅など、民間ではむずかしい分野では、<b>直接融資</b>も行います。</p>`,
 pt:"機構：証券化支援（買取型・保証型）が中心、災害復興などは直接融資",
 hon:"独立行政法人住宅金融支援機構は、民間金融機関が貸し付けた住宅の建設又は購入に必要な資金の貸付けに係る金融機関の貸付債権の譲受けを業務として行っている。"},
{c:"zei",lv:3,a:false,
 q:"すでに売れてしまった物件の広告を、そのまま出し続けても、不動産の表示に関する公正競争規約には違反しない。",
 exp:`<p>売れた物件や、実際には取引できない物件の広告を出し続けることは、<mark>おとり広告</mark>として禁止されています。</p><p>インターネット広告では、売れた物件を<b>すみやかに削除</b>しなければなりません。</p>`,
 pt:"成約済み物件の広告の継続はおとり広告",
 hon:"既に契約済みとなった物件について、広告を継続して掲載しても、不当表示には当たらない。（→ 誤り）"},
{c:"zei",lv:2,a:true,
 q:"台地や段丘は、一般に水はけがよく、地盤も安定しているので、宅地に向いている。",
 exp:`<p><mark>台地・段丘</mark>は、まわりより一段高い平らな土地で、水はけがよく、地盤が安定しています。宅地に向いています。</p><p>ただし、台地の中の<b>小さな谷（谷底低地）</b>や、<b>台地のふち（崖）</b>には注意が必要です。</p>`,
 pt:"台地・段丘は宅地向き（谷・崖の近くは注意）",
 hon:"台地、段丘は、農地として利用され、また都市的な土地利用も多く、地盤も安定している。"},
{c:"zei",lv:2,a:true,
 q:"海を埋め立てた埋立地は、一般に、海を干して作った干拓地よりも、水害などに対して安全である。",
 exp:`<p><b>干拓地</b>は、海や湖の水を抜いて作るので、土地が<b>海面より低い</b>ことが多く、水害に弱いです。</p><p><b>埋立地</b>は、土を盛って作るので、<mark>一般に海面より高く</mark>、干拓地より安全です（ただし地震の液状化には注意）。</p>`,
 pt:"埋立地は一般に干拓地より安全（干拓地は海面より低い）",
 hon:"埋立地は一般に海面に対して比高を持ち、干拓地に比べ、水害に対して安全である。"},
{c:"zei",lv:3,a:true,
 q:"木材は、よく乾燥している（含水率が小さい）ほど強い。",
 exp:`<p>木材は、<mark>含水率が小さい（乾燥している）ほど強度が大きく</mark>なります。</p><p>また、木の中心部の<b>心材</b>は、外側の辺材より腐りにくく、シロアリにも強いです。</p>`,
 pt:"木材は乾燥しているほど強い。心材は辺材より腐りにくい",
 hon:"木材の強度は、含水率が小さい状態の方が大きい。"},
{c:"zei",lv:3,a:true,
 q:"鉄筋コンクリートの鉄筋をおおうコンクリートの厚さ（かぶり厚さ）が足りないと、コンクリートが中性化したときに、中の鉄筋がさびやすくなる。",
 exp:`<p>コンクリートはアルカリ性で、中の鉄筋をさびから守っています。</p><p>年月がたつと空気中の二酸化炭素でコンクリートが<b>中性化</b>し、守る力が弱くなります。<mark>かぶり厚さが足りないと、中性化がすぐ鉄筋まで届き</mark>、鉄筋がさびてふくらみ、コンクリートを割ってしまいます。</p>`,
 pt:"かぶり厚さ不足 → 中性化で鉄筋がさびやすい",
 hon:"鉄筋コンクリート造においては、骨組みの形式はラーメン式の構造が一般に用いられ、かぶり厚さが不足すると、コンクリートの中性化により鉄筋が腐食しやすくなる。"},

 pt:"令和7年の新設住宅着工：約74万戸、6.5%減、3年連続減少",

{c:"zei",lv:2,a:true,
 q:"【統計・2026年度試験用】建築着工統計（令和7年計）によれば、令和7年の新設住宅着工戸数のうち、持家・貸家・分譲住宅は、いずれも前年より減少した。",
