    ["zei",/印紙/,G("印紙税の覚え方","はり忘れても契約は<b>有効</b>、でも罰は<b>3倍</b>","国・地方公共団体が作った文書は非課税。建物の賃貸借契約書は非課税、土地の賃貸借契約書は課税"),null],
    ["zei",/新築/,G("「新築」の覚え方","<b>1年未満</b> ＋ <b>だれも住んでいない</b>、の両方",""),null]
  ];
  Q.forEach(q=>{
    const t=q.q+" "+q.pt;
    for(const [c,re,g,f] of R){
      if(q.c!==c||!re.test(t))continue;
      if(g&&!q.goro)q.goro=g;
      if(f&&!q.fig)q.fig=f;
      if(q.goro&&q.fig)break;
    }
  });
  /* 個別の調整（自動で付けた組み合わせが合わないもの） */
  const byId=id=>Q.find(q=>q.id===id);
  const gName=t=>R.find(r=>r[2]&&r[2].t===t)[2];
  const TAX=G("「だれの税」の覚え方","<b>国</b>は<b>登録</b>と<b>印紙</b>、「ふどう」さんは<b>府道</b>（都道府県）、<b>固定</b>は<b>市町村</b>","登録免許税・印紙税＝国税／不動産取得税＝都道府県税／固定資産税＝市町村税");
  const OV={
    "gyo-21":{g:null,f:null},"gyo-22":{g:null,f:null},"gyo-66":{g:null,f:null},"gyo-69":{g:null},
    "gyo-42":{g:gName("35条・37条の覚え方"),f:"t3537"},
    "hou-27":{g:gName("建ぺい率・容積率の覚え方")},
    "zei-7":{g:TAX},"zei-41":{g:TAX},"zei-1":{g:TAX},"zei-4":{g:TAX},
    "zei-43":{g:gName("固定資産税の覚え方"),f:"menzei"},
    "zei-42":{f:"zei"},"zei-5":{f:null},"zei-13":{f:null},"zei-14":{f:null},"zei-15":{f:null}
  };
  for(const id in OV){const q=byId(id);if(!q)continue;const o=OV[id];
    if("g" in o){if(o.g)q.goro=o.g;else delete q.goro}
    if("f" in o){if(o.f)q.fig=o.f;else delete q.fig}}
  /* 語呂は、ネットで実在を確認できたものだけを表示する（2026-10-06 ユーザーの指示：自作の語呂は付けない）。
     まとめ表（fig）はそのまま残す。出典は n の末尾に書く。 */
  const SRC1="出典：独学で宅建合格（dokugaku.info）ほか";
  const SRC2="出典：宅建士スタイル「宅建 語呂合わせ一覧」";
  const KEEP={
    "8種制限の覚え方":q=>{q.goro.n+="（"+SRC1+"）"},
    "開発許可の覚え方":q=>{q.goro.n+="（"+SRC2+"）"},
    "第一種低層住居専用地域の覚え方":q=>{q.goro.n+="（"+SRC2+"）"},
    "抵当権の性質の覚え方":q=>{q.goro.n+="（"+SRC2+"）"},
    "相続分の覚え方":q=>{q.goro={t:"相続分の覚え方",g:"<b>子供・祖父母・兄弟姉妹</b>の<b>文字数</b>が分母になる。配偶者は残り",n:"子供（2文字）→子が1/2・配偶者1/2／祖父母（3文字）→直系尊属が1/3・配偶者2/3／兄弟姉妹（4文字）→兄弟姉妹が1/4・配偶者3/4（"+SRC2+"）"}},
    "防火・準防火の覚え方":q=>{q.goro={t:"防火・準防火の覚え方",g:"大会基準は<b>金</b>は<b>100</b>Mで<b>3</b>位以上、<b>銀</b>は<b>1500</b>Mで<b>4</b>位以上",n:"金＝防火地域：3階以上または延べ面積100㎡超は耐火建築物等／銀＝準防火地域：4階以上または延べ面積1,500㎡超は耐火建築物等（"+SRC2+"）"}}
  };
  Q.forEach(q=>{if(!q.goro)return;const k=KEEP[q.goro.t];if(!k){delete q.goro;return}q.goro=Object.assign({},q.goro);k(q)});

/* ---------- 自分メモ（問題ごとのメモと画像）：3つの学習アプリで共通の部品 ----------
   使い方：MyNote.init("保存名")。問題の画面に MyNote.slot(問題ID) を入れるだけ。
   画面を描き直すたびに、空の枠を自動で見つけて中身を入れる（MutationObserver）。
   保存：文字と画像は IndexedDB（この端末だけ）。メモのある問題の一覧だけ localStorage にも持つ（ホームの件数表示用）。 */
const MyNote = (() => {
  let DBN = "", IDXK = "", dbp = null, idx = {};
  const MAXW = 1600, QUAL = 0.85;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = `
.mynote{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.mynote.has{border-style:solid;border-color:var(--acc)}
.mynote .mn-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.mynote .mn-h small{font-weight:400;color:var(--muted);font-size:12px}
.mynote textarea{width:100%;box-sizing:border-box;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.7;background:var(--paper);color:var(--ink)}
.mynote .mn-imgs{display:flex;flex-wrap:wrap;gap:8px}
.mynote .mn-im{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.mynote .mn-im img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.mynote .mn-im button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:26px;padding:0;cursor:pointer}
.mynote .mn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mynote .mn-add{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
.mynote .mn-add input{display:none}
.mynote .mn-st{font-size:12px;color:var(--muted)}
.mn-zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;cursor:zoom-out}
.mn-zoom img{max-width:100%;max-height:100%;object-fit:contain}
.mn-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mn-tools label{cursor:pointer}
.mn-tools input{display:none}`;

  function db() {
    if (!dbp) dbp = new Promise((ok, ng) => {
      const r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = () => r.result.createObjectStore("notes");
      r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const d = await db();
    return new Promise((ok, ng) => { const t = d.transaction("notes", mode); const s = t.objectStore("notes"); const p = Promise.resolve(fn(s)); t.oncomplete = () => p.then(ok, ng); t.onerror = () => ng(t.error); t.onabort = () => ng(t.error); });
  }
  const req = r => new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
  const get = id => tx("readonly", s => req(s.get(id)));
  const put = (id, v) => tx("readwrite", s => { s.put(v, id); });
  const del = id => tx("readwrite", s => { s.delete(id); });
  /* 2つの読み出しを同時に出す（await をはさむと、途中で取引が閉じるブラウザがある） */
  const all = () => tx("readonly", s => Promise.all([req(s.getAllKeys()), req(s.getAll())]).then(([ks, vs]) => ks.map((k, i) => [k, vs[i]])));

  const saveIdx = () => { try { localStorage.setItem(IDXK, JSON.stringify(idx)); } catch (e) {} };
  function setIdx(id, v) { const has = !!(v && ((v.text || "").trim() || (v.imgs || []).length)); if (has) idx[id] = 1; else delete idx[id]; saveIdx(); return has; }

  /* 画像を縮小して JPEG の Blob にする（長い辺を最大1600px） */
  function shrink(file) {
    return new Promise((ok, ng) => {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = () => {
        const k = Math.min(1, MAXW / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(b => b ? ok(b) : ng(new Error("画像を変換できませんでした")), "image/jpeg", QUAL);
      };
      im.onerror = () => { URL.revokeObjectURL(url); ng(new Error("この画像は読み込めませんでした")); };
      im.src = url;
    });
  }

  function zoom(src) {
    const z = document.createElement("div"); z.className = "mn-zoom"; z.innerHTML = `<img src="${src}" alt="メモの画像（拡大）">`;
    z.addEventListener("click", () => z.remove()); document.body.appendChild(z);
  }

  async function mount(el) {
    if (el.dataset.mnOn) return; el.dataset.mnOn = "1";
    const id = el.dataset.q; let v = { text: "", imgs: [], ts: 0 };
    try { v = Object.assign(v, await get(id) || {}); } catch (e) {}
    const urls = [];
    const draw = () => {
      urls.forEach(u => URL.revokeObjectURL(u)); urls.length = 0;
      el.classList.toggle("has", !!((v.text || "").trim() || v.imgs.length));
      el.innerHTML = `<div class="mn-h"><span>自分メモ</span><small>${v.ts ? "保存：" + new Date(v.ts).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "この端末にだけ保存されます"}</small></div>
        <textarea placeholder="覚えたいこと・まちがえた理由・教科書のページなどを書けます" aria-label="この問題の自分メモ">${esc(v.text || "")}</textarea>
        <div class="mn-imgs">${v.imgs.map((b, i) => { const u = URL.createObjectURL(b); urls.push(u); return `<div class="mn-im"><img src="${u}" alt="メモの画像${i + 1}" data-i="${i}"><button type="button" aria-label="この画像を消す" data-del="${i}">×</button></div>`; }).join("")}</div>
        <div class="mn-row"><label class="mn-add">＋ 画像を追加<input type="file" accept="image/*" multiple></label><span class="mn-st" aria-live="polite"></span></div>`;
      const ta = el.querySelector("textarea"), st = el.querySelector(".mn-st");
      /* メモの入力中に、アプリの答えのキー（1〜4・O・X・Enter など）が反応しないようにする */
      ta.addEventListener("keydown", e => e.stopPropagation());
      let tm = null;
      ta.addEventListener("input", () => { v.text = ta.value; st.textContent = "保存中…"; clearTimeout(tm); tm = setTimeout(save, 500); });
      ta.addEventListener("blur", () => { if (tm) { clearTimeout(tm); save(); } });
      async function save() { tm = null; v.ts = Date.now(); try { if (setIdx(id, v)) await put(id, v); else await del(id); st.textContent = "保存しました"; el.classList.toggle("has", !!idx[id]); } catch (e) { st.textContent = "保存できませんでした（空き容量を確認してください）"; } }
      el.querySelector("input[type=file]").addEventListener("change", async e => {
        const fs = Array.from(e.target.files || []); if (!fs.length) return; st.textContent = "画像を保存中…";
        try { for (const f of fs) v.imgs.push(await shrink(f)); v.text = ta.value; v.ts = Date.now(); setIdx(id, v); await put(id, v); draw(); el.querySelector(".mn-st").textContent = fs.length + "枚の画像を保存しました"; }
        catch (err) { st.textContent = err.message || "画像を保存できませんでした"; }
      });
      el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
        if (!confirm("この画像を消しますか？")) return;
        v.imgs.splice(+b.dataset.del, 1); v.text = ta.value; v.ts = Date.now();
        try { if (setIdx(id, v)) await put(id, v); else await del(id); } catch (e) {} draw();
      }));
      el.querySelectorAll(".mn-im img").forEach(im => im.addEventListener("click", () => zoom(im.src)));
    };
    draw();
  }

  function scan(root) { (root || document).querySelectorAll(".mynote:not([data-mn-on])").forEach(mount); }

  /* ---- 書き出し・読み込み（機種変更やブラウザのデータ消去に備える） ---- */
  const b64 = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
  async function exportAll() {
    const rows = await all(); const out = [];
    for (const [k, v] of rows) out.push({ id: k, text: v.text || "", ts: v.ts || 0, imgs: await Promise.all((v.imgs || []).map(b64)) });
    const blob = new Blob([JSON.stringify({ app: DBN, v: 1, notes: out })], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = DBN + "-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return out.length;
  }
  async function importFile(file) {
    const j = JSON.parse(await file.text()); if (!j || !Array.isArray(j.notes)) throw new Error("メモのファイルではありません");
    let n = 0;
    for (const r of j.notes) {
      const imgs = await Promise.all((r.imgs || []).map(u => fetch(u).then(x => x.blob())));
      const cur = await get(r.id);
      /* すでにメモがあるときは、新しい方を残す */
      if (cur && (cur.ts || 0) > (r.ts || 0)) continue;
      const v = { text: r.text || "", imgs, ts: r.ts || Date.now() };
      if (setIdx(r.id, v)) { await put(r.id, v); n++; }
    }
    return n;
  }
  /* ホームに置く道具（件数・書き出し・読み込み）。onChange で画面を描き直す */
  function tools(onChange) {
    const wrap = document.createElement("div"); wrap.className = "mn-tools";
    wrap.innerHTML = `<button type="button" class="btn sub" data-mn="exp">メモを書き出す（保存用ファイル）</button><label class="btn sub">メモを読み込む<input type="file" accept="application/json,.json"></label><span class="mn-st mini"></span>`;
    const st = wrap.querySelector(".mn-st");
    wrap.querySelector("[data-mn=exp]").addEventListener("click", async () => { try { const n = await exportAll(); st.textContent = n + "問分のメモを書き出しました"; } catch (e) { st.textContent = "書き出せませんでした"; } });
    wrap.querySelector("input").addEventListener("change", async e => { const f = e.target.files[0]; if (!f) return; try { const n = await importFile(f); st.textContent = n + "問分のメモを読み込みました"; if (onChange) setTimeout(onChange, 800); } catch (err) { st.textContent = err.message || "読み込めませんでした"; } });
    return wrap;
  }

  return {
    init(name) {
      DBN = name; IDXK = name + "-idx";
      try { idx = JSON.parse(localStorage.getItem(IDXK) || "{}") || {}; } catch (e) { idx = {}; }
      const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
      /* ブラウザに「消さないで」と頼む（ホーム画面のアプリでは通常そのまま残る） */
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      new MutationObserver(() => scan()).observe(document.body, { childList: true, subtree: true });
      /* 記録の一覧を IndexedDB から作り直す（localStorage が消えた場合の保険） */
      all().then(rows => { idx = {}; rows.forEach(([k, v]) => setIdx(k, v)); }).catch(() => {});
      scan();
    },
    slot: id => `<div class="mynote" data-q="${esc(id)}"></div>`,
    ids: () => Object.keys(idx),
    has: id => !!idx[id],
    count: () => Object.keys(idx).length,
    tools
  };
})();

/* ---------- 問題の移動バーと問題一覧：3つの学習アプリで共通の部品 ----------
   問題画面の進み具合のバー（.qhead のすぐ後ろの .meter）を、指でなぞって問題を移動できるようにする。
   バーを長押し、または「一覧」ボタンで、問題の一覧（○×・まだ）を開き、タップでその問題へ移動する。
   QNav.init({ state: () => ({ n, cur, status: ["ok"|"mid"|"ng"|"", ...], text: k => "問題文" }) | null, jump: k => {...}, mark: (k, g) => {...} })
   state は問題画面のときだけ値を返す（それ以外は null）。画面の描き直しは MutationObserver で検出する。
   mark を渡すと、一覧の各行に ○・△・× のボタンが出て、評価を付け直せる（復習の予定 srs.js に反映する）。 */
const QNav = (() => {
  let OPT = null, sheet = null;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = s => String(s || "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  const css = `

.qn-wrap.drag .qn-tip{display:block}

.qn-sheet{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.qn-panel{background:var(--card,#fff);color:var(--ink,#222);width:100%;max-width:640px;max-height:82vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.qn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line,#ddd)}
.qn-head b{font-size:16px}
.qn-head small{color:var(--muted,#666);font-size:12px;display:block}

.qn-item{display:grid;grid-template-columns:44px 28px 1fr;align-items:center;gap:6px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line,#eee);background:transparent;color:inherit;padding:10px 8px;font-size:14px;line-height:1.5;cursor:pointer}

  function status() { try { return OPT && OPT.state(); } catch (e) { return null; } }
  /* バーの背景を、1問ずつ ○（赤）・×（灰青）・まだ（薄い色）で塗り分ける */
  function paint(meter, st) {
    const n = st.n, seg = [];
    for (let k = 0; k < n; k++) {
      const c = st.status[k] === "ok" ? "var(--maru,#cf3b2a)" : st.status[k] === "ng" ? "var(--batsu,#46566a)" : st.status[k] === "mid" ? "var(--sankaku,#d08a12)" : "transparent";
      seg.push(`${c} ${(k / n * 100).toFixed(3)}% ${((k + 1) / n * 100).toFixed(3)}%`);
    }
    const i = meter.querySelector("i"); if (i) i.style.opacity = ".35";
    meter.style.backgroundImage = `linear-gradient(90deg,${seg.join(",")})`;
  }
  function place(wrap, st, k) {
    const pos = st.n > 1 ? k / (st.n - 1) * 100 : 50;
    const kn = wrap.querySelector(".qn-knob"), tip = wrap.querySelector(".qn-tip");
    kn.style.left = pos + "%"; tip.style.left = Math.min(85, Math.max(15, pos)) + "%";
    tip.textContent = `${k + 1} / ${st.n}　${plain(st.text(k)).slice(0, 28)}`;
  }

  function enhance() {
    const st = status(); if (!st || !st.n) return;
    const head = document.querySelector(".qhead"); if (!head) return;
    const meter = head.nextElementSibling; if (!meter || !meter.classList.contains("meter") || meter.dataset.qn) return;
    meter.dataset.qn = "1";
    const wrap = document.createElement("div"); wrap.className = "qn-wrap";
    meter.parentNode.insertBefore(wrap, meter); wrap.appendChild(meter);
    wrap.insertAdjacentHTML("beforeend", `<span class="qn-knob" aria-hidden="true"></span><span class="qn-tip" aria-hidden="true"></span><input class="qn-range" type="range" min="1" max="${st.n}" step="1" value="${st.cur + 1}" aria-label="問題を移動（左右にずらす。長押しで一覧）">`);
    paint(meter, st); place(wrap, st, st.cur);
    if (!head.querySelector(".qn-btn")) head.insertAdjacentHTML("beforeend", `<button type="button" class="qn-btn" aria-label="問題の一覧を開く">一覧</button>`);
    head.querySelector(".qn-btn").addEventListener("click", open);
    const r = wrap.querySelector(".qn-range");
    let timer = null, moved = false, startX = 0;
    r.addEventListener("pointerdown", e => { moved = false; startX = e.clientX; clearTimeout(timer); timer = setTimeout(() => { if (!moved) { wrap.classList.remove("drag"); r.value = st.cur + 1; place(wrap, st, st.cur); open(); } }, 550); });
    r.addEventListener("pointermove", e => { if (Math.abs(e.clientX - startX) > 6) { moved = true; clearTimeout(timer); } });
    ["pointerup", "pointercancel", "pointerleave"].forEach(t => r.addEventListener(t, () => clearTimeout(timer)));
    /* 長押しで出るメニュー（iPhone）を出さない */
    r.addEventListener("contextmenu", e => { e.preventDefault(); clearTimeout(timer); open(); });
    r.addEventListener("input", () => { moved = true; clearTimeout(timer); wrap.classList.add("drag"); place(wrap, st, +r.value - 1); });
    r.addEventListener("change", () => { wrap.classList.remove("drag"); const k = +r.value - 1; if (k !== st.cur) OPT.jump(k); });
    /* キー操作が答えのキー（1〜4 など）に化けないようにする */
    r.addEventListener("keydown", e => e.stopPropagation());
  }

  function close() { if (sheet) { sheet.remove(); sheet = null; document.body.style.overflow = ""; } }
  const SYM = { ok: "○", mid: "△", ng: "×" };
  function listHtml(st) {
    const cnt = g => st.status.filter(s => s === g).length;
    const ok = cnt("ok"), mid = cnt("mid"), ng = cnt("ng"), canMark = !!OPT.mark;
    const rows = Array.from({ length: st.n }, (_, k) => {
      const s = st.status[k] || "";
      const item = `<button type="button" class="qn-item ${!canMark && k === st.cur ? "cur" : ""}" data-k="${k}"><span class="no">${k + 1}</span><span class="st ${s || "no"}">${SYM[s] || "－"}</span><span class="tx">${esc(plain(st.text(k)).slice(0, 80))}</span></button>`;
      if (!canMark) return item;
      return `<div class="qn-row ${k === st.cur ? "cur" : ""}">${item}<span class="qn-marks" role="group" aria-label="${k + 1}問目の評価">${["ok", "mid", "ng"].map(g => `<button type="button" class="qn-mk ${g} ${s === g ? "on" : ""}" data-k="${k}" data-g="${g}" aria-pressed="${s === g}" aria-label="${k + 1}問目を${{ ok: "○（できた）", mid: "△（あいまい）", ng: "×（まちがい）" }[g]}にする">${SYM[g]}</button>`).join("")}</span></div>`;
    }).join("");
    return `<div class="qn-panel"><div class="qn-head"><div><b>問題の一覧（全${st.n}問）</b><small>○ ${ok}・△ ${mid}・× ${ng}・まだ ${st.n - ok - mid - ng}　${canMark ? "問題文をタップで移動、右の○△×で評価を変更" : "タップでその問題へ"}</small></div><button type="button" class="qn-close" aria-label="閉じる">×</button></div>
      <div class="qn-legend"><span><b style="color:var(--maru,#cf3b2a)">○</b> できた</span><span><b style="color:var(--sankaku,#d08a12)">△</b> あいまい</span><span><b style="color:var(--batsu,#46566a)">×</b> まちがい</span><span><b style="color:var(--line,#bbb)">－</b> まだ</span></div>
      ${canMark ? `<div class="qn-legend" style="padding-top:2px">評価に合わせて、ホームの「今日の復習」に出ます（×・△は明日。○は明日→3日後→1週間後→2週間後→1か月後と間隔をのばす）。</div>` : ""}
      <div class="qn-list">${rows}</div></div>`;
  }
  function open() {
    const st = status(); if (!st) return; close();
    sheet = document.createElement("div"); sheet.className = "qn-sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", "問題の一覧");
    sheet.innerHTML = listHtml(st);
    sheet.addEventListener("click", e => {
      if (e.target === sheet || e.target.closest(".qn-close")) { close(); return; }
      const m = e.target.closest(".qn-mk");
      if (m) {
        const k = +m.dataset.k, g = m.dataset.g;
        OPT.mark(k, g);
        /* 一覧を開いたまま、行の表示と見出しの数を更新する（スクロール位置は保つ） */
        const ns = status(); if (!ns) return;
        const list = sheet.querySelector(".qn-list"), top = list ? list.scrollTop : 0;
        sheet.innerHTML = listHtml(ns);
        const nl = sheet.querySelector(".qn-list"); if (nl) nl.scrollTop = top;
        const b = sheet.querySelector(`.qn-mk[data-k="${k}"][data-g="${g}"]`); if (b) b.focus();
        return;
      }
      const b = e.target.closest(".qn-item"); if (b) { const k = +b.dataset.k; close(); if (k !== st.cur) OPT.jump(k); }
    });
    sheet.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Escape") close(); });
    document.body.appendChild(sheet); document.body.style.overflow = "hidden";
    const cur = sheet.querySelector(".qn-row.cur, .qn-item.cur"); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "center" });
    const c = sheet.querySelector(".qn-close"); if (c) c.focus();
  }

  return {
    init(opt) {
      OPT = opt;
      const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s);
      new MutationObserver(() => enhance()).observe(document.body, { childList: true, subtree: true });
      enhance();
    },
    open, close
  };
})();

/* ---------- 復習の予定（エビングハウスの忘却曲線）：3つの学習アプリで共通の部品 ----------
   問題ごとに ○（できた）・△（あいまい）・×（まちがい）の評価を持ち、次に出す日を決める。
   ○を重ねるほど間隔をのばす：翌日 → 3日後 → 1週間後 → 2週間後 → 1か月後 → 2か月後。
   △と×は翌日にもう一度（×は最初の段階からやり直し、△は段階を進めない）。
   同じ日に評価を付け直したときは、その日の最初の評価の前の段階から計算し直す（一覧で△に直したとき用）。
   SRS.init(保存名) / SRS.set(id, "ok"|"mid"|"ng") / SRS.grade(id) / SRS.isDue(id) / SRS.dueIds(ids) / SRS.seed(id, ok) */
const SRS = (() => {
  const GAP = [1, 3, 7, 14, 30, 60];
  let KEY = null, D = {};
  const css = `
.review{margin:14px 0;padding:14px 16px;border:2px solid var(--maru,#cf3b2a);border-radius:16px;background:var(--card,#fff)}
.review .rvhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.review .rvhead b{font-size:18px}
.review .rvhead small{color:var(--muted,#666);font-size:12px}
.review .rvnum{margin:8px 0 10px;font-size:15px}
.review .rvnum strong{font-size:26px;color:var(--maru,#cf3b2a);margin-right:2px}
.review .rvnote{margin:10px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted,#666)}
.review .btn{width:100%}
.selfmark{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:12px;background:var(--card,#fff)}
.selfmark>span{font-size:13px;font-weight:700;margin-right:2px}
.selfmark small{flex-basis:100%;color:var(--muted,#666);font-size:12px}
.smk{border:1.5px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:38px}
.smk.ok.on{background:var(--maru,#cf3b2a);border-color:var(--maru,#cf3b2a);color:#fff}
.smk.mid.on{background:var(--sankaku,#d08a12);border-color:var(--sankaku,#d08a12);color:#fff}
.smk.ng.on{background:var(--batsu,#46566a);border-color:var(--batsu,#46566a);color:#fff}`;
  const day = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return day(d.getTime()); };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} };
  function set(id, g) {
    const now = Date.now(), today = day(now);
    const r = D[id] || { st: 0 };
    if (r.t === undefined || day(r.t) !== today) r.base = r.st || 0;   // その日の最初の評価の前の段階
    const b = r.base || 0;
    if (g === "ok") { r.st = Math.min(b + 1, GAP.length); r.due = addDays(today, GAP[r.st - 1]); }
    else if (g === "mid") { r.st = b; r.due = addDays(today, 1); }
    else { r.st = 0; r.due = addDays(today, 1); }
    r.g = g; r.t = now; D[id] = r; save();
  }
  return {
    GAP,
    init(key) { KEY = key; try { const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st); } catch (e) {} try { D = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { D = {}; } },
    set,
    has: id => !!D[id],
    grade: id => (D[id] && D[id].g) || "",
    stage: id => (D[id] && D[id].st) || 0,
    /* 今日（または前から）予定日になっている問題 */
    isDue: id => !!(D[id] && D[id].due <= day(Date.now())),
    dueIds(ids) { const t = day(Date.now()); return ids.filter(id => D[id] && D[id].due <= t).sort((a, b) => ({ ng: 0, mid: 1, ok: 2 }[D[a].g] - { ng: 0, mid: 1, ok: 2 }[D[b].g]) || D[a].due - D[b].due); },
    /* 明日・1週間以内に予定がある問題の数 */
    upcoming(ids) { const t = day(Date.now()), t1 = addDays(t, 1), t7 = addDays(t, 7); let a = 0, w = 0; ids.forEach(id => { const r = D[id]; if (!r || r.due <= t) return; if (r.due <= t1) a++; if (r.due <= t7) w++; }); return { tomorrow: a, week: w }; },
    /* 今日つけた評価か */
    today: id => !!(D[id] && day(D[id].t) === day(Date.now())),
    /* この部品を入れる前の記録（○×だけ）から予定を作る：×は今日、○は3日後 */
    seed(id, ok) { if (D[id]) return; const t = day(Date.now()); D[id] = ok ? { st: 1, g: "ok", due: addDays(t, 3), t: 0 } : { st: 0, g: "ng", due: t, t: 0 }; },
    seedRaw(id, r) { if (!D[id]) D[id] = r; },
    /* 次に出す日の説明（「明日」「3日後」など） */
    nextLabel(id) { const r = D[id]; if (!r) return ""; const n = Math.round((r.due - day(Date.now())) / 864e5); return n <= 0 ? "今日" : n === 1 ? "明日" : n === 7 ? "1週間後" : n === 14 ? "2週間後" : n === 30 ? "1か月後" : n === 60 ? "2か月後" : n + "日後"; },
    flush: save,
    clear() { D = {}; save(); },
    /* 指定した問題の予定だけ消す（分野ごと・1問ごとのリセット） */
    del(ids) { ids.forEach(id => { delete D[id]; }); save(); },
    dump: () => D
  };
})();

/* ---------- レベル・並び ---------- */
const LV={1:{name:"基礎",sub:"ことばとしくみ"},2:{name:"標準",sub:"よく出るルール"},3:{name:"合格レベル",sub:"本番でまちがえやすい所"}};
const ORDER=["gyo","ken","hou","zei"];
const num=id=>+id.split("-")[1];
Q.sort((a,b)=>ORDER.indexOf(a.c)-ORDER.indexOf(b.c)||a.lv-b.lv||num(a.id)-num(b.id));
const QI={};Q.forEach(q=>QI[q.id]=q);
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
const isFalseHon=q=>/（→ 誤り）$/.test(q.hon);
const honText=q=>q.hon.replace(/（→ 誤り）$/,"");

/* ---------- 保存 ---------- */
const KEY="takken-ox-v1";
let store={res:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.res)store=s}catch(e){}
if(!store.ses)store.ses={};
if(!store.mocks)store.mocks=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const DAY=864e5;

/* ---------- 覚えた度合い（間隔をあけて復習） ----------
   正解を重ねるほど、次に出すまでの間隔を長くする：1日→3日→7日→21日 */
const GAP=[0,1,3,7,21];
function rec(id){const r=store.res[id];if(!r)return null;if(r.st===undefined){r.st=r.ok?1:0;r.t=r.t||0}return r}
function mark(id,ok){const r=rec(id)||{n:0,st:0,t:0};r.n=(r.n||0)+1;r.ok=ok;r.st=ok?Math.min((r.st||0)+1,4):0;r.t=Date.now();store.res[id]=r;SRS.set(id,ok?"ok":"ng")}
/* 復習の予定はエビングハウスの忘却曲線（共通部品 srs.js）：×・△は翌日、○は翌日→3日後→1週間後→2週間後→1か月後→2か月後 */
SRS.init("takken-ox-srs");
(()=>{const d0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()},td=d0(Date.now());
  Object.keys(store.res).forEach(id=>{const r=rec(id);if(!r)return;const st=r.ok?Math.max(r.st||1,1):0;
    SRS.seedRaw(id,{st,g:r.ok?"ok":"ng",due:r.ok?Math.max(d0((r.t||0)+GAP[Math.min(st,4)]*DAY),td):td,t:0})});SRS.flush()})();
const isDue=id=>SRS.isDue(id);
/* ○△×を付けたら「解いた」扱いにする（○＝正解、△・×＝まちがい・要復習） */
/* 「解いていない」状態に戻す：解答ずみの位置から外し、今の位置（次に解く所）に入れ直す */
function unsolveIn(v,set,fp){if(!v||!Array.isArray(v.list))return;
  const L=v.list.slice(),P=L.map((_,k)=>v.picks?v.picks[k]:undefined),R=fp?(v.results||[]).slice():null;
  let p=fp?R.length:v.i+(v.picked!==null&&v.picked!==undefined?1:0);const mv=[];
  for(let k=L.length-1;k>=0;k--){if(!set.has(L[k]))continue;if(k<p){mv.unshift(L[k]);L.splice(k,1);P.splice(k,1);if(fp)R.splice(k,1);p--}else P[k]=undefined}
  L.splice(p,0,...mv);P.splice(p,0,...mv.map(()=>undefined));
  v.list=L;v.picks=P;v.results=fp?R:(v.results||[]).filter(r=>!set.has(r.id));
  if(mv.length){v.i=Math.min(p,L.length-1);v.picked=null}}
function clearIds(ids,keys){const set=new Set(ids);ids.forEach(id=>{delete store.res[id]});SRS.del(ids);(keys||[]).forEach(k=>{delete store.ses[k]});
  Object.values(store.ses).forEach(v=>unsolveIn(v,set,false));
  if(S.view==="quiz"){unsolveIn(S,set,false);if(set.has(S.list[S.i]))S.picked=null;S.sel=[];saveSes()}save()}
const ASK="\n\n本当に消しますか？";
function rate(id,g){SRS.set(id,g);const r=rec(id)||{n:0,st:0,t:0};r.n=r.n||1;r.ok=g==="ok";if(!r.ok)r.st=0;else if(!r.st)r.st=1;r.t=Date.now();store.res[id]=r;save()}
const markOf=(id,answered)=>answered||SRS.today(id)?SRS.grade(id):"";
const reviewKey=()=>{const d=new Date();return "review:"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const mastered=id=>{const r=rec(id);return !!(r&&r.ok&&r.st>=2)};
const isOk=q=>{const r=rec(q.id);return !!(r&&r.ok)};
function stat(qs){return{n:qs.length,ok:qs.filter(isOk).length,done:qs.filter(q=>store.res[q.id]).length,m:qs.filter(q=>mastered(q.id)).length}}
const wrongIds=()=>Q.filter(q=>store.res[q.id]&&!store.res[q.id].ok).map(q=>q.id);
const setOf=(c,lv)=>Q.filter(q=>q.c===c&&(!lv||q.lv===lv));

/* ---------- 今日のおすすめ ----------
   ①まちがえた・忘れかけた問題 → ②まだ解いていない問題（基礎から・よく出る順・業法から） */
function todayList(){
  const due=Q.filter(q=>isDue(q.id)).sort((a,b)=>(rec(a.id).ok-rec(b.id).ok)||(rec(a.id).t-rec(b.id).t)).slice(0,12).map(q=>q.id);
  const FR={gyo:0,hou:1,zei:2,ken:3};
  const fresh=Q.filter(q=>!store.res[q.id]).sort((a,b)=>a.lv-b.lv||b.hi-a.hi||FR[a.c]-FR[b.c]||num(a.id)-num(b.id)).map(q=>q.id);
  return due.concat(fresh).slice(0,20);
}
const todayKey=()=>{const d=new Date();return "today:"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};

/* ---------- いまの実力の目安（覚えた問題の割合 × 本番の問題数） ---------- */
function estimate(){let s=0;ORDER.forEach(k=>{const st=stat(setOf(k));s+=st.n?st.m/st.n*FIELDS[k].exam:0});return Math.round(s)}

const app=document.getElementById("app");
MyNote.init("takken-ox-notes");
/* 進み具合のバーで問題を移動・長押しで一覧（共通部品 qnav.js） */
QNav.init({
  state:()=>S.view==="quiz"?{n:S.list.length,cur:S.i,status:S.list.map((id,k)=>{const ans=!(S.picks[k]===undefined||S.picks[k]===null);return markOf(id,ans)||(!ans?"":(S.picks[k]===QI[id].a?"ok":"ng"))}),text:k=>QI[S.list[k]].q}:null,

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(ids,label,from,key){S={view:"quiz",list:ids,i:0,picked:null,picks:[],results:[],label,from:from||null,key:key||null};saveSes();render();window.scrollTo(0,0)}
function resumeOr(key,make,label,from){
  if(validSes(key)){const v=store.ses[key];let i=v.i,picked=v.picked;
    if(picked!==null&&i+1<v.list.length){i++;picked=null}
    const picks=v.picks||[];if(!v.picks&&v.picked!==null)picks[v.i]=v.picked;
    S={view:"quiz",list:v.list,i,picked:picks[i]!==undefined?picks[i]:picked,picks,results:v.results||[],label:v.label,from:v.from||null,key};saveSes();render();window.scrollTo(0,0)}
  else{const ids=make();if(ids.length)start(ids,label,from,key)}
}
function mock(){let ids=[];ORDER.forEach(k=>{ids=ids.concat(shuffle(setOf(k).map(q=>q.id)).slice(0,FIELDS[k].exam))});return shuffle(ids)}
const MAKERS={mock:()=>mock(),all:()=>shuffle(Q.map(q=>q.id)),wrong:()=>wrongIds()};
function restart(){const k=S.key;dropSes(k);const make=k&&k.startsWith("today")?todayList:(MAKERS[k]||(()=>S.list));start(make(),S.label,S.from,k)}

/* ---------- 本番形式（4択・個数問題） ---------- */
const LEAD={gyo:"宅地建物取引業法の規定によれば、",ken:"民法等の規定によれば、",hou:"法令の規定によれば、",zei:""};
const KANA=["ア","イ","ウ","エ"];
/* 統計の文は、税金などの文と混ぜると不自然なので、本番形式の材料には使わない */
function poolOf(c){const all=Q.filter(q=>q.c===c&&!/^【統計/.test(q.q));return{T:shuffle(all.filter(q=>!isFalseHon(q))),F:shuffle(all.filter(q=>isFalseHon(q)))}}
function makeItem(c,used){
  const P=poolOf(c);const take=(arr,n)=>{const r=[];for(const q of arr){if(r.length>=n)break;if(!used.has(q.id)){r.push(q);used.add(q.id)}}return r};
  const roll=Math.random();
  if(roll<0.2){ /* 個数問題 */
    const nt=1+Math.floor(Math.random()*4);const st=shuffle(take(P.T,nt).concat(take(P.F,4-nt)));
    if(st.length<4)return null;
    return{c,type:"count",st:st.map(q=>q.id),ans:st.filter(q=>!isFalseHon(q)).length};
  }
  const wantTrue=roll<0.6; /* 正しいものはどれか */
  const one=take(wantTrue?P.T:P.F,1),three=take(wantTrue?P.F:P.T,3);
  if(one.length<1||three.length<3)return null;
  const st=shuffle(one.concat(three));
  return{c,type:wantTrue?"true":"false",st:st.map(q=>q.id),ans:st.indexOf(one[0])};
}
function makeExam(dist){const used=new Set(),items=[];
  ORDER.forEach(c=>{for(let k=0;k<dist[c];k++){const it=makeItem(c,used)||makeItem(c,new Set());if(it)items.push(it)}});
  return items}
function startExam(kind){
  const dist=kind==="ex50"?{gyo:20,ken:14,hou:8,zei:8}:{gyo:4,ken:3,hou:2,zei:1};
  let items=makeExam(dist);
  if(kind==="ex50"){/* 本番と同じ並び：権利→法令→税→業法 */const o={ken:0,hou:1,zei:2,gyo:3};items.sort((a,b)=>o[a.c]-o[b.c])}else items=shuffle(items);
  store.exam={kind,items,i:0,picked:null,answers:[],start:Date.now(),label:kind==="ex50"?"本番形式の模試":"4択で10問"};save();
  S.view="exam";render();window.scrollTo(0,0);
}
function fmtTime(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60);return (h?h+"時間":"")+(m%60)+"分"}
function examView(){
  const E=store.exam,it=E.items[E.i],f=FIELDS[it.c],answered=E.picked!==null;
  const qs=it.st.map(id=>QI[id]);
  const head=it.type==="count"?`次の記述のうち、${LEAD[it.c]}正しいものはいくつあるか。`:`次の記述のうち、${LEAD[it.c]}${it.type==="true"?"正しいもの":"誤っているもの"}はどれか。`;
  const opts=it.type==="count"?["一つ","二つ","三つ","四つ"]:["1","2","3","4"];
  const correctOpt=it.type==="count"?it.ans-1:it.ans;
  const elapsed=Date.now()-E.start;
  let out=header()+`<div class="qhead" style="--fc:${f.color}"><span class="fl">${f.name}</span><span class="chip l3">本番形式</span><span class="n">問${E.i+1} / ${E.items.length}</span></div>
  <div class="meter" aria-hidden="true"><i style="width:${(E.i+(answered?1:0))/E.items.length*100}%;background:${f.color}"></i></div>
  <div class="qtools">${E.i>0?`<button class="ghost back" data-act="exprev">← 前の問題</button>`:"<span></span>"}${E.kind==="ex50"?`<span class="timer">経過 ${fmtTime(elapsed)}（本番は2時間）</span>`:""}</div>
  <article class="qcard exq" style="--fc:${f.color}">
    <div class="qno">【問${E.i+1}】</div>
    <div class="exhead">${head}</div>
    <ol class="stl ${it.type==="count"?"kana":""}">${qs.map((q,i)=>`<li${answered?` class="${isFalseHon(q)?"sf":"st"}"`:""}><span class="sn">${it.type==="count"?KANA[i]:i+1}</span><span class="tx">${honText(q)}${answered?`<b class="tv">${isFalseHon(q)?"× 誤り":"○ 正しい"}</b>`:""}</span></li>`).join("")}</ol>
    <div class="opts">${opts.map((o,i)=>`<button class="opt ${answered?(i===correctOpt?"right":(i===E.picked?"wrongpick":"dim")):""}" data-act="expick" data-v="${i}" ${answered?"disabled":""}>${it.type==="count"?o:`<b>${o}</b>`}</button>`).join("")}</div>`;
  if(answered){
    const ok=E.picked===correctOpt;
    out+=`<div class="verdict ${ok?"ok":"ng"}" role="status"><span class="big">${ok?"○":"×"}</span><div><h3>${ok?"正解！":"ざんねん"}</h3><p>正解は「${opts[correctOpt]}」です。それぞれの文の解説は下にあります。</p></div></div>
    <div class="exexp">${qs.map((q,i)=>`<details class="stexp"><summary><span class="${isFalseHon(q)?"n":"y"}">${isFalseHon(q)?"×":"○"}</span> ${it.type==="count"?KANA[i]:i+1}　${q.pt}</summary>
      <div class="exp"><div class="body">${q.exp}</div>${figHtml(q)}${goroHtml(q)}</div></details>`).join("")}</div>
    <div class="qnav">${E.i>0?`<button class="btn sub" data-act="exprev">← 前の問題</button>`:""}<button class="btn" data-act="exnext" id="nextBtn">${E.i+1<E.items.length?"次の問題へ":"結果を見る"}</button></div>`;
  }
  out+=`</article>`;
  app.innerHTML=out;
}
function exPick(v){
  const E=store.exam;if(E.picked!==null)return;const it=E.items[E.i];
  const correctOpt=it.type==="count"?it.ans-1:it.ans;const ok=v===correctOpt;
  E.picked=v;E.answers[E.i]={v,ok};
  /* 4択の結果を、もとの○×問題の覚え具合にも反映する */
  if(it.type==="count"){it.st.forEach(id=>{if(!ok)mark(id,false)})}
  else{const key=it.st[it.ans];mark(key,ok);if(!ok)mark(it.st[v],false)}
  save();render();
  const v2=document.querySelector(".verdict");if(v2)v2.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function exPrev(){const E=store.exam;if(E.i>0){E.i--;const a=E.answers[E.i];E.picked=a?a.v:null;save();S.view="exam";render();window.scrollTo(0,0)}}
function exNext(){const E=store.exam;if(E.i+1<E.items.length){E.i++;const a=E.answers[E.i];E.picked=a?a.v:null;save();render();window.scrollTo(0,0)}else{
  const score=E.answers.filter(a=>a&&a.ok).length;
  if(!E.done){E.end=Date.now();E.done=true;if(E.kind==="ex50"){const d=new Date();store.mocks.push({score,date:(d.getMonth()+1)+"月"+d.getDate()+"日"});if(store.mocks.length>20)store.mocks.shift()}}
  save();S.view="exend";render();window.scrollTo(0,0)}}
function examEnd(){
  const E=store.exam;const n=E.items.length,score=E.answers.filter(a=>a&&a.ok).length;
  const by=ORDER.map(c=>{const idx=E.items.map((it,i)=>it.c===c?i:-1).filter(i=>i>=0);return{c,n:idx.length,ok:idx.filter(i=>E.answers[i]&&E.answers[i].ok).length}});
  const big=E.kind==="ex50";
  const msg=big?(score>=38?"合格ラインを十分にこえています。この調子で本番へ。":score>=35?"合格ライン付近です。まちがえた所を復習して、安定して38点を目指しましょう。":"まだ合格ラインに届いていません。「今日のおすすめ」を毎日続けて、もう一度挑戦しましょう。"):"まちがえた問題に入っていた文は、自動で復習に回ります。";
  app.innerHTML=header()+`<section class="end">
    <span class="qhead">${E.label} の結果${E.end&&big?`（かかった時間 ${fmtTime(E.end-E.start)}）`:""}</span>
    <div class="score">${score}<small> / ${n}${big?"点":"問"}</small></div>
    <p style="margin:0">${msg}</p>
    <div class="byf">${by.filter(b=>b.n).map(b=>`<div style="--fc:${FIELDS[b.c].color}"><span>${FIELDS[b.c].name}</span><b>${b.ok} / ${b.n}</b></div>`).join("")}</div>
    <div class="row"><button class="btn" data-act="${E.kind}">もう一度（新しい問題で）</button><button class="btn sub" data-act="home">ホームへ</button></div>
    <div class="miss"><b style="font-size:14px">問題を見直す</b>${E.items.map((it,i)=>{const a=E.answers[i];return `<button data-act="exreview" data-i="${i}"><b class="${a&&a.ok?"okm":""}">${a?(a.ok?"○":"×"):"－"}</b>問${i+1}（${FIELDS[it.c].name}）${QI[it.st[0]].pt}…</button>`}).join("")}</div>
  </section>`;
}

function render(){({home,quiz,end,exam:examView,exend:examEnd})[S.view]();if(S.view==="quiz")resetBar()}
const QI_=id=>QI[id],FKEY=q=>q.c;
/* 問題画面のいちばん下のリセット（この問題／この単元を選ぶ） */
function resetBar(){const q=QI_(S.list[S.i]);if(!q)return;const c=FKEY(q),f=FIELDS[c];const d=document.createElement("div");d.className="rbar";
  d.innerHTML=`<button type="button" class="ghost" data-act="rmenu">リセット</button><div class="rmenu" hidden><p>どちらをリセットしますか？（まだ解いていない状態に戻します）</p><button type="button" class="ghost" data-act="qclr">この問題をリセット</button><button type="button" class="ghost" data-act="resetf" data-c="${c}"${q.g?` data-g="${q.g}"`:""}>この単元（${f.name}）をリセット</button><button type="button" class="ghost" data-act="rmenu">やめる</button></div>`;
  app.appendChild(d)}


function pick(v){
  if(S.picked!==null)return;
  const q=QI[S.list[S.i]];S.picked=v;S.picks[S.i]=v;
  const ok=v===q.a;mark(q.id,ok);S.results.push({id:q.id,ok});saveSes();save();
  render();
  const v2=document.querySelector(".verdict");if(v2)v2.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function next(){if(S.i+1<S.list.length){S.i++;S.picked=S.picks[S.i]!==undefined?S.picks[S.i]:null;saveSes();render();window.scrollTo(0,0)}else{dropSes(S.key);S.view="end";render();window.scrollTo(0,0)}}
/* 前の問題へ戻る（答えと解説を表示する） */
function prev(){if(S.i>0){S.i--;S.picked=S.picks[S.i]!==undefined?S.picks[S.i]:null;saveSes();render();window.scrollTo(0,0)}}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="home"){S.view="home";render();window.scrollTo(0,0)}
  else if(a==="review"){const k=reviewKey();Object.keys(store.ses).forEach(x=>{if(x.startsWith("review:")&&x!==k)delete store.ses[x]});resumeOr(k,()=>SRS.dueIds(Q.map(q=>q.id)),"今日の復習")}
  else if(a==="smark"){rate(S.list[S.i],b.dataset.g);render()}
  else if(a==="today"){const k=todayKey();Object.keys(store.ses).forEach(x=>{if(x.startsWith("today")&&x!==k)delete store.ses[x]});resumeOr(k,todayList,"今日のおすすめ")}
  else if(a==="lv"){const c=b.dataset.c,l=+b.dataset.lv;resumeOr(c+":"+l,()=>setOf(c,l).map(q=>q.id),FIELDS[c].name+"・"+LV[l].name,{c,lv:l})}
  else if(a==="mock"){resumeOr("mock",mock,"○×で本番の配分50問")}
  else if(a==="all"){resumeOr("all",()=>shuffle(Q.map(q=>q.id)),"全問シャッフル")}
  else if(a==="wrong"){if(validSes("wrong")||wrongIds().length)resumeOr("wrong",wrongIds,"まちがえた問題")}
  else if(a==="resume"){const k=b.dataset.k,v=store.ses[k];if(v)resumeOr(k,()=>v.list,v.label,v.from)}
  else if(a==="drop"){dropSes(b.dataset.k);render()}
  else if(a==="restart"){restart()}
  else if(a==="retry"){start(S.results.filter(r=>!r.ok).map(r=>r.id),"やり直し")}
  else if(a==="one"){start([b.dataset.id],"1問だけ")}
  else if(a==="pick"){pick(b.dataset.v==="1")}
  else if(a==="next"){next()}
  else if(a==="prev"){prev()}
  else if(a==="review"){S.key=null;S.i=+b.dataset.i;S.picked=S.picks[S.i]!==undefined?S.picks[S.i]:null;S.view="quiz";render();window.scrollTo(0,0)}
  else if(a==="exprev"){exPrev()}
  else if(a==="exreview"){const E=store.exam;E.i=+b.dataset.i;const x=E.answers[E.i];E.picked=x?x.v:null;S.view="exam";render();window.scrollTo(0,0)}
  else if(a==="ex10"||a==="ex50"){startExam(a)}
  else if(a==="exresume"){S.view="exam";render();window.scrollTo(0,0)}
  else if(a==="memo"){const ids=MyNote.ids().filter(id=>QI[id]);if(ids.length)start(shuffle(ids),"メモした問題")}
  else if(a==="exdrop"){delete store.exam;save();render()}
  else if(a==="expick"){exPick(+b.dataset.v)}
  else if(a==="exnext"){exNext()}
  else if(a==="reset"){
    if(confirm("全部の問題を「まだ解いていない」状態に戻します（正解・まちがい、○△×の評価、復習の予定、途中の続き、模擬試験の結果を消します）。自分メモは残ります。"+ASK)){store={res:{},ses:{},mocks:[]};save();SRS.clear();render()}
  }
  else if(a==="rmenu"){const m=document.querySelector(".rmenu");if(m){m.hidden=!m.hidden;if(!m.hidden)m.scrollIntoView({block:"nearest"})}}
  else if(a==="resetf"){
    const c=b.dataset.c,ids=setOf(c).map(q=>q.id),n=ids.filter(id=>store.res[id]||SRS.has(id)).length;
    if(confirm(`「${FIELDS[c].name}」の${n}問を「まだ解いていない」状態に戻します。\n正解・まちがい、○△×の評価、復習の予定、この分野の途中の続きが消えます。自分メモは残ります。`+ASK)){clearIds(ids,Object.keys(store.ses).filter(k=>k.startsWith(c+":")));render()}
  }
  else if(a==="qclr"){
    const id=S.list[S.i];
    if(confirm("この問題を「まだ解いていない」状態に戻します（正解・まちがい、○△×の評価、復習の予定を消します）。自分メモは残ります。"+ASK)){clearIds([id]);render()}
  }
});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&/^(TEXTAREA|INPUT)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k==="arrowleft"){if(S.view==="quiz")prev();else if(S.view==="exam")exPrev();return}
  if(S.view==="quiz"){
    if(S.picked===null){if(k==="o"||k==="1")pick(true);else if(k==="x"||k==="2")pick(false)}
    else if(k==="enter"||k==="n"||k===" "){if(document.activeElement&&document.activeElement.id!=="nextBtn"){e.preventDefault();next()}}
  }else if(S.view==="exam"&&store.exam){
    if(store.exam.picked===null&&/^[1-4]$/.test(k))exPick(+k-1);
    else if(store.exam.picked!==null&&(k==="enter"||k==="n")){if(document.activeElement&&document.activeElement.id!=="nextBtn"){e.preventDefault();exNext()}}
  }
});
render();
</script>
